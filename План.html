    : 'Все';
  const checkboxes = items.map(v => `<label style="display:grid;grid-template-columns:16px 1fr;align-items:center;column-gap:8px;margin-bottom:5px;cursor:pointer">
    <input type="checkbox" value="${esc(String(v))}" ${(!sel.size || sel.has(String(v))) ? 'checked' : ''} style="width:14px;height:14px;margin:0;accent-color:#2563eb">
    <span style="font-size:12px;color:#1e293b">${esc(labelFn ? labelFn(v) : String(v))}</span>
  </label>`).join('');
  return `<details style="position:relative">
    <summary class="cbf-trigger">${esc(summary)}</summary>
    <div onclick="event.stopPropagation()" style="position:absolute;top:calc(100%+4px);left:0;z-index:40;background:#fff;border:1px solid #d1d5db;border-radius:6px;box-shadow:0 8px 20px rgba(0,0,0,.12);padding:8px;max-height:220px;overflow:auto;min-width:180px">
      <div id="${listId}">${checkboxes}</div>
      <div style="display:flex;justify-content:space-between;margin-top:8px;padding-top:6px;border-top:1px solid #e2e8f0;gap:6px">
        <button type="button" class="btn btn-outline btn-sm" onclick="event.stopPropagation();document.querySelectorAll('#${listId} input').forEach(el=>el.checked=true);${applyFn}()">Все</button>
        <button type="button" class="btn btn-primary btn-sm" onclick="event.stopPropagation();${applyFn}()">OK</button>
      </div>
    </div>
  </details>`;
}

function resetMacroFilters() {
  macroFilters = { articleItem: '', contractNumber: '', assortment: '', workshops: [], months: [] };
  renderMacroplan();
}

/** Подсветка всех ячеек с тем же артикулом изделия или тем же наименованием (макроплан). */
function macroPlanHl(el, on) {
  if (!el) return;
  const a = el.getAttribute('data-mp-art') || '';
  const n = el.getAttribute('data-mp-nm') || '';
  document.querySelectorAll('td.mp-macro-pair').forEach(td => {
    const ta = td.getAttribute('data-mp-art') || '';
    const tn = td.getAttribute('data-mp-nm') || '';
    const match = (a && ta === a) || (n && tn === n);
    if (match) td.classList.toggle('mp-macro-hl', !!on);
  });
}

function renderMacroplan() {
  migrateMacroplanProcessQty();
  const el = document.getElementById('tab-macroplan');
  const allOps = [...new Set(S.ops.map(o => o.name))].sort((a, b) => a.localeCompare(b, 'ru'));
  const selectedOps = macroSelectedOps();
  const opSet = new Set(selectedOps);
  const opMatches = (opName) => !opSet.size || opSet.has(opName);
  const opsForForm = selectedOps.length ? selectedOps : allOps;
  if (!macroCtx.formOp || !opsForForm.includes(macroCtx.formOp)) macroCtx.formOp = opsForForm[0] || '';
  const formOp = macroCtx.formOp || '';

  if (!allOps.length) {
    el.innerHTML = `<div class="sec-title">Макроплан</div><p style="padding:20px;color:#64748b">Сначала заполните справочник ОП / Цеха.</p>`;
    return;
  }

  const opItems = allNomArticleItems(formOp);
  const opWorkshops = [...new Set(S.ops.filter(o => o.name === formOp).map(o => o.workshop))];
  const contractDatalist = S.contracts.map(c=>`<option value="${esc(c.number)}">`).join('');
  const itemOpts = opItems.map(ai=>`<option value="${esc(ai)}">${esc(ai)}</option>`).join('');
  const workshopOpts = opWorkshops.map(ws=>`<option value="${esc(ws)}">${esc(ws)}</option>`).join('');

  const macroRowsForOps = S.macroplan.filter(r => opMatches(r.op));
  const artOpts = [...new Set(macroRowsForOps.map(r => r.articleItem))].sort((a, b) => String(a).localeCompare(String(b), 'ru'));
  const contractOptsF = [...new Set(macroRowsForOps.map(r => {
    const c = byId(S.contracts, r.contractId);
    return c ? c.number : '';
  }).filter(Boolean))].sort((a, b) => String(a).localeCompare(String(b), 'ru'));
  const assortOpts = [...new Set(S.nomenclature.map(n => String(n.assortmentGroup || '').trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ru'));

  let html = `<div class="sec-title">Макроплан</div>
  <div class="ctx-bar mac-ctx-one">
    <label>ОП
    <details id="mac-op-dd" style="position:relative" ontoggle="if(this.open){const d=this.querySelector('div');if(d)d.scrollTop=0}">
      <summary class="cbf-trigger">${esc(macroOpsSummary(allOps))}</summary>
      <div onclick="event.stopPropagation()" style="position:absolute;top:calc(100% + 4px);left:0;z-index:40;background:#fff;border:1px solid #d1d5db;border-radius:6px;box-shadow:0 8px 20px rgba(0,0,0,.12);padding:8px;max-height:220px;overflow:auto;min-width:230px">
        <div id="mac-op-list">
          ${allOps.map(opName => `<label style="display:grid;grid-template-columns:16px 1fr;align-items:center;column-gap:8px;margin-bottom:6px;white-space:nowrap;cursor:pointer">
            <input type="checkbox" value="${esc(opName)}" ${(!selectedOps.length || opSet.has(opName)) ? 'checked' : ''} style="width:14px;height:14px;margin:0;accent-color:#2563eb;justify-self:start">
            <span style="font-size:12px;color:#1e293b">${esc(opName)}</span>
          </label>`).join('')}
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:6px;border-top:1px solid #e2e8f0;gap:8px">
          <button type="button" class="btn btn-outline btn-sm" onclick="event.stopPropagation();document.querySelectorAll('#mac-op-list input[type=checkbox]').forEach(el=>el.checked=true);macroApplyOpsFromChecks()">Все</button>
          <button type="button" class="btn btn-primary btn-sm" onclick="event.stopPropagation();macroApplyOpsFromChecks()">Применить</button>
        </div>
      </div>
    </details>
    </label>
    <label>Артикул
      <select onchange="macroFilters.articleItem=this.value;renderMacroplan()">
        <option value="">Все</option>
        ${artOpts.map(ai => `<option value="${esc(ai)}" ${macroFilters.articleItem === ai ? 'selected' : ''}>${esc(ai)}</option>`).join('')}
      </select>
    </label>
    <label>Контракт
      <select onchange="macroFilters.contractNumber=this.value;renderMacroplan()">
        <option value="">Все</option>
        ${contractOptsF.map(num => `<option value="${esc(num)}" ${macroFilters.contractNumber === num ? 'selected' : ''}>${esc(num)}</option>`).join('')}
      </select>
    </label>
    <label>Ассорт. группа
      <select onchange="macroFilters.assortment=this.value;renderMacroplan()">
        <option value="">Все</option>
        ${assortOpts.map(ag => `<option value="${esc(ag)}" ${macroFilters.assortment === ag ? 'selected' : ''}>${esc(ag)}</option>`).join('')}
      </select>
    </label>
    <label>Цех
      ${(() => {
        const allWs = [...new Set(S.macroplan.filter(r => !macroSelectedOps().length || macroSelectedOps().includes(r.op)).map(r => r.workshop || '').filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ru'));
        return allWs.length ? checkboxFilterHtml('mac-ws-list', allWs, macroFilters.workshops || [], 'macroApplyWorkshopsFromChecks') : '<span style="font-size:12px;color:#94a3b8">—</span>';
      })()}
    </label>
    <label>Месяц
      ${(() => {
        const allM = [...new Set(S.macroplan.map(r => r.month || '').filter(Boolean))].sort();
        return allM.length ? checkboxFilterHtml('mac-month-list', allM, macroFilters.months || [], 'macroApplyMonthsFromChecks', m => mlabel(m)) : '<span style="font-size:12px;color:#94a3b8">—</span>';
      })()}
    </label>
  </div>`;

  const formWorkshop = macroCtx.formWorkshop || '';
  const formContract = macroCtx.formContract || '';
  const filteredItems = allNomArticleItemsFiltered(formOp, formContract, formWorkshop);
  const filteredItemOpts = filteredItems.map(ai => `<option value="${esc(ai)}"${ai === lastFormInput.articleItem ? ' selected' : ''}>${esc(ai)}</option>`).join('');
  const filteredWorkshopOpts = opWorkshops.map(ws => `<option value="${esc(ws)}"${ws === formWorkshop ? ' selected' : ''}>${esc(ws)}</option>`).join('');
  const normVal = (formOp && lastFormInput.articleItem) ? timeCostOf(lastFormInput.articleItem, formOp) : 0;
  const initMonth = lastFormInput.month || '';
  if (initMonth) MPS['mpf-month'] = { year: +initMonth.split('-')[0], value: initMonth };

  html += `<datalist id="mpf-c-list">${contractDatalist}</datalist>
  <div class="add-form">
    <label>ОП
      <select class="w160" id="mpf-op" onchange="macroCtx.formOp=this.value;macroCtx.formWorkshop='';macroFormUpdateWorkshops()">
        <option value="">— выбрать —</option>
        ${opsForForm.map(o=>`<option ${formOp===o?'selected':''} value="${esc(o)}">${esc(o)}</option>`).join('')}
      </select>
    </label>
    <label>Контракт<input class="w180" id="mpf-c" list="mpf-c-list" placeholder="номер контракта" value="${esc(formContract)}" oninput="macroFormUpdateArticles()"></label>
    <label>Цех
      <select class="w160" id="mpf-ws" onchange="macroCtx.formWorkshop=this.value;macroFormUpdateArticles()">
        <option value="">— выбрать —</option>${filteredWorkshopOpts}
      </select>
    </label>
    <label>Артикул изделия
      <select class="w160" id="mpf-item" onchange="macroFormUpdateNorm()">
        <option value="">— выбрать —</option>${filteredItemOpts}
      </select>
    </label>
    <label>Норма, мин/шт<input class="w80" id="mpf-norm" type="number" min="0" step="0.01" placeholder="${normVal > 0 ? normVal : '—'}" value="${normVal > 0 ? normVal : ''}" oninput="this._userEdited=true" title="Норма из номенклатуры подставляется автоматически, можно скорректировать"></label>
    <label>Месяц${mpWidget('mpf-month', lastFormInput.month || '')}</label>
    <label>Эфф.%<input class="w64" id="mpf-eff" type="number" min="0" max="999" step="1" value="100" placeholder="100"></label>
    <label>Кол-во, шт<input class="w64" id="mpf-qty-sew" type="number" min="0" placeholder="0"></label>
    <label>Тип объёма
      <select class="w120" id="mpf-vol-type">
        <option value="main">Основные</option>
        <option value="extra">Доп. объёмы</option>
      </select>
    </label>
    <button class="btn btn-primary" onclick="addMacro()">+ Добавить</button>
  </div>`;

  if (!macroRowsForOps.length) {
    el.innerHTML = html + `<p style="padding:20px;color:#64748b">Нет данных по выбранному фильтру ОП. Используйте форму выше для добавления.</p>`;
    mpGrid('mpf-month');
    return;
  }

  const macroRowsVisible = macroRowsForOps.filter(macroRowPassesFilters);
  if (!macroRowsVisible.length) {
    el.innerHTML = html + `<p style="padding:20px;color:#64748b">Нет строк макроплана по выбранным фильтрам таблицы. Сбросьте фильтры или измените критерии.</p>`;
    mpGrid('mpf-month');
    return;
  }

  const months = [...new Set(macroRowsVisible.map(r => r.month))].sort();

  const rowKeys = [...new Map(
    macroRowsVisible
      .map(r => [
        `${r.contractId}|${r.articleItem}|${r.op}|${r.workshop || ''}|${r.volumeType || 'main'}`,
        { contractId: r.contractId, articleItem: r.articleItem, op: r.op, workshop: (r.workshop || ''), volumeType: (r.volumeType || 'main') }
      ])
  ).values()];

  const rowsByOp = new Map();
  for (const row of rowKeys) {
    const opKey = row.op || '';
    if (!rowsByOp.has(opKey)) rowsByOp.set(opKey, []);
    rowsByOp.get(opKey).push(row);
  }
  const opOrder = [...rowsByOp.keys()].sort((a, b) => String(a).localeCompare(String(b), 'ru'));

  function frvFromSchedForOps(ops, ym) {
    return ops.reduce((s, opName) => s + frvNominalFromSchedOp(opName, ym), 0);
  }

  function frvEffectiveFromSchedForOps(ops, ym) {
    return ops.reduce((s, opName) => s + frvEffectiveForMacroLoad(opName, ym), 0);
  }

  const opsUsed = selectedOps.length ? selectedOps : allOps;
  const monthHeaders = months.map(m =>
    `<th class="mp-st-month" style="text-align:center">${esc(mlabel(m))}</th>`
  ).join('');

  const macroTableColspan = 10 + months.length;

  html += `<div id="macro-plan-scroll" class="table-wrap mac-plan-scroll"><table><thead>
      <tr>
      <th class="mp-st-1">Контракт</th><th class="mp-st-2">Артикул изделия</th><th class="mp-st-3">Наименование изделия</th><th class="mp-st-4">ОП / Цех</th><th class="mp-st-5">Норма<br><span style="font-weight:400;font-size:11px">мин/шт</span></th><th class="mp-st-6">Итого<br>план</th>
      ${monthHeaders}
      <th>Факт<br>выпуска</th>
      <th title="Заказы на производство, привязанные к контракту">Заказы на пр-во</th>
      <th>Тип</th><th></th>
      </tr>
  </thead><tbody>`;

  for (const opName of opOrder) {
    html += `<tr class="mp-op-head"><td colspan="${macroTableColspan}">${esc(opName || '—')}</td></tr>`;
    for (const row of rowsByOp.get(opName)) {
    const c = byId(S.contracts, row.contractId);
    const aiR = row.articleItem;
    const opR = row.op;
    const tcSew = timeCostForProcess(aiR, opR, 'SEW');
    const _isRcRow = (() => { for (const n of S.nomenclature) { for (const item of (n.route||[])) { if (item.articleItem === aiR && item.stage === 'РЦ') return true; } } return false; })();
    const _firstMacroEntry = S.macroplan.find(r => r.contractId === row.contractId && r.articleItem === aiR && r.op === opR && (r.workshop||'') === row.workshop && (r.volumeType||'main') === row.volumeType);
    const _macroRelOrd = _firstMacroEntry?.macroReleaseOrder || '';
    const _tcRcOverrideVal = _macroRelOrd && S.tcRcOverrides?.[_macroRelOrd] != null ? +S.tcRcOverrides[_macroRelOrd] : null;
    const _tcRc = _isRcRow ? (_tcRcOverrideVal ?? timeCostForProcess(aiR, opR, 'RC')) : 0;
    const _normOverrideVal = _firstMacroEntry?.normOverride ?? null;
    const _displayNorm = _isRcRow ? _tcRc : (_normOverrideVal ?? tcSew);
    const tcNorms = _isRcRow
      ? `<input type="number" min="0" step="0.01" value="${_tcRc}" style="width:60px;font-size:11px;text-align:center;border:1px solid #bfdbfe;border-radius:4px;background:${_tcRcOverrideVal != null ? '#fef9c3' : '#eff6ff'};padding:1px 3px" title="Норма РЦ${_tcRcOverrideVal != null ? ' — ПЗ «' + _macroRelOrd + '»' : ''}" onkeydown="if(event.key==='Enter')this.blur()" onblur="updMacroRowTcRc(${row.contractId},'${esc(aiR)}','${esc(opR)}','${esc(row.workshop)}','${esc(row.volumeType)}',this.value)">`
      : `<input type="number" min="0" step="0.01" value="${_displayNorm||''}" placeholder="${tcSew||''}" style="width:60px;font-size:11px;text-align:center;border:1px solid ${_normOverrideVal != null ? '#f59e0b' : '#e2e8f0'};border-radius:4px;background:${_normOverrideVal != null ? '#fef9c3' : 'transparent'};padding:1px 3px" title="Норма${_normOverrideVal != null ? ' (скорректирована)' : ' из номенклатуры'}" onkeydown="if(event.key==='Enter')this.blur()" onblur="updMacroGroupNorm(${row.contractId},'${esc(aiR)}','${esc(opR)}','${esc(row.workshop||'')}','${row.volumeType||'main'}',this.value)">`;
    const totalPlan = S.macroplan
      .filter(r=>r.contractId===row.contractId && r.articleItem===row.articleItem && r.op===row.op && (r.workshop || '') === row.workshop && (r.volumeType||'main') === row.volumeType)
      .reduce((s,r)=>s+macroRowKitQuantity(r), 0);
    const cidMacro = contractIdSetForMacro(row.contractId);
    const factTotal = S.microplan
      .filter(m => microRowMatchesMacroFact(m, row, cidMacro))
      .reduce((s, m) => s + (+m.factRelease || 0), 0);

    const cells = months.map(m => {
      const existing = S.macroplan.find(
        r=>r.contractId===row.contractId && r.articleItem===row.articleItem && r.op===row.op && (r.workshop || '') === row.workshop && r.month===m && (r.volumeType||'main') === row.volumeType
      );
      if (existing) {
        const factM = S.microplan
          .filter(x => microRowMatchesMacroFact(x, row, cidMacro) && x.date && x.date.slice(0, 7) === m)
          .reduce((s, x) => s + (+x.factRelease || 0), 0);
        const qSw = macroRowKitQuantity(existing);
        const effV = existing.eff != null ? +existing.eff : 100;
        return `<td class="mp-st-month" style="text-align:center;min-width:90px">
          <div style="display:flex;flex-direction:column;align-items:center;gap:2px">
            <input type="number" min="0" value="${qSw}" style="width:72px;text-align:center;padding:2px 4px" onblur="updMacroCell(${existing.id},+this.value)">
            <span style="font-size:10px;color:#64748b">факт: ${factM}</span>
            <label style="display:flex;align-items:center;gap:3px;font-size:10px;color:#64748b;margin-top:1px">эфф:<input type="number" min="0" max="999" step="1" value="${effV}" style="width:44px;font-size:10px;padding:1px 3px;text-align:center" onkeydown="if(event.key==='Enter')this.blur()" onblur="updMacroCellEff(${existing.id},+this.value)">%</label>
          </div>
          </td>`;
      }
      return `<td class="mp-st-month" style="text-align:center;color:#475569">—</td>`;
    }).join('');

    const openProd = openInProductionForMacroRow(row);
    const nmDisp = routeNameOf(row.articleItem) || '';
    const artAttr = esc(row.articleItem || '');
    const nmAttr = esc(nmDisp);

    const allGroupRows = S.macroplan.filter(r => r.contractId===row.contractId && r.articleItem===row.articleItem && r.op===row.op && (r.workshop||'')===row.workshop && (r.volumeType||'main')===(row.volumeType||'main'));
    const groupOrderNums = [...new Set(allGroupRows.flatMap(r => r.orderNums||[]))];
    const moiKey = `${row.contractId}__${row.articleItem}__${row.op}__${row.workshop||''}__${row.volumeType||'main'}`;
    const moSummary = groupOrderNums.length
      ? groupOrderNums.map(n=>esc(n)).join(', ')
      : '<span style="color:#cbd5e1">—</span>';
    const ordersCell = `<div class="launch-wrap" id="macro-ow-${esc(moiKey)}">
      <div style="font-size:11px;color:#475569;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px" title="${esc(groupOrderNums.join(', '))}">${moSummary}</div>
      <button type="button" class="micro-w-trigger" onclick="toggleMacroOrdersPanel(event,'${esc(moiKey)}',${row.contractId},'${esc(row.articleItem)}','${esc(row.op)}','${esc(row.workshop||'')}','${row.volumeType||'main'}')">▼ Заказы${groupOrderNums.length ? ` (${groupOrderNums.length})` : ''}</button>
      <div class="launch-panel" style="min-width:280px"></div>
    </div>`;

    html += `<tr>
          <td class="mp-st-1"><input type="text" value="${c ? esc(c.number) : ''}" placeholder="контракт" style="width:130px" onblur="updContractNumber(${row.contractId},this.value)" list="mpf-c-list"></td>
      <td class="ro mp-st-2 mp-macro-pair" data-mp-art="${artAttr}" data-mp-nm="${nmAttr}" onmouseenter="macroPlanHl(this,true)" onmouseleave="macroPlanHl(this,false)">${esc(row.articleItem)}</td>
      <td class="ro mp-st-3 mp-macro-pair" data-mp-art="${artAttr}" data-mp-nm="${nmAttr}" onmouseenter="macroPlanHl(this,true)" onmouseleave="macroPlanHl(this,false)">${nmDisp ? esc(nmDisp) : '—'}</td>
      <td class="ro mp-st-4">${esc(row.workshop ? `${row.op} / ${row.workshop}` : row.op)}</td>
      <td class="ro mp-st-5">${tcNorms}</td>
      <td class="ro mp-st-6"><b>${totalPlan.toLocaleString()}</b></td>
      ${cells}
      <td class="ro">${factTotal.toLocaleString()}</td>
      <td class="ro" style="min-width:100px">${ordersCell}</td>
      <td style="min-width:80px"><select style="font-size:11px;padding:2px 4px" onchange="updMacroGroupVolumeType(${row.contractId},'${esc(row.articleItem)}','${esc(row.op)}','${esc(row.workshop||'')}','${row.volumeType}',this.value)">
          <option value="main" ${row.volumeType==='main'?'selected':''}>Основные</option>
          <option value="extra" ${row.volumeType==='extra'?'selected':''}>Доп.</option>
        </select></td>
      <td style="text-align:center"><button class="btn btn-danger btn-sm" onclick="deleteMacroGroup(${row.contractId}, '${esc(row.articleItem)}', '${esc(row.op)}', '${esc(row.workshop || '')}', '${row.volumeType}')">✕</button></td>
     </tr>`;
    }
  }
  html += `</tbody></table></div>`;

  // ФРВ и загрузка по месяцам
  const microMonths = [...new Set(S.microplan.filter(r=>opMatches(r.op) && r.date).map(r=>r.date.slice(0,7)))];
  const schedMonths = [...new Set(S.schedules.filter(s=>opMatches(s.op)).flatMap(s=>s.activeMonths||[]))];
  const frvMonths = [...new Set([...months, ...microMonths, ...schedMonths])].sort();
  if (frvMonths.length) {
    if (opsUsed.length <= 1) {
      const opName = opsUsed[0] || '';
      const wsOfOp = [...new Set(S.manualFrv.filter(x => x.op === opName).map(x => x.workshop||''))].sort((a,b)=>a.localeCompare(b,'ru'));
      const wsGroups = wsOfOp.length > 1 ? wsOfOp : [null]; // null = суммарно по ОП
      for (const ws of wsGroups) {
        html += `<div class="sec-title" style="margin-top:16px">ФРВ и загрузка: ${esc(opName)}${ws != null ? ' / ' + esc(ws) : ''}</div>
        <div class="table-wrap"><table><thead>
            <tr><th>Месяц</th><th>ФРВ весь (чел-мин)</th><th title="ФРВ номинал × 95%">×95%</th><th title="Средняя эффективность из записей ФРВ (ручной ввод)">Эфф. %<br><span style="font-weight:400;font-size:10px">из ФРВ</span></th><th title="Средневзвешенная эффективность из данных микроплана">Эфф. %<br><span style="font-weight:400;font-size:10px">из микроплана</span></th><th title="ФРВ номинал × 95% × эффективность">Доступное ФРВ (мин)</th><th>Требуемые мин.</th><th>Кол-во план (шт)</th><th>Загрузка</th><th title="Доступное ФРВ − требуемые минуты">Остаток (мин)</th></tr>
        </thead><tbody>`;
        for (const m of frvMonths) {
          const neededMacro = macroRowsVisible
            .filter(r => r.month === m && (ws == null || (r.workshop||'') === ws))
            .reduce((s, r) => s + macroRowLaborMinutes(r), 0);
          const qtyPlan = macroRowsVisible
            .filter(r => r.month === m && (ws == null || (r.workshop||'') === ws))
            .reduce((s, r) => s + macroRowKitQuantity(r), 0);
          const manNominal = frvNominalSumOpMonth(opName, m, ws);
          const manAvailTime = frvAvailableTimeOpMonth(opName, m, ws);
          const manEffective = frvManualEffectiveSumOpMonth(opName, m, ws);
          const manEffPct = frvAvgEffPctOpMonth(opName, m, ws);
          const microEffPct = microAvgEffPctForOpMonth(opName, m, ws);
          const lp = manEffective > 0 ? neededMacro / manEffective * 100 : 0;
          const col = lp > 100 ? '#ef4444' : lp > 85 ? '#f59e0b' : '#16a34a';
          const rest = manEffective - neededMacro;
          html += `<tr>
            <td>${esc(mlabel(m))}</td>
            <td>${manNominal > 0 ? Math.round(manNominal).toLocaleString('ru') : '<span style="color:#94a3b8">—</span>'}</td>
            <td>${manAvailTime > 0 ? Math.round(manAvailTime).toLocaleString('ru') : '<span style="color:#94a3b8">—</span>'}</td>
            <td>${manEffPct != null ? manEffPct + '%' : '<span style="color:#94a3b8">—</span>'}</td>
            <td style="${microEffPct != null ? 'font-weight:600;color:#1d4ed8' : ''}">${microEffPct != null ? microEffPct + '%' : '<span style="color:#94a3b8">—</span>'}</td>
            <td style="background:#f0fdf4;font-weight:600">${manEffective > 0 ? Math.round(manEffective).toLocaleString('ru') : '<span style="color:#94a3b8">—</span>'}</td>
            <td>${neededMacro > 0 ? Math.round(neededMacro).toLocaleString('ru') : '<span style="color:#94a3b8">—</span>'}</td>
            <td>${qtyPlan > 0 ? qtyPlan.toLocaleString('ru') : '<span style="color:#94a3b8">—</span>'}</td>
            <td>${manEffective > 0 && neededMacro > 0 ? `<b style="color:${col}">${lp.toFixed(1)}%</b>` : '<span style="color:#94a3b8">—</span>'}</td>
            <td style="color:${manEffective > 0 ? (rest<0?'#ef4444':'#16a34a') : '#94a3b8'}">${manEffective > 0 ? Math.round(rest).toLocaleString('ru') : '<span style="color:#94a3b8">—</span>'}</td>
            </tr>`;
        }
        html += `</tbody></table></div>`;
      }
    }

    // Загрузка по цехам (ОП × цех × месяц)
    const opWsPairs = [...new Set([
      ...S.manualFrv.filter(x => opsUsed.includes(x.op)).map(x => x.op + '|||' + (x.workshop||'')),
      ...macroRowsVisible.map(r => r.op + '|||' + (r.workshop||''))
    ])].map(k => { const [op, ws] = k.split('|||'); return { op, ws }; })
      .sort((a,b) => a.op.localeCompare(b.op,'ru') || a.ws.localeCompare(b.ws,'ru'));

    html += `<div class="sec-title" style="margin-top:14px">Загрузка по цехам по месяцам</div>
    <div id="macro-load-scroll" class="table-wrap mac-load-scroll"><table><thead>
      <tr><th class="mf-st-op">ОП / Цех</th>${frvMonths.map(m => `<th class="mf-st-month" style="text-align:center;width:160px;min-width:160px">${esc(mlabel(m))}</th>`).join('')}</tr>
    </thead><tbody>`;

    // Хелпер: ячейка загрузки за месяц
    // mainRows = volumeType==='main', allRows = main+extra, frvAvail = ФРВ×0.95, manEff = эфф.%
    const macroLoadCell = (mainRows, allRows, frvAvail, manEff) => {
      const needMain = mainRows.reduce((s, r) => s + macroRowLaborMinutes(r), 0);
      const needAll  = allRows.reduce((s, r) => s + macroRowLaborMinutes(r), 0);
      const qtyMain  = mainRows.reduce((s, r) => s + macroRowKitQuantity(r), 0);
      const qtyExtra = allRows.filter(r => (r.volumeType||'main') === 'extra').reduce((s, r) => s + macroRowKitQuantity(r), 0);
      const hasExtra = needAll > needMain && qtyExtra > 0;
      if (frvAvail <= 0 && needAll <= 0) return `<td class="mf-st-month" style="color:#94a3b8;text-align:center">—</td>`;
      const effK    = Math.max(0.01, (manEff || 100) / 100);
      const lpMain  = frvAvail > 0 && needMain > 0 ? needMain / (frvAvail * effK) * 100 : (frvAvail <= 0 && needMain > 0 ? null : null);
      const lpAll   = frvAvail > 0 && needAll  > 0 ? needAll  / (frvAvail * effK) * 100 : null;
      const loadCol = lp => lp == null ? '#94a3b8' : lp > 100 ? '#ef4444' : lp > 85 ? '#f59e0b' : '#16a34a';
      const line = (label, val) => `<div style="font-size:11px;display:flex;gap:4px"><span style="color:#94a3b8;white-space:nowrap">${label}:</span><span>${val}</span></div>`;
      const loadLine = lpMain != null || lpAll != null
        ? line('Загрузка',
            (lpMain != null ? `<b style="color:${loadCol(lpMain)}">${lpMain.toFixed(1)}%</b>` : '<span style="color:#94a3b8">—</span>') +
            (hasExtra && lpAll != null ? `<span style="font-size:10px;color:#6366f1;margin-left:4px">/ <b>${lpAll.toFixed(1)}%</b> с доп.</span>` : ''))
        : '';
      return `<td class="mf-st-month" style="vertical-align:top;padding:4px 8px">
        ${qtyMain > 0 ? line('Осн.',     qtyMain.toLocaleString('ru') + ' шт') : ''}
        ${hasExtra    ? line('Доп.',      qtyExtra.toLocaleString('ru') + ' шт') : ''}
        ${needMain > 0 ? line('Время',   Math.round(needMain).toLocaleString('ru') + (hasExtra ? `<span style="color:#6366f1;font-size:10px"> +${Math.round(needAll-needMain).toLocaleString('ru')}</span>` : '') + ' мин') : ''}
        ${frvAvail > 0 ? line('Доступно', Math.round(frvAvail).toLocaleString('ru') + ' мин') : needAll > 0 ? line('Доступно', '<span style="color:#ef4444">нет ФРВ</span>') : ''}
        ${loadLine}
      </td>`;
    };

    // Хелпер: строка ввода эффективности (под каждой строкой цеха)
    const macroEffRow = (op, ws) => {
      const effCells = frvMonths.map(m => {
        const v = getMacroEff(op, ws, m);
        const frvAvail = frvEffectiveForMacroLoad(op, m, ws);
        if (frvAvail <= 0) return `<td class="mf-st-month" style="text-align:center;color:#94a3b8">—</td>`;
        return `<td class="mf-st-month" style="text-align:center;padding:2px 4px">
          <input type="number" min="0" max="999" step="1" value="${v}"
            style="width:52px;font-size:11px;text-align:center;border:1px solid #d1d5db;border-radius:4px;padding:1px 3px"
            title="Эффективность % для ${esc(op)}/${esc(ws)} за ${esc(mlabel(m))}"
            onkeydown="if(event.key==='Enter')this.blur()"
            onblur="setMacroEff('${esc(op)}','${esc(ws)}','${m}',+this.value)">
        </td>`;
      }).join('');
      return `<tr style="background:#f8fafc"><td class="mf-st-op" style="padding-left:16px;font-size:11px;color:#64748b">Эфф.&nbsp;%</td>${effCells}</tr>`;
    };

    for (const { op, ws } of opWsPairs) {
      const _opRec = (S.ops || []).find(o => o.name === op && o.workshop === ws);
      const _isShc = _opRec ? _opRec.processType === 'ШЦ' : ws === 'ШЦ';
      if (_isShc) {
        // Одна строка ШЦ, разбивка количества по наименованиям внутри каждой ячейки месяца
        const shcCells = frvMonths.map(m => {
          const allRows  = macroRowsForOps.filter(r => r.op === op && (r.workshop||'') === ws && r.month === m);
          const mainRows = allRows.filter(r => (r.volumeType||'main') === 'main');
          const extraRows = allRows.filter(r => (r.volumeType||'main') === 'extra');
          const needMain = mainRows.reduce((s, r) => s + macroRowLaborMinutes(r), 0);
          const needAll  = allRows.reduce((s, r) => s + macroRowLaborMinutes(r), 0);
          const frvAvail = frvEffectiveForMacroLoad(op, m, ws);
          const manEff   = macroRowsEfficiency(allRows);
          if (frvAvail <= 0 && needAll <= 0) return `<td class="mf-st-month" style="color:#94a3b8;text-align:center">—</td>`;
          const effK    = Math.max(0.01, manEff / 100);
          const lpMain  = frvAvail > 0 && needMain > 0 ? needMain / (frvAvail * effK) * 100 : null;
          const lpAll   = frvAvail > 0 && needAll  > 0 ? needAll  / (frvAvail * effK) * 100 : null;
          const hasExtra = extraRows.length > 0;
          const loadCol  = lp => lp == null ? '#94a3b8' : lp > 100 ? '#ef4444' : lp > 85 ? '#f59e0b' : '#16a34a';
          const line = (label, val) => `<div style="font-size:11px;display:flex;gap:4px"><span style="color:#475569;white-space:nowrap">${label}:</span><span>${val}</span></div>`;
          // Осн. изделия по наименованиям
          const nameMapMain = {};
          for (const r of mainRows) {
            const nm = routeNameOf(r.articleItem) || r.articleItem || '—';
            nameMapMain[nm] = (nameMapMain[nm] || 0) + macroRowKitQuantity(r);
          }
          const nameLinesMain = Object.entries(nameMapMain)
            .sort(([a], [b]) => a.localeCompare(b, 'ru'))
            .filter(([, qty]) => qty > 0)
            .map(([nm, qty]) => `<div style="font-size:11px"><span style="color:#475569">${esc(nm)}:</span> ${qty.toLocaleString('ru')} шт</div>`)
            .join('');
          // Доп. изделия по наименованиям
          const nameMapExtra = {};
          for (const r of extraRows) {
            const nm = routeNameOf(r.articleItem) || r.articleItem || '—';
            nameMapExtra[nm] = (nameMapExtra[nm] || 0) + macroRowKitQuantity(r);
          }
          const nameLinesExtra = Object.entries(nameMapExtra)
            .sort(([a], [b]) => a.localeCompare(b, 'ru'))
            .filter(([, qty]) => qty > 0)
            .map(([nm, qty]) => `<div style="font-size:11px"><span style="color:#6366f1">${esc(nm)}:</span> <span style="color:#6366f1">${qty.toLocaleString('ru')} шт доп.</span></div>`)
            .join('');
          const loadLine = lpMain != null || lpAll != null
            ? line('Загрузка',
                (lpMain != null ? `<b style="color:${loadCol(lpMain)}">${lpMain.toFixed(1)}%</b>` : '<span style="color:#94a3b8">—</span>') +
                (hasExtra && lpAll != null ? `<span style="font-size:10px;color:#6366f1;margin-left:4px">/ <b>${lpAll.toFixed(1)}%</b> с доп.</span>` : ''))
            : '';
          return `<td class="mf-st-month" style="vertical-align:top;padding:4px 8px">
            ${nameLinesMain}
            ${nameLinesExtra}
            ${needMain > 0 ? line('Время', Math.round(needMain).toLocaleString('ru') + (hasExtra ? `<span style="color:#6366f1;font-size:10px"> +${Math.round(needAll-needMain).toLocaleString('ru')}</span>` : '') + ' мин') : ''}
            ${frvAvail > 0 ? line('Доступно', Math.round(frvAvail).toLocaleString('ru') + ' мин') : needAll > 0 ? line('Доступно', '<span style="color:#ef4444">нет ФРВ</span>') : ''}
            ${loadLine}
          </td>`;
        }).join('');
        html += `<tr><td class="mf-st-op"><b>${esc(op)} / ${esc(ws)}</b></td>${shcCells}</tr>`;
      } else {
        const cells = frvMonths.map(m => {
          const allRows  = macroRowsForOps.filter(r => r.op === op && (r.workshop||'') === ws && r.month === m);
          const mainRows = allRows.filter(r => (r.volumeType||'main') === 'main');
          return macroLoadCell(mainRows, allRows, frvEffectiveForMacroLoad(op, m, ws), macroRowsEfficiency(allRows));
        }).join('');
        html += `<tr><td class="mf-st-op">${esc(op)}${ws ? ' / ' + esc(ws) : ''}</td>${cells}</tr>`;
      }
    }
    if (!opWsPairs.length) {
      html += `<tr><td colspan="${1 + frvMonths.length}" class="empty">Нет данных — добавьте строки в макроплан или ФРВ.</td></tr>`;
    }
    html += `</tbody></table></div>`;
  }

  el.innerHTML = html;
  mpGrid('mpf-month');
  requestAnimationFrame(() => requestAnimationFrame(() => macroPlanScrollToEnd()));
}

function addMacro() {
  const contractNum = document.getElementById('mpf-c').value.trim();
  const articleItem = document.getElementById('mpf-item').value;
  const month       = mpVal('mpf-month');
  const workshop    = document.getElementById('mpf-ws').value;
  const qtySew  = Math.max(0, parseFloat(document.getElementById('mpf-qty-sew').value) || 0);
  const effEl   = document.getElementById('mpf-eff');
  const eff     = effEl ? Math.max(0, Math.min(999, parseFloat(effEl.value) || 100)) : 100;
  const volTypeEl = document.getElementById('mpf-vol-type');
  const volumeType = volTypeEl ? volTypeEl.value : 'main';
  const opEl = document.getElementById('mpf-op');
  const op = (opEl ? opEl.value : '') || macroCtx.formOp || '';
  const normEl = document.getElementById('mpf-norm');
  const normOverride = normEl && normEl.value !== '' ? +normEl.value : null;
  const ordersEl = document.getElementById('mpf-orders');
  const orderNums = ordersEl ? [...ordersEl.selectedOptions].map(o => o.value).filter(Boolean) : [];
  if (!contractNum || !articleItem || !month || !op) {
    _alert('Заполните: контракт, артикул изделия, месяц, ОП');
    return;
  }
  if (qtySew <= 0) {
    _alert('Укажите количество шт');
    return;
  }
  let contract = S.contracts.find(c => c.number === contractNum);
  if (!contract) {
    const nom = findNomByArticle(articleItem, op, workshop || undefined);
    const articleGp = nom?.articleGp || articleItem;
    contract = { id: nid(), number: contractNum, articleGp, name: nameOf(articleGp)||'', deliverySchedule: [], quantity: 0, deliveryDate: '' };
    S.contracts.push(contract);
  }
  const contractId = contract.id;
  const existing = S.macroplan.find(
    r => r.contractId===contractId && r.articleItem===articleItem && r.op===op && (r.workshop || '') === workshop && r.month===month && (r.volumeType||'main') === volumeType
  );
  if (existing) {
    existing.qtySew = (+existing.qtySew || 0) + qtySew;
    existing.eff = eff;
    if (normOverride != null) existing.normOverride = normOverride;
    if (orderNums.length) existing.orderNums = [...new Set([...(existing.orderNums||[]), ...orderNums])];
  } else {
    const row = { id: nid(), contractId, articleItem, op, workshop, month, qtySew, volumeType, eff };
    if (normOverride != null) row.normOverride = normOverride;
    if (orderNums.length) row.orderNums = orderNums;
    S.macroplan.push(row);
  }
  lastFormInput = { op, workshop, articleItem, month };
  macroCtx.formContract = contractNum;
  macroCtx.formWorkshop = workshop;
  save(); renderActive();
}

function updMacroCell(id, val) {
  const r = byId(S.macroplan, id);
  if (!r) return;
  r.qtySew = Math.max(0, +val || 0);
  if (r.qtySew <= 0) S.macroplan = S.macroplan.filter(x => x.id !== id);
  save(); renderActive();
}

function updMacroCellEff(id, val) {
  const r = byId(S.macroplan, id);
  if (!r) return;
  r.eff = Math.max(0, Math.min(999, +val || 100));
  save(); renderActive();
}

function updMacroGroupNorm(contractId, articleItem, op, workshop, volumeType, newValStr) {
  const rows = S.macroplan.filter(r =>
    r.contractId === +contractId && r.articleItem === articleItem &&
    r.op === op && (r.workshop||'') === workshop && (r.volumeType||'main') === volumeType
  );
  const val = newValStr !== '' ? parseFloat(newValStr) : null;
  for (const r of rows) {
    if (val != null && val > 0) r.normOverride = val;
    else delete r.normOverride;
  }
  save(); renderActive();
}

function updMacroGroupOrderNums(contractId, articleItem, op, workshop, volumeType, selectEl) {
  const selected = [...selectEl.selectedOptions].map(o => o.value).filter(Boolean);
  const rows = S.macroplan.filter(r =>
    r.contractId === +contractId && r.articleItem === articleItem &&
    r.op === op && (r.workshop||'') === workshop && (r.volumeType||'main') === volumeType
  );
  for (const r of rows) r.orderNums = selected;
  save();
}

function _macroGroupRows(contractId, articleItem, op, workshop, volumeType) {
  return S.macroplan.filter(r =>
    r.contractId === +contractId && r.articleItem === articleItem &&
    r.op === op && (r.workshop||'') === workshop && (r.volumeType||'main') === volumeType
  );
}

function _macroGroupOrderNums(contractId, articleItem, op, workshop, volumeType) {
  return [...new Set(_macroGroupRows(contractId, articleItem, op, workshop, volumeType).flatMap(r => r.orderNums||[]))];
}

function _refreshMacroOrdersTrigger(wrapId, orderNums) {
  const wrap = document.getElementById('macro-ow-' + wrapId);
  if (!wrap) return;
  const summary = wrap.querySelector('div');
  if (summary) summary.innerHTML = orderNums.length
    ? orderNums.map(n => n.replace(/</g,'&lt;')).join(', ')
    : '<span style="color:#cbd5e1">—</span>';
  const btn = wrap.querySelector('.micro-w-trigger');
  if (btn) btn.textContent = `▼ Заказы${orderNums.length ? ` (${orderNums.length})` : ''}`;
}

function _buildMacroOrdersPanelHtml(orderNums, contractId, articleItem, op, workshop, volumeType, wrapId) {
  const allOrders = (S.orders||[]).map(o=>o.number).filter(Boolean);
  const available = allOrders.filter(n => !orderNums.includes(n));
  const ci = contractId, ai = articleItem.replace(/'/g,"\\'"), oi = op.replace(/'/g,"\\'"), wi = (workshop||'').replace(/'/g,"\\'"), vi = volumeType||'main', key = wrapId.replace(/'/g,"\\'");
  const tbodyRows = orderNums.length
    ? orderNums.map(n => `<tr>
        <td style="padding:5px 8px;font-weight:600;color:#1e40af">${n.replace(/</g,'&lt;')}</td>
        <td style="padding:5px 8px;text-align:center"><button type="button" class="btn btn-danger btn-sm" style="padding:0 6px" onclick="removeMacroGroupOrder(${ci},'${ai}','${oi}','${wi}','${vi}','${n.replace(/'/g,"\\'")}','${key}')">✕</button></td>
      </tr>`).join('')
    : `<tr><td colspan="2" style="padding:12px;text-align:center;color:#94a3b8">Нет привязанных заказов</td></tr>`;
  const addRow = available.length
    ? `<div style="display:flex;align-items:center;gap:6px;padding:8px 8px 4px">
        <select id="macro-ow-add-${wrapId}" style="flex:1;font-size:12px;padding:4px 6px;border:1px solid #d1d5db;border-radius:6px">
          <option value="">— выбрать заказ —</option>
          ${available.map(n=>`<option value="${n.replace(/"/g,'&quot;')}">${n.replace(/</g,'&lt;')}</option>`).join('')}
        </select>
        <button type="button" class="btn btn-outline btn-sm" style="white-space:nowrap" onclick="addMacroGroupOrder(${ci},'${ai}','${oi}','${wi}','${vi}','${key}')">+ добавить</button>
      </div>`
    : `<div style="padding:8px;font-size:11px;color:#94a3b8;text-align:center">Все заказы добавлены</div>`;
  return `<table style="width:100%;border-collapse:collapse">
    <thead><tr style="background:#f1f5f9">
      <th style="padding:6px 8px;text-align:left;font-size:11px;font-weight:600;color:#475569">Заказ на пр-во</th>
      <th style="width:36px"></th>
    </tr></thead>
    <tbody>${tbodyRows}</tbody>
  </table>${addRow}`;
}

function toggleMacroOrdersPanel(ev, wrapId, contractId, articleItem, op, workshop, volumeType) {
  if (ev) { ev.preventDefault(); ev.stopPropagation(); }
  const wrap = document.getElementById('macro-ow-' + wrapId);
  if (!wrap) return;
  const opening = !wrap.classList.contains('launch-open');
  document.querySelectorAll('#tab-macroplan .launch-wrap.launch-open').forEach(w => { if (w !== wrap) w.classList.remove('launch-open'); });
  wrap.classList.toggle('launch-open', opening);
  if (opening) {
    const orderNums = _macroGroupOrderNums(contractId, articleItem, op, workshop, volumeType);
    const panel = wrap.querySelector('.launch-panel');
    if (panel) panel.innerHTML = _buildMacroOrdersPanelHtml(orderNums, contractId, articleItem, op, workshop, volumeType, wrapId);
    requestAnimationFrame(() => {
      const panel2 = wrap.querySelector('.launch-panel');
      if (!panel2) return;
      const trigger = wrap.querySelector('.micro-w-trigger') || wrap;
      const rect = trigger.getBoundingClientRect();
      let left = rect.left;
      let top = rect.bottom + 4;
      const pw = 300;
      if (left + pw > window.innerWidth - 10) left = Math.max(8, window.innerWidth - pw - 10);
      if (top + 300 > window.innerHeight - 10) top = Math.max(8, rect.top - 310);
      panel2.style.left = left + 'px';
      panel2.style.top = top + 'px';
    });
  }
}

function addMacroGroupOrder(contractId, articleItem, op, workshop, volumeType, wrapId) {
  const sel = document.getElementById('macro-ow-add-' + wrapId);
  const orderNum = sel ? sel.value : '';
  if (!orderNum) return;
  const rows = _macroGroupRows(contractId, articleItem, op, workshop, volumeType);
  for (const r of rows) r.orderNums = [...new Set([...(r.orderNums||[]), orderNum])];
  save();
  const orderNums = _macroGroupOrderNums(contractId, articleItem, op, workshop, volumeType);
  _refreshMacroOrdersTrigger(wrapId, orderNums);
  const wrap = document.getElementById('macro-ow-' + wrapId);
  const panel = wrap?.querySelector('.launch-panel');
  if (panel) panel.innerHTML = _buildMacroOrdersPanelHtml(orderNums, contractId, articleItem, op, workshop, volumeType, wrapId);
}

function removeMacroGroupOrder(contractId, articleItem, op, workshop, volumeType, orderNum, wrapId) {
  const rows = _macroGroupRows(contractId, articleItem, op, workshop, volumeType);
  for (const r of rows) r.orderNums = (r.orderNums||[]).filter(n => n !== orderNum);
  save();
  const orderNums = _macroGroupOrderNums(contractId, articleItem, op, workshop, volumeType);
  _refreshMacroOrdersTrigger(wrapId, orderNums);
  const wrap = document.getElementById('macro-ow-' + wrapId);
  const panel = wrap?.querySelector('.launch-panel');
  if (panel) panel.innerHTML = _buildMacroOrdersPanelHtml(orderNums, contractId, articleItem, op, workshop, volumeType, wrapId);
}

function updMacroRowTcRc(contractId, articleItem, op, workshop, volumeType, newValStr) {
  const newVal = parseFloat(newValStr);
  if (isNaN(newVal) || newVal < 0) { renderActive(); return; }
  const entries = S.macroplan.filter(r =>
    r.contractId === +contractId && r.articleItem === articleItem && r.op === op &&
    (r.workshop || '') === (workshop || '') && (r.volumeType || 'main') === (volumeType || 'main')
  );
  for (const r of entries) r.normOverride = newVal;
  // Применяем к tcRcOverrides для всех привязанных заказов на производство
  if (!S.tcRcOverrides) S.tcRcOverrides = {};
  const linkedOrders = [...new Set(entries.flatMap(r => r.orderNums || []))];
  for (const ord of linkedOrders) S.tcRcOverrides[ord] = newVal;
  if (linkedOrders.length) for (const r of entries) r.macroReleaseOrder = linkedOrders[0];
  save(); renderActive();
}

function updRcNormForOrder(orderNum, newValStr) {
  const newVal = parseFloat(newValStr);
  if (isNaN(newVal) || newVal < 0) { renderActive(); return; }
  if (!orderNum) { renderActive(); return; }
  if (!S.tcRcOverrides) S.tcRcOverrides = {};
  S.tcRcOverrides[orderNum] = newVal;
  save(); renderActive();
}

function updMacroGroupVolumeType(contractId, articleItem, op, workshop, oldVt, newVt) {
  S.macroplan
    .filter(r => r.contractId === contractId && r.articleItem === articleItem && r.op === op && (r.workshop||'') === (workshop||'') && (r.volumeType||'main') === (oldVt||'main'))
    .forEach(r => r.volumeType = newVt);
  save();
  renderActive();
}

function updContractNumber(contractId, newNumber) {
  const trimmed = newNumber.trim();
  if (!trimmed) return;
  const c = byId(S.contracts, contractId);
  if (!c) return;
  if (c.number === trimmed) return;
  const existing = S.contracts.find(x => x.number === trimmed && x.id !== contractId);
  if (existing) {
    S.macroplan.filter(r => r.contractId === contractId).forEach(r => r.contractId = existing.id);
    save(); renderActive();
  } else {
    c.number = trimmed;
    save(); renderActive();
  }
}

function getArticleOptionsForLaunchRow(row, entry) {
  const stage = row.stage || 'ШЦ';
  if (entry.order === '__extra__') {
    // Доп. объём: показываем все артикулы, доступные для данного ОП/цеха и этапа
    const items = new Set();
    for (const n of S.nomenclature) {
      if (row.op && nomRowOps(n).length && !nomRowOps(n).includes(row.op)) continue;
      if (row.workshop && nomRowWorkshops(n).length && !nomRowWorkshops(n).includes(row.workshop)) continue;
      for (const routeItem of (n.route || [])) {
        if (routeItem.stage === stage) items.add(routeItem.articleItem);
      }
      if (stage === 'У') items.add(n.articleGp);
    }
    if (!items.size) {
      for (const n of S.nomenclature) if (n.articleGp) items.add(n.articleGp);
    }
    const sorted = [...items].sort((a,b)=>a.localeCompare(b,'ru'));
    return `<option value="">— выбрать —</option>` + sorted.map(ai => `<option value="${esc(ai)}" ${ai === entry.articleItem ? 'selected' : ''}>${esc(nameOf(ai) || ai)}</option>`).join('');
  }
  // Обычный заказ: ищем ГП и его маршрут
  const ord = entry.order ? S.orders.find(o => releaseOrderEq(o.number, entry.order)) : null;
  if (!ord) return '<option value="">— заказ не выбран —</option>';
  const n = S.nomenclature.find(x => x.articleGp === ord.articleGp);
  if (!n || !n.route) return `<option value="${esc(ord.articleGp)}">${esc(nameOf(ord.articleGp) || ord.articleGp)}</option>`;
  const items = n.route.filter(item => item.stage === stage).map(item => item.articleItem);
  if (!items.length) items.push(ord.articleGp);
  return items.map(ai => `<option value="${esc(ai)}" ${ai === entry.articleItem ? 'selected' : ''}>${esc(nameOf(ai) || ai)}</option>`).join('');
}

// Делегирует в workersAvailableMinSum — устранено дублирование логики расчёта доступных минут.
function calculatePlanReleaseForWorkers(articleItem, op, workshop, workers, processKind) {
  const tc = timeCostForProcess(articleItem, op, processKind || 'SEW');
  if (tc <= 0 || !workers || !workers.length) return 0;
  const availMin = workersAvailableMinSum(workers, op, workshop);
  const total = Math.floor(availMin / tc);
  return total > 0 ? total : 0;
}

}

  if (!wrap) return;
  const opening = !wrap.classList.contains('micro-w-open');
  document.querySelectorAll('#tab-microplan .micro-w-wrap.micro-w-open').forEach(w => {

  });

  if (opening) {
    const panel = wrap.querySelector('.micro-w-panel');

      const trigger = wrap.querySelector('.micro-w-trigger');
      const rect = (trigger || wrap).getBoundingClientRect();
      const panelW = Math.min(540, window.innerWidth - 32);
      let left = rect.left;
      if (left + panelW > window.innerWidth - 8) left = Math.max(8, window.innerWidth - panelW - 8);
      const top = Math.min(rect.bottom + 4, window.innerHeight - 210);
      panel.style.left = left + 'px';
      panel.style.top = top + 'px';
      panel.style.width = panelW + 'px';
    }
  }
}

function addMicroWorker(rowId) {
  const r = byId(S.microplan, rowId);
  if (!r) return;
  flushMicroWorkerInputsFromDom(rowId);
  microWorkersDetailsOpenRowId = rowId;
  if (!Array.isArray(r.workers)) r.workers = [];
  const maxOrd = r.workers.reduce((m, w) => Math.max(m, Number.isFinite(+w.order) ? +w.order : -1), -1);
  r.workers.push({
    id: nid(),
    name: '',
    order: maxOrd + 1,
    staffCount: 0,
    attendance: 0,
    shiftTime: shiftDurationOf(r.op, r.workshop),
    effPct: defaultEffPct(r.op, r.workshop)
  });
  recalcPlanRelease(r);
  save();
  renderActive();
}

function delMicroWorker(rowId, workerId) {
  const r = byId(S.microplan, rowId);
  if (!r || !Array.isArray(r.workers)) return;
  if (r.workers.length <= 1) {
    _alert('Нужна хотя бы одна группа работников.');
    return;
  }
  microWorkersDetailsOpenRowId = rowId;
  flushMicroWorkerInputsFromDom(rowId);
  r.workers = r.workers.filter(w => +w.id !== +workerId);
  r.workers.forEach((w, i) => { w.order = i; });
  recalcPlanRelease(r);
  save();
  renderActive();
}

function updMicroWorkerField(rowId, workerId, field, rawVal) {
  const r = byId(S.microplan, rowId);
  if (!r || !Array.isArray(r.workers)) return;
  flushMicroWorkerInputsFromDom(rowId);
  const w = r.workers.find(x => +x.id === +workerId);
  if (!w) return;
  microWorkersDetailsOpenRowId = rowId;
  if (field === 'name') {
    w.name = String(rawVal ?? '').trim();
  } else if (field === 'staffCount') {
    w.staffCount = Math.max(0, parseFloat(rawVal) || 0);
  } else if (field === 'attendance') {
    w.attendance = Math.max(0, parseFloat(rawVal) || 0);
  } else if (field === 'shiftTime') {
    const v = +rawVal;
    w.shiftTime = Number.isFinite(v) && v > 0 ? v : shiftDurationOf(r.op, r.workshop);
  } else if (field === 'effPct') {
    const t = String(rawVal ?? '').trim();
    if (t === '') w.effPct = defaultEffPct(r.op, r.workshop);
    else {
      const val = Number(t);
      w.effPct = Number.isFinite(val) && val >= 0 && val <= 300 ? val : defaultEffPct(r.op, r.workshop);
    }
  }
  recalcPlanRelease(r);
  save();
  renderActive();
}

  const _baseOpWsBrig = S.microplan.filter(r => {

          <td style="vertical-align:middle;min-width:130px">

function hlOrder(key, on) {
  if (!key) return;
  document.querySelectorAll(`td[data-order="${key}"]`).forEach(td => {
    td.style.background = on ? '#fef9c3' : '';
  });
}

function recalcPlanRelease(microRow) {
  if (!microRow) return;
  migrateMicroplanWorkers();
  const workers = microRowWorkers(microRow);
  const ais = [...new Set(microRowArticleItems(microRow))];
  microRow.planByArticle = {};

  const subs = microRow.subOrders || [];
  const tc1 = ais.reduce((s, ai) => s + tcForMicroRow(microRow, ai), 0);
  const tcSubs = subs.map(sub => calcTcForArticleItems2(sub.articleItems || [], microRow.op));
  const totalSubTc = tcSubs.reduce((s, v) => s + v, 0);
  const availMin = workersAvailableMinSum(workers, microRow.op, microRow.workshop);
  const _lEffFactor = Math.max(0.01, (microRow.learningEff ?? 100)) / 100;
  const effectiveAvailMin = availMin * _lEffFactor;
  const myStage = microRow.stage || 'ШЦ';

  let newPlan = 0;

  if (!workers.length || !ais.length) {
    newPlan = 0;

  } else if (subs.length > 0 && !microRow.planReleaseIsManual) {
    // Главный заказ: мощность смены, но не больше остатка по заказу (лимит 6a)
    newPlan = tc1 > 0 && effectiveAvailMin > 0 ? Math.floor(effectiveAvailMin / tc1) : 0;
    if (microRow.releaseOrder) {
      const ord = S.orders.find(o => releaseOrderEq(o.number, microRow.releaseOrder));
      if (ord && (+ord.quantity || 0) > 0) {
        const releasedBefore = S.microplan
          .filter(m => m.id !== microRow.id
                    && releaseOrderEq(m.releaseOrder, microRow.releaseOrder)
                    && (m.stage || 'ШЦ') === myStage
                    && m.date < microRow.date)
          .reduce((s, m) => s + Math.max(+m.factRelease || 0, +m.planRelease || 0), 0);
        const plannedSameDay = S.microplan
          .filter(m => m.id !== microRow.id
                    && releaseOrderEq(m.releaseOrder, microRow.releaseOrder)
                    && (m.stage || 'ШЦ') === myStage
                    && m.date === microRow.date
                    && !m.planReleaseIsManual)
          .reduce((s, m) => s + (+m.planRelease || 0), 0);
        const remaining = Math.max(0, +ord.quantity - releasedBefore - plannedSameDay);
        newPlan = Math.min(newPlan, remaining);
      }
    }
    for (const ai of ais) microRow.planByArticle[ai] = newPlan;

  } else if (ais.length === 1) {
    // Один артикул — простой расчёт через norm
    newPlan = Math.floor(calculatePlanReleaseForWorkers(ais[0], microRow.op, microRow.workshop, workers) * _lEffFactor);
    // Лимит остатка заказа (6a) — один артикул
    if (!microRow.planReleaseIsManual && microRow.releaseOrder) {
      const ord = S.orders.find(o => releaseOrderEq(o.number, microRow.releaseOrder));
      if (ord && (+ord.quantity || 0) > 0) {
        const releasedBefore = S.microplan
          .filter(m => m.id !== microRow.id
                    && releaseOrderEq(m.releaseOrder, microRow.releaseOrder)
                    && (m.stage || 'ШЦ') === myStage
                    && m.date < microRow.date)
          .reduce((s, m) => s + Math.max(+m.factRelease || 0, +m.planRelease || 0), 0);
        const plannedSameDay = S.microplan
          .filter(m => m.id !== microRow.id
                    && releaseOrderEq(m.releaseOrder, microRow.releaseOrder)
                    && (m.stage || 'ШЦ') === myStage
                    && m.date === microRow.date
                    && !m.planReleaseIsManual)
          .reduce((s, m) => s + (+m.planRelease || 0), 0);
        const remaining = Math.max(0, (+ord.quantity) - releasedBefore - plannedSameDay);
        newPlan = Math.min(newPlan, remaining);
      }
    }
    microRow.planByArticle[ais[0]] = newPlan;

  } else {
    // Несколько артикулов: пропорциональное распределение доступного времени
    // Доля каждого артикула = его трудоёмкость / суммарная трудоёмкость
    // Plan_ai = floor(availMin * tc_ai / totalTc / tc_ai) = floor(availMin / totalTc) — одинаково
    // Но лимит заказа применяется НЕЗАВИСИМО для каждого артикула
    for (const ai of ais) {
      const aiTc = tcForMicroRow(microRow, ai);
      // Пропорциональная доля времени: share = (aiTc / tc1) * effectiveAvailMin
      const shareMin = tc1 > 0 ? (aiTc / tc1) * effectiveAvailMin : 0;
      let aiPlan = aiTc > 0 ? Math.floor(shareMin / aiTc) : 0;

      // Лимит остатка заказа по данному артикулу (6a — независимо)
      if (!microRow.planReleaseIsManual && microRow.releaseOrder) {
        const ord = S.orders.find(o => releaseOrderEq(o.number, microRow.releaseOrder));
        if (ord && (+ord.quantity || 0) > 0) {
          const relBefore = S.microplan
            .filter(m => m.id !== microRow.id
                      && (m.articleItem === ai || (m.articleItems || []).includes(ai))
                      && releaseOrderEq(m.releaseOrder, microRow.releaseOrder)
                      && (m.stage || 'ШЦ') === myStage
                      && m.date < microRow.date)
            .reduce((s, m) => s + Math.max(+m.factRelease || 0, +m.planRelease || 0), 0);
          const remaining = Math.max(0, +ord.quantity - relBefore);
          aiPlan = Math.min(aiPlan, remaining);
        }
      }
      microRow.planByArticle[ai] = aiPlan;
    }
    newPlan = Object.values(microRow.planByArticle).reduce((s, v) => s + v, 0);
  }

  if (!microRow.planReleaseIsManual) {
    if (microRow.planRelease !== newPlan) {
      microRow.planRelease = newPlan;
      microRow.planLaunch = newPlan;
      save();
      const planCell = document.querySelector(`.plan-release-${microRow.id}`);
      if (planCell) {
        const inp = planCell.querySelector('input');
        if (inp) inp.value = newPlan;
        else planCell.textContent = newPlan;
      }
    }
  }

  if (subs.length > 0) {
    // Подзаказы получают остаток минут после главного заказа, с ограничением по заказу и макроплану
    const usedMin = (microRow.planRelease || 0) * tc1;
    let usedSubMin = 0;
    for (let i = 0; i < subs.length; i++) {
      const sub = subs[i];
      const subTc = tcSubs[i] || 0;
      const subLEff = Math.max(0.01, (sub.learningEff ?? 100)) / 100;
      const remainMin = Math.max(0, availMin - usedMin - usedSubMin);
      // Эфф. освоения снижает выработку: effectiveMin = remainMin * lEff
      let sp = (subTc > 0 && remainMin > 0) ? Math.floor(remainMin * subLEff / subTc) : 0;
      if (sub.releaseOrder === '__extra__') {
        // Cap по остатку Доп. объёма в макроплане для данного передела
        const macroExtra = S.macroplan
          .filter(mr => (mr.volumeType || 'main') === 'extra')
          .reduce((s, mr) => {
            const opRec = S.ops.find(o => o.name === mr.op && o.workshop === mr.workshop);
            return (opRec?.processType || mr.workshop) === myStage ? s + macroRowKitQuantity(mr) : s;
          }, 0);
        const alreadyExtra = S.microplan
          .filter(m => (m.stage || 'ШЦ') === myStage && m.id !== microRow.id)
          .reduce((s, m) => {
            if (m.releaseOrder === '__extra__') s += (+m.planRelease || 0);
            for (const s2 of (m.subOrders || [])) {
              if (s2.releaseOrder === '__extra__') s += (+s2.planRelease || 0);
            }
            return s;
          }, 0);
        sp = Math.min(sp, Math.max(0, macroExtra - alreadyExtra));
      } else if (sub.releaseOrder) {
        // Cap по остатку производственного заказа
        const ordSub = S.orders.find(o => releaseOrderEq(o.number, sub.releaseOrder));
        if (ordSub && (+ordSub.quantity || 0) > 0) {
          const releasedBeforeSub = S.microplan
            .filter(m => m.id !== microRow.id
                      && releaseOrderEq(m.releaseOrder, sub.releaseOrder)
                      && (m.stage || 'ШЦ') === myStage
                      && m.date < microRow.date)
            .reduce((s, m) => s + Math.max(+m.factRelease || 0, +m.planRelease || 0), 0);
          const plannedSameDaySub = S.microplan
            .filter(m => m.id !== microRow.id
                      && releaseOrderEq(m.releaseOrder, sub.releaseOrder)
                      && (m.stage || 'ШЦ') === myStage
                      && m.date === microRow.date
                      && !m.planReleaseIsManual)
            .reduce((s, m) => s + (+m.planRelease || 0), 0);
          // Также вычитаем план родительской строки и предыдущих подзаказов с тем же заказом
          const parentPlanSameOrd = releaseOrderEq(sub.releaseOrder, microRow.releaseOrder) ? (+microRow.planRelease || 0) : 0;
          const prevSubsSameOrd = subs.slice(0, i).filter(s => releaseOrderEq(s.releaseOrder, sub.releaseOrder)).reduce((a, s) => a + (+s.planRelease || 0), 0);
          const remainingSub = Math.max(0, +ordSub.quantity - releasedBeforeSub - plannedSameDaySub - parentPlanSameOrd - prevSubsSameOrd);
          sp = Math.min(sp, remainingSub);
        }
      }
      sub.planRelease = sp;
      // Фактические физические минуты = штуки × tc / lEff (при 50% eff — в 2 раза больше)
      usedSubMin += subTc > 0 ? sp * subTc / subLEff : 0;
    }
  }
}

/** Ручная установка плана выпуска по 1-му заказу (блокирует авторасчёт). */
async function setMicroPlanManual(id, val) {
  const r = byId(S.microplan, id);
  if (!r) return;
  flushMicroWorkerInputsFromDom(id);
  const v = Math.max(0, parseInt(val) || 0);
  if (microValidation) {
    // Лимит 6a: план ≤ остаток заказа
    const chkOrder = validatePlanOrderLimit(r, v);
    if (!chkOrder.ok) {
      if (!await _confirm(chkOrder.msg + '\n\nВсё равно сохранить?')) { renderActive(); return; }
    }
    // Лимит 6b: план ≤ план предыдущего передела
    const chkPrev = validatePlanVsPrevStagePlan(r, v);
    if (!chkPrev.ok) {
      if (!await _confirm(chkPrev.msg + '\n\nВсё равно сохранить?')) { renderActive(); return; }
    }
  }
  r.planRelease = v;
  r.planReleaseIsManual = true;
  recalcPlanRelease(r);
  save();
  renderActive();
}

function updMicroLearningEff(id, valStr) {
  const r = S.microplan.find(m => m.id === id);
  if (!r) return;
  const v = Math.max(1, Math.min(200, Math.round(parseFloat(valStr) || 100)));
  r.learningEff = v;
  if (r.releaseOrder && r.releaseOrder !== '__extra__') {
    // Сброс + последовательный пересчёт всех не-ручных строк того же заказа.
    // Сброс нужен, чтобы одинаковые даты не блокировали друг друга устаревшими значениями.
    const allRows = S.microplan
      .filter(m => releaseOrderEq(m.releaseOrder, r.releaseOrder) && !m.planReleaseIsManual)
      .sort((a, b) => {
        const dc = (a.date || '') < (b.date || '') ? -1 : (a.date || '') > (b.date || '') ? 1 : 0;
        return dc !== 0 ? dc : S.microplan.indexOf(a) - S.microplan.indexOf(b);
      });
    for (const row of allRows) row.planRelease = 0;
    for (const row of allRows) recalcPlanRelease(row);
  } else if (!r.planReleaseIsManual) {
    recalcPlanRelease(r);
  }
  save(); renderActive();
}

async function updMicroSubOrder(rowId, subId, field, val) {
  const r = byId(S.microplan, rowId);
  if (!r) return;
  const sub = (r.subOrders || []).find(s => +s.id === +subId);
  if (!sub) return;
  if (field === 'releaseOrder') {
    sub.releaseOrder = String(val || '');
    sub.articleItems = [];
    if (sub.releaseOrder === '__extra__') {
      const stageF = r.stage || 'ШЦ';
      const exIt = new Set();
      S.nomenclature
        .filter(n => (!r.op || !nomRowOps(n).length || nomRowOps(n).includes(r.op)) &&
                     (!r.workshop || !nomRowWorkshops(n).length || nomRowWorkshops(n).includes(r.workshop)))
        .forEach(n => {
          for (const item of (n.route || [])) { if (item.stage === stageF) exIt.add(item.articleItem); }
          if (stageF === 'У') exIt.add(n.articleGp);
        });
      const mainAisE = new Set(microRowArticleItems(r));
      const usedAisE = new Set((r.subOrders || []).filter(s => +s.id !== +subId).flatMap(s => s.articleItems || []));
      const candE = [...exIt].filter(a => !mainAisE.has(a) && !usedAisE.has(a));
      sub.articleItems = candE.length ? [candE[0]] : [];
    } else if (sub.releaseOrder) {
      const o = S.orders.find(o => releaseOrderEq(o.number, sub.releaseOrder));
      if (o) {
        const candidates = getMicroItemOptions(o, r.op, r.workshop, r.stage || 'ШЦ');
        const withTc = candidates.filter(a => timeCostOf(a, r.op) > 0);
        sub.articleItems = withTc.length ? [withTc[0]] : (candidates.length ? [candidates[0]] : []);
      }
    }
  } else if (field === 'factRelease') {
    const newVal = Math.max(0, parseInt(val) || 0);
    // Межпередельная проверка для подзаказа
    if (sub.releaseOrder && newVal > 0) {
      const ord = S.orders.find(o => releaseOrderEq(o.number, sub.releaseOrder));
      if (ord) {
        const stage = r.stage || 'ШЦ';
        const subAi = (sub.articleItems || [])[0] || '';
        const info = stageFactLimit(sub.releaseOrder, ord.articleGp, stage, subAi, null);
        if (info) {
          const alreadyUsed = factByOrderStageArticle(sub.releaseOrder, stage, subAi || null, null)
                              - (+sub.factRelease || 0); // вычитаем текущее значение подзаказа
          const available = Math.max(0, info.limit - alreadyUsed);
          if (newVal > available) {
            const msg = `Превышен лимит передела ${stage} (подзаказ)!\n\n` +
                        `${info.detail}\n` +
                        `Уже выпущено на ${stage}: ${alreadyUsed} шт\n` +
                        `Доступно к выпуску: ${available} шт\n` +
                        `Вы пытаетесь ввести: ${newVal} шт`;
            if (!await _confirm(msg + '\n\nВсё равно сохранить?')) {
              renderActive();
              return;
            }
          }
        }
      }
    }
    sub.factRelease = newVal;
  } else if (field === 'launchOrder') {
    sub.launchOrder = String(val || '');
  } else if (field === 'factLaunch') {
    const newVal = Math.max(0, parseFloat(val) || 0);
    // Межпередельная проверка запуска подзаказа
    if (microValidation && sub.launchOrder && newVal > 0) {
      const tempRow = { ...r, launchOrder: sub.launchOrder, articleItems: sub.articleItems || [], id: -1 };
      const check = validateStageLaunch(tempRow, newVal);
      if (!check.ok) {
        if (!await _confirm(check.msg + '\n\nВсё равно сохранить?')) {
          renderActive();
          return;
        }
      }
    }
    sub.factLaunch = newVal;
  }
  recalcPlanRelease(r);
  save();
  renderActive();
}

function toggleLaunchPanel(ev, rowId) {
  if (ev) {
    ev.preventDefault();
    ev.stopPropagation();
  }
  const wrap = document.getElementById('launch-wrap-' + rowId);
  if (!wrap) return;
  const opening = !wrap.classList.contains('launch-open');
  // Закрываем все другие открытые панели запуска
  document.querySelectorAll('#tab-microplan .launch-wrap.launch-open').forEach(w => {
    if (w !== wrap) w.classList.remove('launch-open');
  });
  wrap.classList.toggle('launch-open', opening);
  if (opening) {
    requestAnimationFrame(() => {
      positionLaunchPanel(wrap);
    });
  }
}


function positionLaunchPanel(wrap) {
  if (!wrap || !wrap.classList.contains('launch-open')) return;
  const panel = wrap.querySelector('.launch-panel');
  if (!panel) return;
  const trigger = wrap.querySelector('.launch-trigger');
  const rect = trigger ? trigger.getBoundingClientRect() : wrap.getBoundingClientRect();
  let left = rect.left;
  const panelWidth = 400; // соответствует min-width панели
  if (left + panelWidth > window.innerWidth - 10) {
    left = Math.max(10, window.innerWidth - panelWidth - 10);
  }
  const panelH = panel.offsetHeight || 320;
  let top = rect.bottom + 4;
  if (top + panelH > window.innerHeight - 8) {
    top = Math.max(8, rect.top - panelH - 4);
  }
  panel.style.left = left + 'px';
  panel.style.top = top + 'px';
  panel.style.width = 'auto';
  panel.style.maxWidth = 'min(540px, calc(100vw - 32px))';
}

function launchEntryAvailQty(order, articleItem, stage, excludeEntryId) {
  if (!order || stage === 'РЦ') return null;
  if (order === '__extra__') {
    const gp = articleItem ? (findNomByArticle(articleItem, null)?.articleGp || articleItem) : null;
    const prevStg = gp ? prevStageInRoute(gp, stage) : null;
    if (!prevStg) return null;

    // Найти артикул на предыдущем переделе, соответствующий текущему articleItem.
    // Используем позицию в маршруте: Рубашка[0] на ШЦ ↔ Рубашка[0] на АЦ.
    const nom = gp ? S.nomenclature.find(n => n.articleGp === gp) : null;
    const route = nom?.route || [];
    const curItems = route.filter(ri => ri.stage === stage);
    const prevItems = route.filter(ri => ri.stage === prevStg);
    const curIdx = articleItem ? curItems.findIndex(ri => ri.articleItem === articleItem) : -1;
    const prevAi = (curIdx >= 0 && curIdx < prevItems.length) ? prevItems[curIdx].articleItem : null;

    let prevFact = 0;
    for (const mr of S.microplan) {
      if (mr.stage !== prevStg) continue;
      if (mr.releaseOrder === '__extra__') {
        const mrAi = (microRowArticleItems(mr)[0]) || '';
        if (!prevAi || !mrAi || mrAi === prevAi) prevFact += (+mr.factRelease || 0);
      }
      for (const sub of (mr.subOrders || [])) {
        if (sub.releaseOrder !== '__extra__') continue;
        const subAi = (sub.articleItems || [])[0] || '';
        if (!prevAi || !subAi || subAi === prevAi) prevFact += (+sub.factRelease || 0);
      }
    }
    // Уже запущено на текущем переделе для этого же артикула (кроме текущей записи)
    let already = 0;
    for (const mr of S.microplan) {
      if ((mr.stage || 'ШЦ') !== stage) continue;
      for (const le of (mr.launches || [])) {
        if (excludeEntryId != null && +le.id === +excludeEntryId) continue;
        if (le.order !== '__extra__') continue;
        if (articleItem && le.articleItem && le.articleItem !== articleItem) continue;
        already += (+le.qty || 0);
      }
    }
    return { avail: Math.max(0, prevFact - already), prevStage: prevStg };
  }
  const ord = S.orders.find(o => releaseOrderEq(o.number, order));
  if (!ord) return null;
  const info = stageFactLimit(order, ord.articleGp, stage, articleItem, null);
  if (!info) return null;
  let already = 0;
  for (const mr of S.microplan) {
    if ((mr.stage || 'ШЦ') !== stage) continue;
    for (const le of (mr.launches || [])) {
      if (excludeEntryId != null && +le.id === +excludeEntryId) continue;
      if (releaseOrderEq(le.order, order)) {
        if (!articleItem || !le.articleItem || le.articleItem === articleItem) already += (+le.qty || 0);
      }
    }
  }
  return { avail: Math.max(0, info.limit - already), prevStage: info.prevStage };
}

function launchCellHtml(row) {
  if ((row.stage || 'ШЦ') === 'РЦ') return `<span style="color:#cbd5e1;">—</span>`;
  const launches = row.launches || [];
  const totalQty = launches.reduce((s, e) => s + (+e.qty || 0), 0);
  const summary = launches.filter(e => e.order && e.qty).map(e => {
    const label = e.order === '__extra__' ? 'Доп. объём' : e.order;
    const product = e.articleItem ? nameOf(e.articleItem) || e.articleItem : '';
    return `${label}×${e.qty}${product ? ' ' + product : ''}`;
  }).join('; ');
  const deliveryCheck = checkDeliveryDate(row);
  return `<div class="launch-wrap" id="launch-wrap-${row.id}">
    <div style="font-size:11px; color:#475569; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:160px;" title="${esc(summary || '—')}">${totalQty ? summary : '<span style="color:#cbd5e1;">—</span>'}</div>
    <button type="button" class="micro-w-trigger${deliveryCheck.ok ? '' : ' micro-w-trigger--warn'}" onclick="toggleLaunchPanel(event, ${row.id})">▼ Запуск${deliveryCheck.ok ? '' : ' ⚠'}</button>
  </div>`;
}


function selectValues(selectEl) {
  if (!selectEl) return [];
  return [...selectEl.selectedOptions].map(o => o.value).filter(Boolean);
}

function getMicroItemOptions(order, op, workshop, stage) {
  if (!order) return [];
  const stageFilter = stage || 'ШЦ';
  const items = new Set();
  const add = v => { if (v) items.add(v); };

  S.nomenclature
    .filter(n => n.articleGp === order.articleGp &&
      (!op || !nomRowOps(n).length || nomRowOps(n).includes(op)) &&
      (!workshop || !nomRowWorkshops(n).length || nomRowWorkshops(n).includes(workshop)))
    .forEach(n => {
      for (const item of (n.route || [])) {
        if (item.stage === stageFilter) add(item.articleItem);
      }
      // У передела — артикул ГП
      if (stageFilter === 'У') add(n.articleGp);
    });

  // Если ничего не нашли по переделу — fallback к ГП артикулу
  if (!items.size) add(order.articleGp);

  const arr = [...items];
  arr.sort((a, b) => {
    if (a === order.articleGp) return -1;
    if (b === order.articleGp) return 1;
    return String(a).localeCompare(String(b), 'ru');
  });
  return arr;
}

function getRowArticleItemOptions(row) {
  const items = new Set();
  const add = v => { if (v) items.add(v); };
  const op = row.op || '';
  const workshop = row.workshop || '';

  if (row.releaseOrder === '__extra__') {
    const stageFilter = row.stage || 'ШЦ';
    S.nomenclature
      .filter(n => (!op || !nomRowOps(n).length || nomRowOps(n).includes(op)) &&
                   (!workshop || !nomRowWorkshops(n).length || nomRowWorkshops(n).includes(workshop)))
      .forEach(n => {
        for (const item of (n.route || [])) {
          if (item.stage === stageFilter) add(item.articleItem);
        }
        if (stageFilter === 'У') add(n.articleGp);
      });
    add(row.articleItem);
    if (!items.size) S.nomenclature.forEach(n => { if (n.articleGp) add(n.articleGp); });
    return [...items].sort((a, b) => String(a).localeCompare(String(b), 'ru'));
  }

  let order = null;
  if (row.releaseOrder) order = S.orders.find(o => releaseOrderEq(o.number, row.releaseOrder));

  if (order) {
    getMicroItemOptions(order, op, workshop, row.stage || 'ШЦ').forEach(add);
  } else {
    add(row.articleItem);
    return [...items];
  }
  microRowArticleItems(row).forEach(add);
  add(row.articleItem);
  return [...items];
}

function updM(id, f, v) {
  const r = byId(S.microplan, id);
  if (r) {
    flushMicroWorkerInputsFromDom(id);
    r[f] = v;
    if (f === 'releaseOrder') {
      if (!v) {
        // Очищаем все связанные данные при сбросе заказа
        r.contractId = null;
        r.articleItem = '';
        r.articleItems = [];
        r.launches = [];
        r.factRelease = 0;
        r.planRelease = 0;
        r.planReleaseIsManual = false;
      } else {
        const order = S.orders.find(o => releaseOrderEq(o.number, v));
        if (order) {
          r.contractId = order.contractId;
          if (!r.articleItem) {
            const ai = articleItemForCtx(order.articleGp, r.op, r.workshop, r.stage);
            if (ai) {
              r.articleItem = ai;
              r.articleItems = [ai];
            }
          }
        }
      }
      recalcPlanRelease(r);
    } else if (f === 'launchOrder') {
      const order = S.orders.find(o => releaseOrderEq(o.number, v));
      if (order && !r.releaseOrder) {
        r.contractId = order.contractId;
        if (!r.articleItem) {
          const ai = articleItemForCtx(order.articleGp, r.op, r.workshop, r.stage);
          if (ai) {
            r.articleItem = ai;
            r.articleItems = [ai];
          }
        }
      }
    } else if (f === 'articleItem') {
      r.articleItems = v ? [v] : [];
      recalcPlanRelease(r);
    } else if (f === 'op' || f === 'workshop') {
      recalcPlanRelease(r);
    }
    save();
    renderActive();
  }
}

function updMArticleItems(id, selectEl) {
  const row = byId(S.microplan, id);
