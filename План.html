  '5/2': {w:5, r:2},
  '5/1': {w:5, r:1},
  '6/1': {w:6, r:1}
};
const DOW_RU = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];

function isShiftPatternWorkDay(dateStr, cycleStart, workDays, restDays, skipWeekends) {
  const d0 = new Date(cycleStart);
  const d1 = new Date(dateStr);
  d0.setHours(0,0,0,0); d1.setHours(0,0,0,0);
  if (d1 < d0) return false;
  const period = workDays + restDays;
  if (period <= 0) return false;

  if (skipWeekends) {
    const dow1 = d1.getDay();
    if (dow1 === 0 || dow1 === 6) return false;
    const days = Math.round((d1 - d0) / 86400000);
    const fullWeeks = Math.floor(days / 7);
    const rem = days % 7;
    const startDow = d0.getDay();
    let wdCount = fullWeeks * 5;
    for (let i = 0; i < rem; i++) {
      const d = (startDow + i) % 7;
      if (d !== 0 && d !== 6) wdCount++;
    }
    return (wdCount % period) < workDays;
  }

  const diff = Math.round((d1 - d0) / 86400000);
  return (diff % period) < workDays;
}

function baseWorkForSchedule(sched, dateStr) {
  if (sched.graphPreset === '5/2') {
    const d0 = new Date(sched.cycleStart), d1 = new Date(dateStr);
    d0.setHours(0,0,0,0); d1.setHours(0,0,0,0);
    if (d1 < d0) return false;
    const dow = d1.getDay();
    return dow !== 0 && dow !== 6;
  }
  return isShiftPatternWorkDay(dateStr, sched.cycleStart, sched.workDays, sched.restDays, false);
}

function daysInMonth(ym) {
  const [y,m] = ym.split('-').map(Number);
  return new Date(y, m, 0).getDate();
}

function monthOfDate(dateStr) {
  return String(dateStr || '').slice(0, 7);
}

function getScheduleMonthOverride(scheduleId, ym) {
  return S.scheduleMonthOverrides.find(o => o.scheduleId === scheduleId && o.month === ym) || null;
}

function getScheduleView(scheduleId, ym) {
  const sched = byId(S.schedules, scheduleId);
  if (!sched) return null;
  const ov = getScheduleMonthOverride(scheduleId, ym);
  return {
    ...sched,
    name: ov?.name ?? sched.name,
    shiftTime: ov?.shiftTime ?? sched.shiftTime,
    effPct: ov?.effPct ?? sched.effPct
  };
}

function updScheduleMonthField(scheduleId, field, rawVal, ym) {
  const sched = byId(S.schedules, scheduleId);
  if (!sched) return;
  const month = ym || schedMonth;
  const idx = S.scheduleMonthOverrides.findIndex(o => o.scheduleId === scheduleId && o.month === month);
  const cur = idx >= 0 ? S.scheduleMonthOverrides[idx] : { scheduleId, month };

  if (field === 'name') {
    const name = String(rawVal || '').trim();
    if (name) cur.name = name;
  } else if (field === 'shiftTime') {
    const val = Number(rawVal);
    if (Number.isFinite(val) && val > 0) cur.shiftTime = val;
  } else if (field === 'effPct') {
    const t = String(rawVal ?? '').trim();
    if (t === '') {
      delete cur.effPct;
    } else {
      const val = Number(t);
      if (Number.isFinite(val) && val >= 0 && val <= 300) cur.effPct = val;
    }
  }

  if ((cur.name == null || cur.name === sched.name) &&
      (cur.shiftTime == null || cur.shiftTime === sched.shiftTime) &&
      (cur.effPct == null || cur.effPct === sched.effPct)) {
    if (idx >= 0) S.scheduleMonthOverrides.splice(idx, 1);
  } else if (idx >= 0) {
    S.scheduleMonthOverrides[idx] = cur;
  } else {
    S.scheduleMonthOverrides.push(cur);
  }

  const dates = [...new Set(S.microplan
    .filter(m => m.scheduleId === scheduleId && monthOfDate(m.date) === month)
    .map(m => m.date))];
  for (const ds of dates) syncMicroplanFromSchedule(scheduleId, ds);

  save();
  renderSchedules();
  renderMicroplan();
}

function getCellState(sched, dateStr) {
  const ov = S.calOverrides.find(o=>o.scheduleId===sched.id && o.date===dateStr);
  const baseWork = baseWorkForSchedule(sched, dateStr);
  const schedView = getScheduleView(sched.id, monthOfDate(dateStr)) || sched;

  let dayType;
  if (ov && ov.dayType) dayType = ov.dayType;
  else dayType = baseWork ? 'work' : 'rest';

  const staffCount = (ov && ov.staffCount != null) ? ov.staffCount : sched.staffCount;
  let shiftTime = schedView.shiftTime;
  if (dayType === 'preholiday') shiftTime = Math.max(0, schedView.shiftTime - 60);
  if (dayType === 'vacation') shiftTime = 0;
  return {dayType, staffCount, shiftTime, baseWork};
}

function cycleCell(scheduleId, dateStr) {
  const sched = byId(S.schedules, scheduleId);
  if (!sched) return;
  const {dayType} = getCellState(sched, dateStr);
  const cycle = ['work', 'preholiday', 'holiday', 'transfer', 'vacation', 'rest'];
  const idx = cycle.indexOf(dayType);
  const next = cycle[(idx + 1 + cycle.length) % cycle.length];
  setCellType(scheduleId, dateStr, next);
}

function setCellType(scheduleId, dateStr, dayType) {
  const sched = byId(S.schedules, scheduleId);
  if (!sched) return;
  const baseWork = baseWorkForSchedule(sched, dateStr);
  const isDefault = (dayType === 'work' && baseWork) || (dayType === 'rest' && !baseWork);

  const idx = S.calOverrides.findIndex(o=>o.scheduleId===scheduleId && o.date===dateStr);
  if (isDefault) {
    if (idx >= 0) {
      delete S.calOverrides[idx].dayType;
      if (S.calOverrides[idx].staffCount == null || S.calOverrides[idx].staffCount === sched.staffCount) {
        S.calOverrides.splice(idx, 1);
      }
    }
  } else {
    if (idx >= 0) S.calOverrides[idx].dayType = dayType;
    else S.calOverrides.push({scheduleId, date: dateStr, dayType, staffCount: sched.staffCount});
  }
  syncMicroplanFromSchedule(scheduleId, dateStr);
  save(); renderSchedules(); renderMicroplan();
}

function saveCalOverride(scheduleId, dateStr, staffCount) {
  const sched = byId(S.schedules, scheduleId);
  if (!sched) return;
  const idx = S.calOverrides.findIndex(o=>o.scheduleId===scheduleId && o.date===dateStr);
  if (idx >= 0) {
    S.calOverrides[idx].staffCount = staffCount;
    if (!S.calOverrides[idx].dayType && staffCount === sched.staffCount) S.calOverrides.splice(idx, 1);
  } else if (staffCount !== sched.staffCount) {
    S.calOverrides.push({scheduleId, date: dateStr, staffCount});
  }
  syncMicroplanFromSchedule(scheduleId, dateStr);
  save(); renderSchedules(); renderMicroplan();
}

function applyScheduleCellToMicroplanRow(sched, dateStr, row) {
  const {dayType, staffCount, shiftTime} = getCellState(sched, dateStr);
  if (dayType === 'rest' || dayType === 'holiday' || dayType === 'vacation') return 'remove';
  const schedView = getScheduleView(sched.id, monthOfDate(dateStr)) || sched;
  ensureWorkersOnMicroRow(row);
  const sortedW = microWorkersSortedForDisplay(row);
  const w0 = sortedW.length ? sortedW[0] : row.workers[0];
  w0.staffCount = staffCount;
  w0.shiftTime = shiftTime;
  const effSched = schedView.effPct != null && Number.isFinite(+schedView.effPct)
    ? Math.max(0, Math.min(300, +schedView.effPct))
    : defaultEffPct(sched.op, sched.workshop);
  w0.effPct = effSched;
  row.op = sched.op;
  row.workshop = sched.workshop;
  const opRec = (S.ops || []).find(o => o.name === sched.op && o.workshop === sched.workshop);
  row.stage = opRec?.processType || 'ШЦ';
  recalcPlanRelease(row);
  return 'ok';
}

function syncMicroplanFromSchedule(scheduleId, dateStr) {
  const sched = byId(S.schedules, scheduleId);
  if (!sched) return;
  const idx = S.microplan.findIndex(m => m.scheduleId === scheduleId && m.date === dateStr);
  if (idx < 0) return;
  const row = S.microplan[idx];
  if (applyScheduleCellToMicroplanRow(sched, dateStr, row) === 'remove') S.microplan.splice(idx, 1);
}

function prevMonth(ym) {
  const [y,m] = ym.split('-').map(Number);
  return m === 1 ? `${y-1}-12` : `${y}-${String(m-1).padStart(2,'0')}`;
}
function nextMonth(ym) {
  const [y,m] = ym.split('-').map(Number);
  return m === 12 ? `${y+1}-01` : `${y}-${String(m+1).padStart(2,'0')}`;
}

function sgOpChange() {
  const op = document.getElementById('sg-op').value;
  const wsSel = document.getElementById('sg-ws');
  const ws = [...new Set(S.ops.filter(o=>o.name===op).map(o=>o.workshop))];
  wsSel.innerHTML = `<option value="">— выбрать —</option>` + ws.map(w=>`<option value="${esc(w)}">${esc(w)}</option>`).join('');
  if (ws.length === 1) wsSel.value = ws[0];
  const effSel = document.getElementById('sg-eff');
  if (op && wsSel.value) effSel.value = String(defaultEffPct(op, wsSel.value));
  if (op && wsSel.value) document.getElementById('sg-shift').value = shiftDurationOf(op, wsSel.value);
}

function brigadeAddMonth(scheduleId) {
  const sched = byId(S.schedules, scheduleId);
  if (!sched) return;
  const nm = nextMonth(schedMonth);
  if (!sched.activeMonths) sched.activeMonths = [schedMonth];
  if (!sched.activeMonths.includes(nm)) sched.activeMonths.push(nm);
  save();
  schedResult = `${sched.name}: добавлен в график за ${mlabel(nm)}.`;
  schedMonth = nm;
  renderSchedules();
}

async function brigadeRemoveMonth(scheduleId) {
  const sched = byId(S.schedules, scheduleId);
  if (!sched) return;
  if (!await _confirm(`Убрать бригаду «${sched.name}» из графика за ${mlabel(schedMonth)}?`)) return;
  if (sched.activeMonths) {
    sched.activeMonths = sched.activeMonths.filter(m => m !== schedMonth);
    if (sched.activeMonths.length === 0) {
      S.schedules = S.schedules.filter(s => s.id !== scheduleId);
      schedResult = `Бригада «${sched.name}» удалена из всех месяцев.`;
    } else {
      schedResult = `${sched.name}: убран из графика за ${mlabel(schedMonth)}.`;
    }
  } else {
    sched.activeMonths = [];
    S.schedules = S.schedules.filter(s => s.id !== scheduleId);
    schedResult = `Бригада «${sched.name}» удалена.`;
  }
  save();
  renderSchedules();
}

function sgPresetChange() {
  const v = document.getElementById('sg-preset').value;
  const custom = v === 'custom';
  document.getElementById('sg-w-lbl').style.display = custom ? '' : 'none';
  document.getElementById('sg-r-lbl').style.display = custom ? '' : 'none';
  if (!custom && SCHED_PRESETS[v]) {
    document.getElementById('sg-w').value = SCHED_PRESETS[v].w;
    document.getElementById('sg-r').value = SCHED_PRESETS[v].r;
  }
}

function addSchedule() {
  const name        = document.getElementById('sg-name').value.trim();
  const op          = document.getElementById('sg-op').value;
  const workshop    = document.getElementById('sg-ws').value;
  const preset      = document.getElementById('sg-preset').value;
  const cycleStart  = document.getElementById('sg-start').value;
  const shiftTime   = +document.getElementById('sg-shift').value;
  const staffCount  = +document.getElementById('sg-staff').value;
  const effPct      = +document.getElementById('sg-eff').value;
  const skipWeekends = false;

  if (!name || !op || !workshop || !cycleStart) {
    _alert('Заполните: бригада, ОП, цех, начало цикла');
    return;
  }

  let workDays, restDays;
  if (preset === 'custom') {
    workDays = +document.getElementById('sg-w').value;
    restDays = +document.getElementById('sg-r').value;
  } else {
    workDays = SCHED_PRESETS[preset].w;
    restDays = SCHED_PRESETS[preset].r;
  }
  if (workDays < 1) { _alert('Рабочих дней должно быть ≥ 1'); return; }

  const graphPreset = (preset === 'custom') ? 'custom' : preset;
  S.schedules.push({ id: nid(), name, op, workshop, workDays, restDays, cycleStart, shiftTime, staffCount, effPct, skipWeekends, graphPreset, activeMonths: [schedMonth] });
  save();
  renderSchedules();
}

function updSchedule(id, field, val) {
  const s = byId(S.schedules, id);
  if (!s) return;
  s[field] = val;
  if (['staffCount','shiftTime','effPct','op','workshop'].includes(field)) {
    const dates = [...new Set(S.microplan.filter(m=>m.scheduleId===id).map(m=>m.date))];
    for (const ds of dates) syncMicroplanFromSchedule(id, ds);
  }
  save();
  renderSchedules();
  renderMicroplan();
}

async function deleteSchedule(id) {
  if (!await _confirm('Удалить бригаду из графика?')) return;
  S.schedules = S.schedules.filter(s=>s.id!==id);
  save(); renderSchedules();
}

function generateFromSchedules() {
  if (!S.schedules.length) { _alert('Нет бригад в графике'); return; }
  const totalDays = daysInMonth(schedMonth);
  let added = 0, updated = 0, removed = 0;
  const opF = scheduleOp || '';
  const activeSched = S.schedules.filter(s =>
    (!s.activeMonths || s.activeMonths.includes(schedMonth)) && (!opF || s.op === opF)
  );
  if (!activeSched.length) {
    _alert(opF ? 'Нет бригад выбранного ОП на этот месяц. Сбросьте фильтр ОП или добавьте бригаду.' : 'Нет активных бригад на выбранный месяц.');
    return;
  }

  for (let d = 1; d <= totalDays; d++) {
    const dateStr = `${schedMonth}-${String(d).padStart(2,'0')}`;
    for (const sched of activeSched) {
      const {dayType, staffCount, shiftTime} = getCellState(sched, dateStr);
      const schedView = getScheduleView(sched.id, monthOfDate(dateStr)) || sched;
      if (dayType === 'rest' || dayType === 'holiday' || dayType === 'vacation') {
        const idx = S.microplan.findIndex(m => m.scheduleId === sched.id && m.date === dateStr);
        if (idx >= 0) { S.microplan.splice(idx, 1); removed++; }
        continue;
      }
      const existing = S.microplan.find(m => m.scheduleId === sched.id && m.date === dateStr);
      if (existing) {
        if (applyScheduleCellToMicroplanRow(sched, dateStr, existing) === 'remove') {
          S.microplan.splice(S.microplan.indexOf(existing), 1); removed++;
        } else { updated++; }
        continue;
      }
      const opRecNew = (S.ops || []).find(o => o.name === sched.op && o.workshop === sched.workshop);
      S.microplan.push({
        id: nid(), date: dateStr, scheduleId: sched.id,
        contractId: 0, articleItem: '', articleItems: [],
        op: sched.op, workshop: sched.workshop,
        stage: opRecNew?.processType || 'ШЦ',
        releaseOrder: '', launchOrder: '',
        planLaunch: 0, factLaunch: 0,
        planRelease: 0, factRelease: 0,
        workers: [{
          id: nid(),
          name: sched.name || '',
          order: 0,
          staffCount,
          attendance: staffCount,
          shiftTime,
          effPct: schedView.effPct != null && Number.isFinite(+schedView.effPct)
            ? Math.max(0, Math.min(300, +schedView.effPct))
            : defaultEffPct(sched.op, sched.workshop)
        }]
      });
      added++;
    }
  }

  save();
  const parts = [`добавлено ${added}`, `обновлено ${updated}`];
  if (removed) parts.push(`удалено ${removed}`);
  schedResult = `${parts.join(', ')} за ${mlabel(schedMonth)}.`;
  renderSchedules();
  renderMicroplan();
}

function renderAnalytics() {
  const el = document.getElementById('tab-analytics');
  const today = new Date(); today.setHours(0,0,0,0);
  const curMonth = analyticsMonth || new Date().toISOString().slice(0, 7);
  const opF = analyticsOp || '';
  const allOps = [...new Set(S.ops.map(o => o.name))].sort((a, b) => a.localeCompare(b, 'ru'));

  const coList = opF
    ? S.customerOrders.filter(c => linksForCO(c.id).some(l => { const o = byId(S.orders, l.productionOrderId); return o && o.op === opF; }))
    : S.customerOrders;

  const totalContracts = coList.length;
  let doneContracts = 0, inProgressContracts = 0, riskContracts = 0, overdueContracts = 0;

  const contractStats = coList.map(c => {
    let orders = linksForCO(c.id).map(l => byId(S.orders, l.productionOrderId)).filter(Boolean);
    if (opF) orders = orders.filter(o => o.op === opF);
    const totalQty = orders.reduce((s, o) => s + (+o.quantity || 0), 0);
    const factQty = factByContractRowForOp(c.id, c.articleGp, opF);
    const pct = totalQty > 0 ? factQty / totalQty * 100 : 0;

    const delivDate = c.deliveryDate ? new Date(c.deliveryDate) : null;
    const isOverdue = delivDate && delivDate < today && pct < 100;
    const daysLeft = delivDate ? Math.round((delivDate - today) / 86400000) : null;
    const isRisk = !isOverdue && delivDate && daysLeft <= 14 && daysLeft >= 0 && pct < 80;
    const isDone = pct >= 100;
    const isInProgress = !isDone && !isOverdue && !isRisk && factQty > 0;

    if (isDone) doneContracts++;
    else if (isOverdue) overdueContracts++;
    else if (isRisk) riskContracts++;
    else if (isInProgress) inProgressContracts++;

    return { c, orders, totalQty, factQty, pct, delivDate, daysLeft, isOverdue, isRisk, isDone, isInProgress };
  });

  function frvFromSchedules(opName, ym) {
    const brigades = S.schedules.filter(s => s.op === opName && (!s.activeMonths || s.activeMonths.includes(ym)));
    const days = daysInMonth(ym);
    let total = 0;
    for (const s of brigades) {
      for (let d = 1; d <= days; d++) {
        const ds = `${ym}-${String(d).padStart(2,'0')}`;
        const {dayType, staffCount, shiftTime} = getCellState(s, ds);
        if (dayType !== 'rest' && dayType !== 'holiday' && dayType !== 'vacation') total += staffCount * shiftTime;
      }
    }
    return total;
  }

  const opsForLoad = opF ? allOps.filter(op => op === opF) : allOps;
  const opLoad = opsForLoad.map(op => {
    // Для аналитики берем ФРВ из графика бригад за выбранный месяц.
    // Если бригад нет, оставляем fallback на справочник ОП.
    const frvSched = frvFromSchedules(op, curMonth);
    const frv = frvSched > 0 ? frvSched : frvOpTotal(op);
    const used = S.microplan
      .filter(m => m.op === op && m.date && m.date.startsWith(curMonth))
      .reduce((s, m) => s + microRowPlanLaborOpLoad(m), 0);
    const lp = frv > 0 ? used/frv*100 : 0;
    return { op, frv, used: Math.round(used), lp };
  }).filter(x => x.frv > 0 || x.used > 0);

  const { wip } = precomputeWip();
  const totalWip = S.microplan.reduce((s, m) => {
    if (opF && m.op !== opF) return s;
    const v = wip[m.id];
    return s + (v > 0 ? v : 0);
  }, 0);

  const mpPlanSum = macroplanQtyForMonth(curMonth, opF);
  const mpFactSum = microFactKitsForMonth(curMonth, opF);
  const mpPct = mpPlanSum > 0 ? mpFactSum/mpPlanSum*100 : 0;

  const card = (title, value, sub, color='#1e293b') =>
    `<div style="background:white;border:1px solid #e2e8f0;border-radius:10px;padding:16px 20px;min-width:150px;flex:1">
      <div style="font-size:11px;color:#64748b;font-weight:600;margin-bottom:4px">${title}</div>
      <div style="font-size:26px;font-weight:700;color:${color}">${value}</div>
      ${sub ? `<div style="font-size:11px;color:#94a3b8;margin-top:2px">${sub}</div>` : ''}
    </div>`;

  let html = `<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px">
    <div class="sec-title" style="margin:0">Аналитика</div>
    <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:#475569;margin:0;white-space:nowrap">
      <span>ОП</span>
      <select class="w180" onchange="analyticsOp=this.value;renderAnalytics()" style="padding:4px 10px;border-radius:6px;border:1px solid #cbd5e1;background:#fff">
        <option value="" ${!opF ? 'selected' : ''}>Все ОП</option>
        ${allOps.map(n => `<option value="${esc(n)}" ${n === opF ? 'selected' : ''}>${esc(n)}</option>`).join('')}
      </select>
    </label>
    <button class="btn btn-outline btn-sm" onclick="analyticsMonth=prevMonth(analyticsMonth);renderAnalytics()">◀</button>
    <b style="font-size:14px">${mlabel(curMonth)}</b>
    <button class="btn btn-outline btn-sm" onclick="analyticsMonth=nextMonth(analyticsMonth);renderAnalytics()">▶</button>
  </div>

  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px">
    ${card('Заказов клиентов', totalContracts)}
    ${card('Выполнено', doneContracts, 'заказов', '#16a34a')}
    ${card('В работе', inProgressContracts, 'заказов', '#2563eb')}
    ${card('Риск срыва', riskContracts, '< 14 дней', '#f59e0b')}
    ${card('Просрочено', overdueContracts, 'заказов', '#ef4444')}
    ${card('НЗП', totalWip.toLocaleString('ru'), 'шт в незавершёнке', '#7c3aed')}
  </div>

  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px">
    ${card('Макроплан ' + mlabel(curMonth) + ' — план', mpPlanSum.toLocaleString('ru'), 'готовая продукция: ГП + min(части)')}
    ${card('Микроплан ' + mlabel(curMonth) + ' — факт', mpFactSum.toLocaleString('ru'), 'по каждому пр. заказу: ГП+min(/1,/2…), сумма по ЗК', mpPct>=100?'#16a34a':mpPct>=70?'#f59e0b':'#ef4444')}
    ${card('Выполнение', mpPct.toFixed(1)+'%', 'факт / план макроплана', mpPct>=100?'#16a34a':mpPct>=70?'#f59e0b':'#ef4444')}
  </div>`;

  html += `<div class="sec-title" style="margin-top:4px">Статус заказов клиентов</div>
  <div class="table-wrap"><table><thead>
      <tr>
      <th>Заказ</th><th>Изделие (ГП)</th><th>Срок отгрузки</th><th>Дней осталось</th>
      <th>Кол-во</th><th>Выпущено</th><th>Выполнение</th><th>НЗП</th><th>Статус</th>
      </tr>
  </thead><tbody>`;

  const sorted = [...contractStats].sort((a,b) => {
    const pri = x => x.isOverdue ? 0 : x.isRisk ? 1 : x.isDone ? 3 : 2;
    return pri(a) - pri(b) || (a.c.deliveryDate||'').localeCompare(b.c.deliveryDate||'');
  });

  for (const {c, totalQty, factQty, pct, daysLeft, isOverdue, isRisk, isDone} of sorted) {
    const wipOrders = linksForCO(c.id).map(l => byId(S.orders, l.productionOrderId)).filter(o => o && (!opF || o.op === opF))
      .reduce((s, o) => s + (S.microplan.filter(m => releaseOrderEq(m.releaseOrder, o.number) && (!opF || m.op === opF))
        .reduce((ss, m) => ss + (wip[m.id] > 0 ? wip[m.id] : 0), 0)), 0);
    
    let statusHtml = '';
    if (isDone)          statusHtml = '<span class="badge badge-done">✓ Выполнен</span>';
    else if (isOverdue)  statusHtml = '<span class="badge badge-risk">✕ Просрочен</span>';
    else if (isRisk)     statusHtml = '<span class="badge badge-warn">⚠ Риск</span>';
    else if (factQty>0)  statusHtml = '<span class="badge badge-info">▶ В работе</span>';
    else                 statusHtml = '<span class="badge" style="background:#f1f5f9;color:#475569">○ Не начат</span>';

    const bar = pct > 0 ? `<div style="display:inline-flex;align-items:center;gap:5px">
      <div style="width:60px;height:6px;background:#e2e8f0;border-radius:3px;overflow:hidden">
        <div style="width:${Math.min(100,pct).toFixed(0)}%;height:100%;background:${pct>=100?'#16a34a':pct>=70?'#f59e0b':'#ef4444'};border-radius:3px"></div>
      </div>
      <span style="font-size:11px">${pct.toFixed(1)}%</span>
    </div>` : `<span style="color:#94a3b8">0%</span>`;

    html += `<tr>
      <td>${esc(c.number)}</td>
      <td>${esc(c.articleGp||'')}</td>
      <td>${fmtDate(c.deliveryDate||'')}</td>
      <td style="color:${isOverdue?'#ef4444':daysLeft!==null&&daysLeft<=14?'#d97706':'#1e293b'}">${daysLeft !== null ? daysLeft+'д.' : '—'}</td>
      <td>${totalQty.toLocaleString('ru')}</td>
      <td>${factQty.toLocaleString('ru')}</td>
      <td>${bar}</td>
      <td>${wipOrders > 0 ? wipOrders.toLocaleString('ru') : '—'}</td>
      <td>${statusHtml}</td>
    </tr>`;
  }
  html += `</tbody></table></div>`;

  if (opLoad.length) {
    const loadTitle = opF ? `Загрузка ОП ${esc(opF)} — ${mlabel(curMonth)}` : `Загрузка ОП — ${mlabel(curMonth)}`;
    html += `<div class="sec-title" style="margin-top:16px">${loadTitle}</div>
    <div class="table-wrap"><table><thead>
        <tr><th>ОП</th><th>ФРВ (мин/мес)</th><th>Использовано (мин)</th><th>Загрузка</th></tr>
    </thead><tbody>`;
    for (const {op, frv, used, lp} of opLoad) {
      const col = lp > 100 ? '#ef4444' : lp > 85 ? '#f59e0b' : '#16a34a';
      html += `<tr>
        <td>${esc(op)}</td>
        <td>${frv.toLocaleString('ru')}</td>
        <td>${used.toLocaleString('ru')}</td>
        <td>
          <div style="display:inline-flex;align-items:center;gap:6px">
            <div style="width:80px;height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden">
              <div style="width:${Math.min(100,lp).toFixed(0)}%;height:100%;background:${col};border-radius:4px"></div>
            </div>
            <b style="color:${col}">${lp.toFixed(1)}%</b>
          </div>
        </td>
      </tr>`;
    }
    html += `</tbody></table></div>`;
  }

  el.innerHTML = html;
}

// СПРАВОЧНИКИ (исправлена номенклатура)
// ================================================================
/** Время доставки между двумя ОП (календарных дней). 0 если не задано. */
function deliveryDaysFor(fromOp, toOp) {
  const row = (S.deliveryMatrix || []).find(r => r.fromOp === fromOp && r.toOp === toOp);
  return row ? (+row.days || 0) : 0;
}

/** Добавить дату N календарных дней к строке YYYY-MM-DD. */
function addCalDays(dateStr, n) {
  if (!dateStr || !n) return dateStr;
  const d = new Date(dateStr + 'T00:00:00'); // локальное время, не UTC
  d.setDate(d.getDate() + n);
  return localDateStr(d);
}

/** Строка YYYY-MM-DD по локальному времени (без UTC-сдвига). */
function localDateStr(d) {
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}

/** Сдвинуть дату на предыдущий рабочий день, если попадает на сб/вс. */
function prevWorkday(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  const dow = d.getDay();
  if (dow === 0) d.setDate(d.getDate() - 2); // вс → пт
  if (dow === 6) d.setDate(d.getDate() - 1); // сб → пт
  return localDateStr(d);
}

/**
 * Срок отгрузки = срок поставки − дни транспортировки от ОП упаковки до базы.
 * Если результат — сб/вс, сдвигаем на предыдущий рабочий день (пт).
 * Возвращает { shipmentDate, packDeadline, fromOp, days }.
 */
function calcArrivalDate(co) {
  if (!co.deliveryDate) return { shipmentDate: '', packDeadline: '', fromOp: '', days: 0 };
  // Ищем ОП упаковки (этап 'У') в микроплане для производственных заказов этого ЗК
  const prodOrders = (S.orders || []).filter(o =>
    o.customerOrderId === co.id ||
    (o.contractId === co.contractId && o.articleGp === co.articleGp)
  );
  const orderNums = new Set(prodOrders.map(o => String(o.number || '').trim()));
  const packRow = (S.microplan || []).find(m =>
    m.stage === 'У' && orderNums.has(String(m.releaseOrder || '').trim())
  );
  const fromOp = packRow ? (packRow.op || '') : (prodOrders[0] ? (prodOrders[0].op || '') : '');
  const toOp = co.base || '';
  const days = deliveryDaysFor(fromOp, toOp);
  // Срок отгрузки = дата поставки − дни транзита → предыдущий рабочий день
  const rawShipment = addCalDays(co.deliveryDate, -days);
  const shipmentDate = prevWorkday(rawShipment || co.deliveryDate);
  // Упаковка должна завершиться минимум за 1 рабочий день до отгрузки
  const packDeadline = prevWorkday(addCalDays(shipmentDate, -1));
  return { shipmentDate, packDeadline, fromOp, days };
}

/**
 * Проверка даты строки микроплана с учётом матрицы доставок.
 * Возвращает { ok, minDate, prevStage, prevOp, days } или { ok: true }.
 */
function checkDeliveryDate(row) {
  if (!row.date || !row.releaseOrder) return { ok: true };
  const orderNum = row.releaseOrder;
  const ord = orderNum === '__extra__' ? null : S.orders.find(o => releaseOrderEq(o.number, orderNum));
  const articleGp = ord?.articleGp || (() => {
    const ai = microRowArticleItems(row)[0] || row.articleItem || '';
    return S.nomenclature.find(n => n.articleGp === ai || (n.route||[]).some(rt => rt.articleItem === ai))?.articleGp || null;
  })();
  const prevStage = prevStageInRoute(articleGp, row.stage || 'ШЦ');
  if (!prevStage) return { ok: true };
  // Ищем наиболее раннюю дату предыдущего передела.
  // Для __extra__: ищем строки того же ГП (любой заказ или __extra__ с тем же ГП).
  let prevDate = null;
  let prevOp = null;
  for (const m of S.microplan) {
    if (m.id === row.id) continue;
    if (m.stage !== prevStage) continue;
    if (orderNum === '__extra__') {
      // Доп. объём сверяется только с другими __extra__ строками того же ГП
      if (m.releaseOrder !== '__extra__') continue;
      const mAi = microRowArticleItems(m)[0] || m.articleItem || '';
      const mGp = S.nomenclature.find(n => n.articleGp === mAi || (n.route||[]).some(rt => rt.articleItem === mAi))?.articleGp || mAi;
      if (mGp !== articleGp) continue;
    } else {
      if (!releaseOrderEq(m.releaseOrder, orderNum)) continue;
    }
    if (!m.date) continue;
    if (prevDate === null || m.date < prevDate) { prevDate = m.date; prevOp = m.op; }
  }
  if (!prevDate || !prevOp) return { ok: true };
  const days = deliveryDaysFor(prevOp, row.op);
  if (days <= 0) return { ok: true };
  const minDate = addCalDays(prevDate, days);
  if (row.date < minDate) return { ok: false, minDate, prevStage, prevOp, days };
  return { ok: true };
}

function addDeliveryMatrixRow() {
  const fromOp = document.getElementById('dm-from').value;
  const toOp   = document.getElementById('dm-to').value;
  const days   = parseInt(document.getElementById('dm-days').value, 10);
  if (!fromOp || !toOp) { _alert('Выберите оба ОП.'); return; }
  if (isNaN(days) || days < 0) { _alert('Укажите дни (≥ 0).'); return; }
  if (!Array.isArray(S.deliveryMatrix)) S.deliveryMatrix = [];
  const existing = S.deliveryMatrix.find(r => r.fromOp === fromOp && r.toOp === toOp);
  if (existing) { existing.days = days; }
  else S.deliveryMatrix.push({ id: nid(), fromOp, toOp, days });
  save(); renderRefs();
}

function delDeliveryMatrixRow(id) {
  S.deliveryMatrix = (S.deliveryMatrix || []).filter(r => r.id !== id);
  save(); renderRefs();
}

function updDeliveryMatrixDays(id, val) {
  const r = (S.deliveryMatrix || []).find(x => x.id === id);
  if (r) { r.days = Math.max(0, parseInt(val, 10) || 0); save(); }
}

  const el = document.getElementById('refs-body');
  if (!el) return;
  const allOps   = [...new Set(S.ops.map(o => o.name))].sort((a,b) => a.localeCompare(b,'ru'));

  const opOpts   = [
    allOps.length   ? `<optgroup label="ОП">${allOps.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}</optgroup>` : '',

  ].join('');
  const rows = S.deliveryMatrix || [];

function addRouteItem(nomId) {
  const n = byId(S.nomenclature, nomId);
  if (!n) return;
  if (!Array.isArray(n.route)) n.route = [];
  n.route.push({ stage: 'ШЦ', articleItem: '', name: '', timeCost: 0 });
  save();
  renderActive();
  // восстановить открытый details после перерисовки
  requestAnimationFrame(() => {
    const d = document.getElementById('nom-route-' + nomId);
    if (d) d.open = true;
  });
}
function delRouteItem(nomId, idx) {
  const n = byId(S.nomenclature, nomId);
  if (!n || !n.route) return;
  n.route.splice(idx, 1);
  const sewItem = n.route.find(r => r.stage === 'ШЦ');
  n.articleItem = sewItem ? sewItem.articleItem : n.articleGp;
  save();
  renderActive();
  requestAnimationFrame(() => {
    const d = document.getElementById('nom-route-' + nomId);
    if (d) d.open = true;
  });
}
function updRouteItem(nomId, idx, field, value) {
  const n = byId(S.nomenclature, nomId);
  if (!n || !n.route || !n.route[idx]) return;
  const item = n.route[idx];
  if (field === 'timeCost') item.timeCost = Math.max(0, +value || 0);
  else item[field] = value;
  if (field === 'articleItem' || field === 'stage') {
    const sewItem = n.route.find(r => r.stage === 'ШЦ');
    n.articleItem = sewItem ? sewItem.articleItem : n.articleGp;
  }
  if (field === 'stage') {
    const summaryEl = document.getElementById('nom-route-summary-' + nomId);
    if (summaryEl) {
      summaryEl.textContent = n.route.length
        ? [...new Set(n.route.map(r => r.stage))].join(' → ')
        : '—';
    }
  }
  save();
}

function addNom() {
  const gp = document.getElementById('nf-gp').value.trim();
  const nm = document.getElementById('nf-nm').value.trim();
  const assortmentGroup = (document.getElementById('nf-assort') && document.getElementById('nf-assort').value.trim()) || '';
  const model = (document.getElementById('nf-model') && document.getElementById('nf-model').value.trim()) || '';
  const normType = document.getElementById('nf-norm-type').value;
  const ops = nfReadChecked('nf-add-ops');
  if (!gp || !nm) { _alert('Заполните артикул ГП и наименование'); return; }
  if (S.nomenclature.some(x => x.articleGp === gp)) {
    _alert('Карточка с таким артикулом ГП уже есть.');
    return;
  }
  S.nomenclature.push({
    id: nid(),
    articleGp: gp,
    articleItem: gp,
    name: nm,
    model,
    assortmentGroup,
    normType,
    nomOps: ops,
    nomWorkshops: [],
    route: []
  });
  save();
  renderActive();
}

function updNom(id, f, v) {
  const n = byId(S.nomenclature, id);
  if (!n) return;
  n[f] = v;
  if (f === 'articleGp' && n.route) {
    const sewItem = n.route.find(r => r.stage === 'ШЦ');
    n.articleItem = sewItem ? sewItem.articleItem : v;
  }
  save();
  renderActive();
}
async function delNom(id){
  if(!await _confirm('Удалить карточку номенклатуры? Это может повлиять на расчёты.')) return;
  S.nomenclature = S.nomenclature.filter(n=>n.id!==id);
  save(); renderActive();
}

function opsAddFormToggle() {
  const pt = document.getElementById('opf-process')?.value;

    wLabel.firstChild.textContent = 'Цех / бригада';
    if (wInput) wInput.placeholder = 'Цех курток';
    if (tLabel) tLabel.style.display = '';

function addOp(){
  const n = document.getElementById('opf-n').value.trim();
  const w = document.getElementById('opf-w').value.trim();

  const type = processType === 'База' ? 'БТК' : document.getElementById('opf-type').value;

async function clearAll() {
  if (!await _confirm('Очистить все данные? Восстановить их будет невозможно, если вы не сделали экспорт.')) return;
  initEmptyState();
  localStorage.removeItem(LS);
  save();
  renderActive();
  _alert('Все данные удалены.');
}

// ================================================================
// Диаграмма ПО ЗАКАЗУ НА ПРОИЗВОДСТВО
// ================================================================
let ganttOrderNum = '';

function openGanttByOrderNumber(num) {
  if (!num) return;
  ganttOrderNum = num;
  switchTab(null, 'gantt');
}

function openGanttForOrder(orderId, event) {
  if (!event.ctrlKey) return;
  event.preventDefault();
  const order = byId(S.orders, orderId);
  if (!order) return;
  openGanttByOrderNumber(order.number);
}

function renderGantt() {
  const el = document.getElementById('tab-gantt');
  const STAGE_COLORS = { РЦ: '#3b82f6', АЦ: '#8b5cf6', ШЦ: '#10b981', У: '#f59e0b' };
  const SLABEL       = { РЦ: 'Раскрой', АЦ: 'Автоматизация', ШЦ: 'Пошив', У: 'Упаковка' };
  const MONTHS_SHORT = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
  const DAYS_SHORT   = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];

  if (!ganttOrderNum) {
    el.innerHTML = `<div style="padding:60px;text-align:center;color:#94a3b8">
      <div style="font-size:48px;margin-bottom:16px">📊</div>
      <div style="font-size:16px;font-weight:600;margin-bottom:8px">Диаграмма</div>
      <div style="font-size:13px">Нажмите <b>Ctrl+клик</b> на заказ на производство (в таблице или в микроплане) — откроется диаграмма.</div>
    </div>`;
    return;
  }

  const order = S.orders.find(o => releaseOrderEq(o.number, ganttOrderNum));
  if (!order) {
    el.innerHTML = `<p style="padding:40px;color:#94a3b8;text-align:center">Заказ не найден.</p>`;
    return;
  }

  const rows = S.microplan.filter(m =>
    releaseOrderEq(m.releaseOrder, order.number) ||
    (m.subOrders||[]).some(s => releaseOrderEq(s.releaseOrder, order.number))
  );
  const sortedDates = [...new Set(rows.map(r => r.date))].sort();

  if (!sortedDates.length) {
    el.innerHTML = `<div style="padding:40px;text-align:center;color:#94a3b8">Нет строк микроплана по заказу <b>${esc(order.number)}</b></div>`;
    return;
  }

  // Заполненный диапазон дат (без пропусков), локальная дата без смещения UTC
  function localIso(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  const dateRange = [];
  const dCur = new Date(sortedDates[0] + 'T00:00:00');
  const dEnd = new Date(sortedDates[sortedDates.length - 1] + 'T00:00:00');
  while (dCur <= dEnd) { dateRange.push(localIso(dCur)); dCur.setDate(dCur.getDate()+1); }

  const usedStages = STAGES.filter(s => rows.some(r => r.stage === s));
  const orderQty = +order.quantity || 0;

  // Список бригад (stage+op+ws+articleItem), сохраняя порядок стадий
  // Если в цехе ГП разбивается на изделия (куртка, брюки, рубашка) — отдельная полоса на каждое
  const brigades = [];
  for (const s of usedStages) {
    const seen = new Set();
    for (const r of rows) {
      if (r.stage !== s) continue;
      // Основные articleItems строки
      const ais = microRowArticleItems(r);
      const aiList = ais.length > 0 ? ais : [''];
      for (const ai of aiList) {
        const k = `${r.op}||${r.workshop}||${ai}`;
        if (!seen.has(k)) { seen.add(k); brigades.push({ stage:s, op:r.op||'', ws:r.workshop||'', articleItem:ai }); }
      }
      // articleItems из subOrders (Рубашка, второй заказ и т.д.)
      for (const sub of (r.subOrders || [])) {
        if (!releaseOrderEq(sub.releaseOrder, order.number)) continue;
        for (const ai of (sub.articleItems || [])) {
          if (!ai) continue;
          const k = `${r.op}||${r.workshop}||${ai}`;
          if (!seen.has(k)) { seen.add(k); brigades.push({ stage:s, op:r.op||'', ws:r.workshop||'', articleItem:ai }); }
        }
      }
    }
  }

  // Определяем, какие stage+op+ws имеют несколько articleItem (нужно показать разбивку)
  const brigMulti = {};
  for (const b of brigades) {
    const gk = `${b.stage}||${b.op}||${b.ws}`;
    if (!brigMulti[gk]) brigMulti[gk] = [];
    brigMulti[gk].push(b.articleItem);
  }

  // Данные по бригаде: bdata[stage||op||ws||ai][date] = {plan, fact}
  const bdata = {};
  for (const b of brigades) {
    const bk = `${b.stage}||${b.op}||${b.ws}||${b.articleItem}`;
    bdata[bk] = {};
    for (const d of dateRange) {
      const dr = rows.filter(r => r.stage===b.stage && r.op===b.op && r.workshop===b.ws && r.date===d);
      let plan = 0, fact = 0;
      const gk = `${b.stage}||${b.op}||${b.ws}`;
      const hasMulti = brigMulti[gk] && brigMulti[gk].length > 1;

      for (const r of dr) {
        const rAis = microRowArticleItems(r);

        // --- Основной заказ строки ---
        if (releaseOrderEq(r.releaseOrder, order.number)) {
          if (hasMulti && b.articleItem) {
            if (rAis.length > 1 && rAis.includes(b.articleItem)) {
              const tcThis = timeCostOf(b.articleItem, r.op) || 1;
              const tcTotal = rAis.reduce((s, ai) => s + (timeCostOf(ai, r.op) || 1), 0);
              const ratio = tcThis / tcTotal;
              plan += Math.round((+r.planRelease || 0) * ratio);
              fact += Math.round((+r.factRelease || 0) * ratio);
            } else if (rAis.length <= 1 && (rAis[0] || '') === b.articleItem) {
              plan += +r.planRelease || 0;
              fact += +r.factRelease || 0;
            }
          } else {
            plan += +r.planRelease || 0;
            fact += +r.factRelease || 0;
          }
        }

        // --- SubOrders (доп. заказы в строке, каждый со своим articleItem) ---
        for (const sub of (r.subOrders || [])) {
          if (!releaseOrderEq(sub.releaseOrder, order.number)) continue;
          const subAis = sub.articleItems || [];
          if (hasMulti && b.articleItem) {
            if (subAis.includes(b.articleItem)) {
              plan += +sub.planRelease || 0;
              fact += +sub.factRelease || 0;
            }
          } else {
            plan += +sub.planRelease || 0;
            fact += +sub.factRelease || 0;
          }
        }
      }
      bdata[bk][d] = { plan, fact };
    }
  }

  // Агрегат по стадии (для итогового подсчёта)
  function stageSum(s, f) {
    return dateRange.reduce((sum,d) => sum + brigades.filter(b=>b.stage===s).reduce((ss,b)=>ss+(bdata[`${s}||${b.op}||${b.ws}||${b.articleItem}`][d]?.[f]||0),0), 0);
  }

  const today = localIso(new Date());

  // Группировка по месяцам для заголовка
  const monthGroups = [];
  let curMg = null;
  for (const d of dateRange) {
    const mk = d.slice(0,7);
    if (!curMg || curMg.key !== mk) { curMg = { key: mk, count: 0 }; monthGroups.push(curMg); }
    curMg.count++;
  }

  const CELL_W = 36;

  // Шапка: месяцы
  const monthHeader = monthGroups.map(g => {
    const [y, m] = g.key.split('-');
    return `<th colspan="${g.count}" style="padding:5px 8px;text-align:left;font-size:11px;font-weight:700;color:#e2e8f0;background:#1e293b;border-right:1px solid #334155;white-space:nowrap">${MONTHS_SHORT[+m-1].toUpperCase()} ${y}</th>`;
  }).join('');

  const LEFT_W = 280;
  const CELL_H = 34;

  // Шапка: день недели
  const dowHeader = dateRange.map(d => {
    const dt = new Date(d+'T00:00:00'), dow = dt.getDay();
    const we = dow===0||dow===6, tod = d===today;
    const bg = tod ? '#92400e' : we ? '#1e293b' : '#334155';
    return `<th style="width:${CELL_W}px;min-width:${CELL_W}px;padding:2px 0;text-align:center;font-size:9px;font-weight:400;color:${we?'#94a3b8':'#64748b'};background:${bg};border-right:1px solid #475569">${DAYS_SHORT[dow]}</th>`;
  }).join('');

  // Шапка: число
  const dayHeader = dateRange.map(d => {
    const dt = new Date(d+'T00:00:00'), dow = dt.getDay();
    const we = dow===0||dow===6, tod = d===today;
    const bg = tod ? '#92400e' : we ? '#1e293b' : '#334155';
    return `<th style="width:${CELL_W}px;min-width:${CELL_W}px;padding:2px 0;text-align:center;font-size:11px;font-weight:${tod?700:400};color:${tod?'#fbbf24':we?'#64748b':'#94a3b8'};background:${bg};border-right:1px solid #475569">${dt.getDate()}</th>`;
  }).join('');

  // Ячейки бригады — полоска только где есть данные (не сплошная лента)
  function brigadeCells(b) {
    const bk    = `${b.stage}||${b.op}||${b.ws}||${b.articleItem}`;
    const color = STAGE_COLORS[b.stage] || '#64748b';

    return dateRange.map(d => {
      const { plan=0, fact=0 } = bdata[bk][d] || {};
      const dt = new Date(d+'T00:00:00'), dow = dt.getDay();
      const we = dow===0||dow===6, tod = d===today;
      const cellBg = tod ? '#fffbeb' : we ? '#f0f2f5' : '#fff';
      const els = [];

      if (plan > 0)
        els.push(`<div title="План: ${plan} шт" style="position:absolute;top:5px;left:2px;right:2px;height:5px;background:${color}50;border-radius:2px"></div>`);
      if (fact > 0)
        els.push(`<div title="Факт: ${fact} шт" style="position:absolute;top:13px;left:2px;right:2px;height:13px;background:${color};border-radius:2px"></div>`);
      if (tod)
        els.push(`<div style="position:absolute;inset:0;left:calc(50% - 1px);width:2px;background:#d97706;opacity:.7;pointer-events:none"></div>`);

      return `<td style="width:${CELL_W}px;min-width:${CELL_W}px;height:${CELL_H}px;background:${cellBg};border-right:1px solid ${we?'#dde1e7':'#edf0f4'};padding:0;position:relative">${els.join('')}</td>`;
    }).join('');
  }

  // Строки: тонкий разделитель стадии + строки по бригадам
  const stageRows = usedStages.flatMap((s, si) => {
    const color = STAGE_COLORS[s] || '#64748b';
    const stageBrigades = brigades.filter(b => b.stage === s);

    // 4px разделитель между стадиями (не перед первой)
    const sepCells = dateRange.map(d => {
      const dt = new Date(d+'T00:00:00'), we = dt.getDay()===0||dt.getDay()===6;
      return `<td style="width:${CELL_W}px;min-width:${CELL_W}px;height:4px;background:${we?'#e8ecf1':'#f1f5f9'};border-right:1px solid #e2e8f0;padding:0"></td>`;
    }).join('');
    const sep = si === 0 ? '' : `<tr><td style="position:sticky;left:0;z-index:2;height:4px;background:${color}33;border-right:3px solid ${color}66;min-width:${LEFT_W}px;max-width:${LEFT_W}px"></td>${sepCells}</tr>`;

    // Строки бригад со значком стадии
    const bRows = stageBrigades.map((b, bi) => {
      const isLast = bi === stageBrigades.length - 1;
      const bk = `${b.stage}||${b.op}||${b.ws}||${b.articleItem}`;
      const factDs = dateRange.filter(d => (bdata[bk][d]?.fact||0) > 0);
      const factTotal = factDs.reduce((ss,d) => ss+(bdata[bk][d]?.fact||0), 0);
      const planTotal = dateRange.reduce((ss,d) => ss+(bdata[bk][d]?.plan||0), 0);
      const brigPct = planTotal > 0 ? Math.round(factTotal/planTotal*100) : 0;
      const pctColor = brigPct>=100?'#10b981':brigPct>=60?color:'#ef4444';
      // Название изделия из маршрута — показываем для всех полос
      const gk = `${b.stage}||${b.op}||${b.ws}`;
      const hasMultiAi = brigMulti[gk] && brigMulti[gk].length > 1;
      const aiLabel = b.articleItem
        ? (routeNameOf(b.articleItem) || b.articleItem)
        : (nameOf(order.articleGp) || order.articleGp || '');
      return `<tr style="border-bottom:${isLast?'1px solid '+color+'55':'1px solid #edf0f4'}">
        <td style="position:sticky;left:0;z-index:2;background:#fff;border-left:3px solid ${color};border-right:2px solid #e2e8f0;padding:5px 10px;min-width:${LEFT_W}px;max-width:${LEFT_W}px;vertical-align:middle">
          <div style="display:flex;align-items:center;gap:6px;line-height:1.3">
            <span style="display:inline-block;background:${color};color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;flex-shrink:0">${s}</span>
            <span style="font-size:12px;font-weight:700;color:#1e293b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(b.op)}</span>
            ${aiLabel?`<span style="font-size:11px;font-weight:600;color:${color};white-space:nowrap">· ${esc(aiLabel)}</span>`:''}
            ${brigPct>0?`<span style="margin-left:auto;font-size:11px;font-weight:700;color:${pctColor};flex-shrink:0">${brigPct}%</span>`:''}
          </div>
          <div style="font-size:10px;color:#64748b;margin-top:2px;padding-left:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(b.ws)}</div>
        </td>${brigadeCells(b)}</tr>`;
    }).join('');
    return [sep, bRows];
  }).join('');

  const overallFact = factByOrderGp(order.number, order.articleGp);
  const overallPct  = order.quantity > 0 ? Math.round(overallFact/order.quantity*100) : 0;
  const co = byId(S.customerOrders, order.contractId);
  const contract = co ? byId(S.contracts, co.contractId) : null;
  const pColor = overallPct>=100?'#10b981':overallPct>=60?'#f59e0b':'#ef4444';

  el.innerHTML = `
    <div style="display:flex;align-items:flex-start;gap:20px;padding:0 0 14px;border-bottom:2px solid #e2e8f0;margin-bottom:16px;flex-wrap:wrap">
      <div>
        <div style="font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px">Заказ на производство</div>
        <div style="font-size:22px;font-weight:800;color:#1e293b;line-height:1">${esc(order.number)}</div>
        <div style="font-size:13px;color:#64748b;margin-top:4px">
          Артикул ГП: <b style="color:#1e293b">${esc(order.articleGp)}</b>
          ${contract ? ` &nbsp;·&nbsp; Контракт: <b>${esc(contract.number)}</b>` : ''}
          ${co ? ` &nbsp;·&nbsp; Заказ клиента: <b>${esc(co.number)}</b>` : ''}
          ${co?.deliveryDate ? ` &nbsp;·&nbsp; Срок: <b>${fmtDate(co.deliveryDate)}</b>` : ''}
        </div>
      </div>
      <div style="margin-left:auto;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:12px 20px;text-align:center;min-width:180px">
        <div style="font-size:11px;color:#94a3b8;margin-bottom:4px">Выполнение заказа</div>
        <div style="font-size:26px;font-weight:800;color:${pColor};line-height:1">${overallPct}%</div>
        <div style="font-size:12px;color:#64748b;margin:4px 0">${overallFact.toLocaleString('ru')} / ${(+order.quantity||0).toLocaleString('ru')} шт</div>
        <div style="background:#e2e8f0;border-radius:4px;height:6px;overflow:hidden">
          <div style="background:${pColor};height:100%;width:${Math.min(100,overallPct)}%;border-radius:4px"></div>
        </div>
      </div>
    </div>

    <div style="border:1px solid #e2e8f0;border-radius:10px;overflow:auto;max-height:calc(100vh - 300px)">
      <table style="border-collapse:collapse;table-layout:fixed;width:${LEFT_W + dateRange.length * CELL_W}px">
        <thead style="position:sticky;top:0;z-index:3">
          <tr>
            <th style="position:sticky;left:0;z-index:4;background:#1e293b;width:${LEFT_W}px;padding:8px 14px;text-align:left;font-size:11px;color:#94a3b8;border-right:3px solid #334155;letter-spacing:.05em">ПЕРЕДЕЛ</th>
            ${monthHeader}
          </tr>
          <tr>
            <th style="position:sticky;left:0;z-index:4;background:#334155;width:${LEFT_W}px;border-right:3px solid #475569"></th>
            ${dowHeader}
          </tr>
          <tr>
            <th style="position:sticky;left:0;z-index:4;background:#334155;width:${LEFT_W}px;border-right:3px solid #475569;padding:4px 14px;text-align:left;font-size:10px;color:#64748b;font-weight:400"><span style="opacity:.55">▬</span> план &nbsp; <span>▬</span> факт</th>
            ${dayHeader}
          </tr>
        </thead>
        <tbody>${stageRows}</tbody>
      </table>
    </div>
    <div style="margin-top:10px;display:flex;gap:20px;font-size:11px;color:#94a3b8;flex-wrap:wrap">
      <span>Период: <b style="color:#475569">${sortedDates[0]}</b> — <b style="color:#475569">${sortedDates[sortedDates.length-1]}</b> · ${dateRange.length} кал. дн.</span>
      ${dateRange.includes(today)?`<span><b style="color:#f59e0b">■</b> сегодня (${today})</span>`:''}
      <span>Тонкая полоска = план &nbsp;·&nbsp; Широкая полоса = факт</span>
    </div>`;
}

// Пробуем восстановить FSA-хэндл из IDB и, если данных нет, загрузить из файла
if (_fsaSupported()) {
  _fshLoad().then(function(handle) {
    if (!handle) return;
    // Проверяем разрешение (queryPermission не требует жеста пользователя)
    return handle.queryPermission({ mode: 'readwrite' }).then(function(perm) {
      if (perm !== 'granted') return; // нет разрешения — ждём следующего импорта
      _fsh = handle;
      if (_hasData()) return; // localStorage/IDB уже загрузили данные
      // Данных нет — тихо загружаем из файла
      return handle.getFile().then(function(f) { importAllData(f, true); });
    });
  }).catch(function(e) { console.warn('FSA restore:', e); });
}
