function nid() { return S.nextId++; }

function byId(arr, id) { return arr.find(x => x.id === +id); }

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/** Номер пр. заказа в едином виде (из input/select часто строка, в данных — число). */
function orderReleaseKey(n) {
  return String(n ?? '').trim();
}

function releaseOrderEq(a, b) {
  return orderReleaseKey(a) === orderReleaseKey(b);
}

/** Список артикулов изделия в строке микроплана (одна строка — несколько позиций). */
function microRowArticleItems(m) {
  if (!m) return [];
  if (Array.isArray(m.articleItems) && m.articleItems.length) return m.articleItems.filter(Boolean);
  if (m.articleItem) return [m.articleItem];
  return [];
}

function microRowArticleItemsKey(m) {
  return microRowArticleItems(m).slice().sort().join('|');
}

function microArticleSelectedItemsSet(r) {
  return new Set(microRowArticleItems(r));
}

function migrateMicroplanArticleItems() {
  for (const m of S.microplan || []) {
    if (!Array.isArray(m.articleItems) || !m.articleItems.length) {
      m.articleItems = m.articleItem ? [m.articleItem] : [];
    }
    if (m.articleItems.length && !m.articleItem) m.articleItem = m.articleItems[0];
  }
}

function migrateNomenclatureBPBTK() {
  for (const n of S.nomenclature || []) {
    if (!n.normType) n.normType = 'БТК';
    if (n.timeCostNorm == null) n.timeCostNorm = 0;
    if (n.acFlag == null) n.acFlag = (+n.timeCostAc || 0) > 0;
  }
}

function migrateOpsProcesses() {
  for (const o of S.ops || []) {
    if (!o.processType) o.processType = 'ШЦ';
  }
}

function migrateMicroplanOrder2() {
  for (const m of S.microplan || []) {
    if (m.planReleaseIsManual == null) m.planReleaseIsManual = false;
    if (!Array.isArray(m.subOrders)) {
      m.subOrders = [];
      if (m.releaseOrder2) {
        m.subOrders.push({
          id: nid(),
          releaseOrder: m.releaseOrder2 || '',
          articleItems: Array.isArray(m.articleItems2) ? [...m.articleItems2] : [],
          planRelease: +(m.planRelease2) || 0,
          factRelease: +(m.factRelease2) || 0,
        });
      }
    }
    delete m.releaseOrder2;
    delete m.articleItems2;
    delete m.planRelease2;
    delete m.factRelease2;
  }
}

function migrateMicroplanStage() {
  for (const m of S.microplan || []) {
    if (!m.stage) {
      const opRec = (S.ops || []).find(o => o.name === m.op && o.workshop === m.workshop);
      m.stage = opRec?.processType || 'ШЦ';
    }
    // Миграция запуска: старые поля → массив launches
    if (!Array.isArray(m.launches)) {
      m.launches = [];
      if (m.launchOrder && (+m.factLaunch || 0) > 0) {
        const ais = microRowArticleItems(m);
        m.launches.push({ id: nid(), order: m.launchOrder, articleItem: ais[0] || '', qty: +m.factLaunch || 0 });
      }
      // Миграция launchSubOrders
      if (Array.isArray(m.launchSubOrders)) {
        for (const ls of m.launchSubOrders) {
          if (ls.launchOrder && (+ls.factLaunch || 0) > 0) {
            m.launches.push({ id: nid(), order: ls.launchOrder, articleItem: '', qty: +ls.factLaunch || 0 });
          }
        }
      }
      // Миграция запуска из subOrders
      for (const sub of (m.subOrders || [])) {
        if (sub.launchOrder && (+sub.factLaunch || 0) > 0) {
          const subAi = (sub.articleItems || [])[0] || '';
          m.launches.push({ id: nid(), order: sub.launchOrder, articleItem: subAi, qty: +sub.factLaunch || 0 });
        }
        delete sub.launchOrder;
        delete sub.factLaunch;
      }
    }
    delete m.launchOrder;
    delete m.factLaunch;
    delete m.launchSubOrders;
  }
}

/**
 * Преобразует плоские записи номенклатуры (articleItem + timeCost/timeCostCut/…)
 * в структуру «карточка ГП с маршрутом».
 * Одна запись = один ГП (articleGp), внутри route[] — все переделы.
 * route item: { stage: 'РЦ'|'АЦ'|'ШЦ'|'У', articleItem, name, timeCost }
 */
function migrateNomenclatureToRoute() {
  if (S.nomenclature.length && S.nomenclature.every(n => Array.isArray(n.route))) return;
  const STAGE_ORDER = { РЦ: 0, АЦ: 1, ШЦ: 2, У: 3, База: 4 };
  const gpMap = new Map();
  for (const n of S.nomenclature) {
    const gp = (n.articleGp || '').trim() || (n.articleItem || '').trim();
    if (!gp) continue;
    if (!gpMap.has(gp)) gpMap.set(gp, { master: n, records: [] });
    gpMap.get(gp).records.push(n);
  }
  const newNom = [];
  for (const [gp, { master, records }] of gpMap) {
    const suffix = gp.replace(/^01\./, '');
    const route = [];
    const maxCut = Math.max(...records.map(r => +r.timeCostCut || 0));
    if (maxCut > 0) {
      const rcAi = gp.startsWith('01.') ? '11.' + suffix : gp;
      route.push({ stage: 'РЦ', articleItem: rcAi, name: '', timeCost: maxCut });
    }
    const maxAc = Math.max(...records.map(r => +r.timeCostAc || 0));
    if (maxAc > 0) {
      const acAi = gp.startsWith('01.') ? '09.' + suffix + '/1' : gp;
      route.push({ stage: 'АЦ', articleItem: acAi, name: '', timeCost: maxAc });
    }
    const seenSew = new Set();
    for (const r of records) {
      const ai = (r.articleItem || gp).trim();
      if (!seenSew.has(ai)) {
        seenSew.add(ai);
        route.push({ stage: 'ШЦ', articleItem: ai, name: r.name || '', timeCost: +r.timeCost || 0 });
      }
    }
    const maxPack = Math.max(...records.map(r => +r.timeCostPack || 0));
    if (maxPack > 0) {
      route.push({ stage: 'У', articleItem: gp, name: '', timeCost: maxPack });
    }
    route.sort((a, b) => (STAGE_ORDER[a.stage] ?? 99) - (STAGE_ORDER[b.stage] ?? 99));
    const sewItem = route.find(r => r.stage === 'ШЦ');
    newNom.push({
      id: master.id,
      articleGp: gp,
      articleItem: sewItem ? sewItem.articleItem : gp,
      name: master.name || '',
      assortmentGroup: master.assortmentGroup || '',
      normType: master.normType || 'БТК',
      nomOps: nomRowOps(master),
      nomWorkshops: nomRowWorkshops(master),
      route
    });
  }
  newNom.sort((a, b) => String(a.articleGp).localeCompare(String(b.articleGp), 'ru'));
  S.nomenclature = newNom;
}

/**
 * Массив workers в строке микроплана (после migrateMicroplanWorkers).
 * Идемпотентная миграция: старые поля staffCount, attendance, shiftTime, effPct
 * превращаются в один элемент workers; затем старые поля удаляются.
 */
function migrateMicroplanWorkers() {
  for (const m of S.microplan || []) {
    if (Array.isArray(m.workers) && m.workers.length > 0) {
      const seenIds = new Set();
      for (const w of m.workers) {
        if (w.id == null || !Number.isFinite(+w.id)) w.id = nid();
        while (seenIds.has(+w.id)) w.id = nid();
        seenIds.add(+w.id);
        w.staffCount = +w.staffCount || 0;
        w.attendance = +w.attendance || 0;
        const sd = shiftDurationOf(m.op, m.workshop);
        w.shiftTime = +w.shiftTime > 0 ? +w.shiftTime : sd;
        const de = workshopType(m.op, m.workshop) === 'БП' ? 85 : 100;
        w.effPct = w.effPct != null && Number.isFinite(+w.effPct) ? Math.max(0, Math.min(300, +w.effPct)) : de;
        if (w.name == null) w.name = '';
      }
      const allMissingOrder = m.workers.every(w => w.order == null || !Number.isFinite(+w.order));
      if (allMissingOrder) m.workers.forEach((w, i) => { w.order = i; });
      delete m.staffCount;
      delete m.attendance;
      delete m.shiftTime;
      delete m.effPct;
      continue;
    }
    const staffCount = +m.staffCount || 0;
    const attendance = +m.attendance || 0;
    const sd = shiftDurationOf(m.op, m.workshop);
    const shiftTime = +m.shiftTime > 0 ? +m.shiftTime : sd;
    const de = workshopType(m.op, m.workshop) === 'БП' ? 85 : 100;
    const effPct = m.effPct != null && Number.isFinite(+m.effPct) ? Math.max(0, Math.min(300, +m.effPct)) : de;
    m.workers = [{
      id: nid(),
      name: '',
      order: 0,
      staffCount,
      attendance,
      shiftTime,
      effPct
    }];
    delete m.staffCount;
    delete m.attendance;
    delete m.shiftTime;
    delete m.effPct;
  }
}

/** Одна строка: гарантирует workers[] без полного прохода по микроплану (синхронизация с графиком). */
function ensureWorkersOnMicroRow(row) {
  if (!row) return;
  if (Array.isArray(row.workers) && row.workers.length) return;
  const staffCount = +row.staffCount || 0;
  const attendance = +row.attendance || 0;
  const sd = shiftDurationOf(row.op, row.workshop);
  const shiftTime = +row.shiftTime > 0 ? +row.shiftTime : sd;
  const de = workshopType(row.op, row.workshop) === 'БП' ? 85 : 100;
  const effPct = row.effPct != null && Number.isFinite(+row.effPct) ? Math.max(0, Math.min(300, +row.effPct)) : de;
  row.workers = [{
    id: nid(),
    name: '',
    order: 0,
    staffCount,
    attendance,
    shiftTime,
    effPct
  }];
  delete row.staffCount;
  delete row.attendance;
  delete row.shiftTime;
  delete row.effPct;
}

function microRowWorkers(m) {
  if (!m || !Array.isArray(m.workers)) return [];
  return m.workers;
}

/** Порядок строк «состава» в UI: по полю order, затем по id (не по списочной численности). */
function microWorkersSortedForDisplay(m) {
  const ws = microRowWorkers(m);
  return ws.slice().sort((a, b) => {
    const oa = Number.isFinite(+a.order) ? +a.order : 0;
    const ob = Number.isFinite(+b.order) ? +b.order : 0;
    if (oa !== ob) return oa - ob;
    return (+a.id || 0) - (+b.id || 0);
  });
}

/**
 * Считывает значения из вложенной таблицы «состав» в объект строки.
 * Нужен потому что при клике по кнопке (+ / ✕) срабатывает mousedown до blur у input — иначе правки не попадают в S до перерисовки.
 */
function flushMicroWorkerInputsFromDom(rowId) {
  const wrap = document.getElementById('micro-w-wrap-' + rowId);
  if (!wrap) return;
  const r = byId(S.microplan, rowId);
  if (!r || !Array.isArray(r.workers)) return;
  const tbody = wrap.querySelector('.micro-w-workers-table tbody');
  if (!tbody) return;
  const sd = shiftDurationOf(r.op, r.workshop);
  const de = defaultEffPct(r.op, r.workshop);
  let ord = 0;
  for (const tr of tbody.querySelectorAll('tr[data-micro-worker-id]')) {
    const wid = +tr.dataset.microWorkerId;
    const w = r.workers.find(x => +x.id === wid);
    if (!w) continue;
    w.order = ord++;
    const inps = tr.querySelectorAll('input');
    if (inps[0]) w.name = String(inps[0].value ?? '').trim();
    if (inps[1]) w.staffCount = Math.max(0, parseFloat(inps[1].value) || 0);
    if (inps[2]) w.attendance = Math.max(0, parseFloat(inps[2].value) || 0);
    if (inps[3]) {
      const v = +inps[3].value;
      w.shiftTime = Number.isFinite(v) && v > 0 ? v : sd;
    }
    if (inps[4]) {
      const t = String(inps[4].value ?? '').trim();
      if (t === '') w.effPct = de;
      else {
        const val = Number(t);
        w.effPct = Number.isFinite(val) && val >= 0 && val <= 300 ? val : de;
      }
    }
  }
  r.workers.sort((a, b) => (+a.order || 0) - (+b.order || 0));
}

/** Сводка по всем группам: сумма списочной, сумма явки, средняя эффективность (вес по списочной). */
function microWorkersAggregate(m) {
  const ws = microRowWorkers(m);
  if (!ws.length) return { staffSum: 0, attSum: 0, effAvg: defaultEffPct(m.op, m.workshop) };
  let staffSum = 0;
  let attSum = 0;
  let effNum = 0;
  let effDen = 0;
  for (const w of ws) {
    const sc = +w.staffCount || 0;
    staffSum += sc;
    attSum += +w.attendance || 0;
    const e = w.effPct != null && Number.isFinite(+w.effPct) ? Math.max(0, Math.min(300, +w.effPct)) : defaultEffPct(m.op, m.workshop);
    effNum += e * sc;
    effDen += sc;
  }
  const effAvg = effDen > 0 ? Math.round(effNum / effDen) : defaultEffPct(m.op, m.workshop);
  return { staffSum, attSum, effAvg };
}

/** Суммарные минуты по списочной: Σ(смена × списочная × эфф), затем один раз ×0,95. */
function workersAvailableMinSum(workers, op, workshop) {
  let sum = 0;
  for (const w of workers) {
    const staff = +w.staffCount || 0;
    if (staff <= 0) continue;
    const shiftDur = +w.shiftTime > 0 ? +w.shiftTime : shiftDurationOf(op, workshop);
    const effUse = w.effPct != null && Number.isFinite(+w.effPct) ? Math.max(0, Math.min(300, +w.effPct)) : defaultEffPct(op, workshop);
    const efficiency = effUse / 100;
    sum += shiftDur * staff * efficiency;
  }
  return sum * 0.95;
}

/** Суммарная норма мин/шт для списка артикулов (для расчёта плана 2-го заказа). */
function calcTcForArticleItems2(items, op) {
  if (!items || !items.length) return 0;
  return items.reduce((s, ai) => s + timeCostOf(ai, op), 0);
}

/** Норма мин/шт из макроплана для данного заказа+артикул+ОП (normOverride). */
function normFromMacroForOrder(orderNumber, articleItem, op) {
  if (!orderNumber) return null;
  const row = (S.macroplan || []).find(r =>
    r.normOverride != null &&
    Array.isArray(r.orderNums) && r.orderNums.includes(orderNumber) &&
    r.articleItem === articleItem && r.op === op
  );
  return row ? +row.normOverride : null;
}

/** Норма мин/шт для строки микроплана: сначала макроплан, потом РЦ-override, потом номенклатура. */
function tcForMicroRow(m, articleItem) {
  const ai = articleItem || m.articleItem || '';
  const macroNorm = normFromMacroForOrder(m.releaseOrder, ai, m.op);
  if (macroNorm != null) return macroNorm;
  const rcOverride = (m.stage === 'РЦ') && m.releaseOrder ? (S.tcRcOverrides?.[m.releaseOrder] ?? null) : null;
  return rcOverride != null ? +rcOverride : timeCostOf(ai, m.op);
}

/** Трудоёмкость плана строки микроплана (мин) с учётом нескольких изделий. */
function microRowPlanLaborOpLoad(m) {
  if (m && m.planByArticle && typeof m.planByArticle === 'object' && Object.keys(m.planByArticle).length) {
    return Object.entries(m.planByArticle).reduce((s, [ai, q]) => s + (+q || 0) * tcForMicroRow(m, ai), 0);
  }
  return (+m.planRelease || 0) * tcForMicroRow(m, m.articleItem);
}

/** Разворачивает строки с несколькими изделиями для расчёта комплектов (факт/план делятся поровну). */
function microExpandMicroRowsForKitField(rows, field) {
  const out = [];
  for (const m of rows) {
    const ais = microRowArticleItems(m);
    if (ais.length <= 1) {
      out.push(m);
      continue;
    }
    const total = +m[field] || 0;
    const n = ais.length;
    const base = Math.floor(total / n);
    const rem = total - base * n;
    ais.forEach((ai, idx) => {
      const part = base + (idx === 0 ? rem : 0);
      out.push({ ...m, articleItem: ai, [field]: part });
    });
  }
  return out;
}

function orderOptionsWithSelected(value) {
  const selected = value == null ? '' : String(value);
  const options = ['<option value="">—</option>'];
  options.push(`<option value="__extra__" ${selected === '__extra__' ? 'selected' : ''}>Доп. объём</option>`);
  if (S.orders.length) options.push('<option disabled>──────────</option>');
  for (const o of S.orders) {
    const n = String(o.number || '');
    options.push(
      `<option value="${esc(n)}" ${n === selected ? 'selected' : ''}>${esc(n)}</option>`
    );
  }
  return options.join('');
}

function fmt(n, dec=1) { return (n==null||isNaN(n)) ? '—' : (+n).toFixed(dec); }
function fmtDate(d) { return d && d.length >= 10 ? d.slice(8,10) + '.' + d.slice(5,7) + '.' + d.slice(0,4) : (d || '—'); }

/** ОП из строки номенклатуры (массив; пусто = без ограничения по списку). */
function nomRowOps(n) {
  if (!n) return [];
  if (Array.isArray(n.nomOps) && n.nomOps.length) return n.nomOps.filter(Boolean);
  if (n.op) return [n.op];
  return [];
}

/** Цеха из строки номенклатуры (массив; пусто = без ограничения по списку). */
function nomRowWorkshops(n) {
  if (!n) return [];
  if (Array.isArray(n.nomWorkshops) && n.nomWorkshops.length) return n.nomWorkshops.filter(Boolean);
  if (n.workshop) return [n.workshop];
  return [];
}

/**
 * Схлопывает старые строки «один цех — одна строка» в одну запись с nomOps / nomWorkshops.
 * Вызывается при загрузке из localStorage.
 */
function migrateNomenclatureBundleRows() {
  if (!S.nomenclature || !S.nomenclature.length) return;
  const byKey = new Map();
  for (const raw of S.nomenclature) {
    const itemKey = String(raw.articleItem || raw.articleGp || '').trim();
    const gpKey = String(raw.articleGp || '').trim();
    if (!itemKey) continue;
    const key = `${gpKey}|${itemKey}`;
    const oa = nomRowOps(raw);
    const wa = nomRowWorkshops(raw);
    if (!byKey.has(key)) {
      byKey.set(key, {
        ...raw,
        articleGp: gpKey || raw.articleGp,
        articleItem: itemKey,
        nomOps: [...oa],
        nomWorkshops: [...wa],
        timeCost: +raw.timeCost || 0,
        timeCostCut: +raw.timeCostCut || 0,
        timeCostPack: +raw.timeCostPack || 0,
        timeCostAc: +raw.timeCostAc || 0,
        name: raw.name || ''
      });
      continue;
    }
    const cur = byKey.get(key);
    cur.nomOps = [...new Set([...nomRowOps(cur), ...oa])];
    cur.nomWorkshops = [...new Set([...nomRowWorkshops(cur), ...wa])];
    cur.timeCost = Math.max(+cur.timeCost || 0, +raw.timeCost || 0);
    cur.timeCostCut = Math.max(+cur.timeCostCut || 0, +raw.timeCostCut || 0);
    cur.timeCostPack = Math.max(+cur.timeCostPack || 0, +raw.timeCostPack || 0);
    cur.timeCostAc = Math.max(+cur.timeCostAc || 0, +raw.timeCostAc || 0);
    if ((raw.name || '').trim() && (!(cur.name || '').trim() || String(raw.name).length > String(cur.name).length)) {
      cur.name = raw.name;
    }
    cur.id = Math.min(+cur.id || 0, +raw.id || 0);
  }
  const out = [...byKey.values()];
  out.sort((a, b) => String(a.articleItem).localeCompare(String(b.articleItem), 'ru'));
  for (const n of out) {
    delete n.op;
    delete n.workshop;
  }
  S.nomenclature = out;
  migrateNomenclatureProcessCosts();
}

/** Нормы мин/шт по видам работ: пошив (timeCost), раскрой, упаковка, АЦ. */
function migrateNomenclatureProcessCosts() {
  for (const n of S.nomenclature || []) {
    n.timeCost = Math.max(0, +n.timeCost || 0);
    if (n.timeCostCut == null || n.timeCostCut === '') n.timeCostCut = 0;
    else n.timeCostCut = Math.max(0, +n.timeCostCut || 0);
    if (n.timeCostPack == null || n.timeCostPack === '') n.timeCostPack = 0;
    else n.timeCostPack = Math.max(0, +n.timeCostPack || 0);
    if (n.timeCostAc == null || n.timeCostAc === '') n.timeCostAc = 0;
    else n.timeCostAc = Math.max(0, +n.timeCostAc || 0);
  }
}

function allNomOpNames() {
  return [...new Set(S.ops.map(o => o.name))].sort((a, b) => a.localeCompare(b, 'ru'));
}

function allNomWorkshopNames() {
  return [...new Set(S.ops.map(o => o.workshop))].sort((a, b) => a.localeCompare(b, 'ru'));
}

/** Допустима ли пара (ОП, цех) для строки номенклатуры с учётом справочника ОП/цехов. */
function nomRowAllowsOpWorkshop(n, op, workshop) {
  if (!n || !op || !workshop) return false;
  const ops = nomRowOps(n);
  const wss = nomRowWorkshops(n);
  if (ops.length && !ops.includes(op)) return false;
  if (wss.length && !wss.includes(workshop)) return false;
  return S.ops.some(o => o.name === op && o.workshop === workshop);
}

function nfReadChecked(containerId) {
  const el = document.getElementById(containerId);
  if (!el) return [];
  return [...el.querySelectorAll('input[type="checkbox"]:checked')].map(i => String(i.value)).filter(Boolean);
}

/** Есть ли хотя бы одна пара (ОП, цех) из справочника в декартовом произведении выбранных списков. */
function nomPairsSelectionValid(ops, wss) {
  return ops.some(op => wss.some(ws => S.ops.some(o => o.name === op && o.workshop === ws)));
}

/** Есть ли в маршруте любой номенклатурной карточки такой articleItem (опц. фильтр по ОП). */
function nomHasArticle(ai, op) {
  return S.nomenclature.some(n => {
    if (op && nomRowOps(n).length && !nomRowOps(n).includes(op)) return false;
    return n.articleGp === ai || (n.route || []).some(item => item.articleItem === ai);
  });
}

/** Все articleItem из маршрутов номенклатуры, опционально фильтр по ОП. */
function allNomArticleItems(op) {
  const items = new Set();
  for (const n of S.nomenclature) {
    if (op && nomRowOps(n).length && !nomRowOps(n).includes(op)) continue;
    for (const item of (n.route || [])) {
      if (item.articleItem) items.add(item.articleItem);
    }
  }
  return [...items];
}

/** Находит номенклатурную карточку, в чьём маршруте есть данный articleItem. */
function findNomByArticle(ai, op, workshop) {
  return S.nomenclature.find(n => {
    if (op && nomRowOps(n).length && !nomRowOps(n).includes(op)) return false;
    if (workshop) {
      const wss = nomRowWorkshops(n);
      if (wss.length && !wss.includes(workshop)) return false;
    }
    return n.articleGp === ai || (n.route || []).some(item => item.articleItem === ai);
  });
}

function timeCostOf(articleItem, op) {
  for (const n of S.nomenclature) {
    if (op && nomRowOps(n).length && !nomRowOps(n).includes(op)) continue;
    for (const item of (n.route || [])) {
      if (item.articleItem === articleItem) return +item.timeCost || 0;
    }
  }
  return 0;
}

/**
 * Норма мин/шт по виду передела. RC→РЦ, AC→АЦ, SEW→ШЦ, PACK→У.
 * Приоритет: прямое совпадение articleItem+stage.
 * GP-level lookup (для RC/PACK): если артикул в другом этапе ГП — ищет нужный этап.
 * SEW/AC: возвращает собственную цену артикула, независимо от его этапа.
 */
function timeCostForProcess(articleItem, op, processKind) {
  const stageMap = { RC: 'РЦ', AC: 'АЦ', SEW: 'ШЦ', PACK: 'У' };
  const targetStage = stageMap[processKind || 'SEW'];
  for (const n of S.nomenclature) {
    if (op && nomRowOps(n).length && !nomRowOps(n).includes(op)) continue;
    const route = n.route || [];
    const directMatch = route.find(item => item.articleItem === articleItem && item.stage === targetStage);
    if (directMatch) return Math.max(0, +directMatch.timeCost || 0);
    const articleInRoute = route.find(item => item.articleItem === articleItem);
    if (articleInRoute) {
      if (processKind === 'SEW' || processKind === 'AC') {
        return Math.max(0, +articleInRoute.timeCost || 0);
      }
      const stageItem = route.find(item => item.stage === targetStage);
      return stageItem ? Math.max(0, +stageItem.timeCost || 0) : 0;
    }
  }
  return 0;
}
function frvOf(op, workshop) {
  const o = S.ops.find(x => x.name === op && x.workshop === workshop);
  return o ? +o.frvMin : 0;
}
function frvOpTotal(op) {
  return S.ops.filter(x => x.name === op).reduce((s, x) => s + (+x.frvMin||0), 0);
}
function shiftDurationOf(op, workshop) {
  const o = S.ops.find(x => x.name === op && x.workshop === workshop);
  return o ? +o.shiftDuration : 480;
}
function workshopType(op, workshop) {
  const o = S.ops.find(x => x.name === op && x.workshop === workshop);
  return o ? o.type : 'БТК';
}
function nameOf(articleItem) {
  for (const n of S.nomenclature) {
    if (n.articleGp === articleItem) return n.name;
    for (const item of (n.route || [])) {
      if (item.articleItem === articleItem) return item.name || n.name || '';
    }
  }
  return '';
}
/** Название артикула из маршрута (для строк макро/микроплана): приоритет у item.name маршрута. */
function routeNameOf(articleItem) {
  for (const n of S.nomenclature) {
    for (const item of (n.route || [])) {
      if (item.articleItem === articleItem && item.name) return item.name;
    }
    if (n.articleGp === articleItem) return n.name;
  }
  return '';
}
function workshopOf(articleItem, op) {
  if (!op) return '';
  const n = findNomByArticle(articleItem, op);
  if (!n) return '';
  const wss = nomRowWorkshops(n);
  const routeItem = (n.route || []).find(item => item.articleItem === articleItem);
  const stage = routeItem ? routeItem.stage : null;
  if (stage) {
    const pair = S.ops.find(o => o.name === op && o.processType === stage && (!wss.length || wss.includes(o.workshop)));
    if (pair) return pair.workshop;
  }
  const pair = S.ops.find(o => o.name === op && (!wss.length || wss.includes(o.workshop)));
  return pair ? pair.workshop : (wss[0] || '');
}
function baseName(baseId) { const b = byId(S.bases, baseId); return b ? b.name : '—'; }
function uniqueGps() { return [...new Set(S.nomenclature.map(n => n.articleGp))]; }
function itemsForGp(gp) {
  const n = S.nomenclature.find(x => x.articleGp === gp);
  if (!n) return [];
  return [...new Set((n.route || []).map(item => item.articleItem).filter(Boolean))];
}
function subItemsOfGp(gp) { return itemsForGp(gp).filter(i => i !== gp); }
function opsForItem(ai) {
  const n = findNomByArticle(ai);
  if (!n) return [];
  const ops = nomRowOps(n);
  const wss = nomRowWorkshops(n);
  return S.ops
    .filter(o => (!ops.length || ops.includes(o.name)) && (!wss.length || wss.includes(o.workshop)))
    .map(o => ({ op: o.name, workshop: o.workshop }));
}
function articleItemForCtx(articleGp, op, workshop, stage) {
  const n = S.nomenclature.find(x => x.articleGp === articleGp && nomRowAllowsOpWorkshop(x, op, workshop));
  if (!n || !n.route) return articleGp;
  const targetStage = stage || 'ШЦ';
  const stageItem = n.route.find(item => item.stage === targetStage);
  if (stageItem) return stageItem.articleItem;
  // fallback: ШЦ, then GP
  const sewItem = n.route.find(item => item.stage === 'ШЦ');
  return sewItem ? sewItem.articleItem : articleGp;
}

// ================================================================
// MODULE: Utils — расчёт выполнения (кол-во по заказу/ГП/переделу)
// ================================================================
/**
 * По одному производственному заказу (все строки микроплана с этим releaseOrder):
 * сумма по артикулу ГП + min по подизделиям (/1, /2, …) на этом же заказе.
 */
function qtyKitsMicroPerProdOrder(rows, articleGp, field) {
  const flat = microExpandMicroRowsForKitField(rows, field);
  const subs = subItemsOfGp(articleGp);
  const gpSum = flat.filter(m => m.articleItem === articleGp)
    .reduce((s, m) => s + (+m[field] || 0), 0);
  if (!subs.length) return gpSum;
  const perSub = subs.map(item =>
    flat.filter(m => m.articleItem === item).reduce((s, m) => s + (+m[field] || 0), 0)
  );
  const minSub = perSub.length ? Math.min(...perSub) : 0;
  return gpSum + minSub;
}

/** Сумма (ГП+min частей) по каждому из списка пр. заказов; predicate(m) — доп. фильтр строк (месяц, даты). */
function sumMicroKitsOverProdOrders(ords, articleGp, field, predicate) {
  let total = 0;
  for (const o of ords) {
    const rows = S.microplan.filter(m => {
      if (!releaseOrderEq(m.releaseOrder, o.number)) return false;
      return !predicate || predicate(m);
    });
    total += qtyKitsMicroPerProdOrder(rows, articleGp, field);
  }
  return total;
}

/** ГП по артикулу строки макроплана (если в номенклатуре нет — считаем сам артикул ГП). */
function articleGpForMacroArticleItem(articleItem) {
  const n = S.nomenclature.find(x =>
    x.articleGp === articleItem || (x.route || []).some(item => item.articleItem === articleItem)
  );
  return n ? n.articleGp : articleItem;
}

/**
 * План готовой продукции по макроплану (не простое сложение всех строк).
 * Ведём учёт по частям: строка ГП — план выпуска изделия, строки /1, /2… — план по узлам;
 * итог = сумма по ГП + min по подизделиям (как «контур комплектации» при раздельном планировании).
 * Без строки ГП — только min по подизделиям (один контур деталей).
 * Количество комплекта в строке — qtySew (после migrateMacroplanProcessQty); до миграции — quantity.
 */
function macroRowKitQuantity(r) {
  if (!r) return 0;
  if (r.qtySew != null && r.qtySew !== '') return Math.max(0, +r.qtySew || 0);
  return Math.max(0, +r.quantity || 0);
}

/** Минуты загрузки ОП по строке макроплана: раскрой + АЦ + швейка + упаковка × нормы из номенклатуры. */
function macroRowLaborMinutes(r) {
  if (!r) return 0;
  const ai = r.articleItem;
  const op = r.op;
  const rc = Math.max(0, +r.qtyRc || 0);
  const ac = Math.max(0, +r.qtyAc || 0);
  const sew = Math.max(0, +r.qtySew || 0);
  const pack = Math.max(0, +r.qtyPack || 0);
  if (rc + ac + sew + pack === 0 && r.quantity != null && +r.quantity)
    return (+r.quantity || 0) * timeCostOf(ai, op);
  const rcTc = (r.macroReleaseOrder && S.tcRcOverrides?.[r.macroReleaseOrder] != null)
    ? +S.tcRcOverrides[r.macroReleaseOrder]
    : timeCostForProcess(ai, op, 'RC');
  return rc * rcTc
    + ac * timeCostForProcess(ai, op, 'AC')
    + sew * timeCostForProcess(ai, op, 'SEW')
    + pack * timeCostForProcess(ai, op, 'PACK');
}

function migrateMacroplanProcessQty() {
  for (const r of S.macroplan || []) {
    if (r.quantity != null && r.quantity !== '') {
      const q = Math.max(0, +r.quantity || 0);
      const hadNoStages = r.qtyRc == null && r.qtyAc == null && r.qtySew == null && r.qtyPack == null;
      if (hadNoStages) {
        r.qtyRc = 0;
        r.qtyAc = 0;
        r.qtySew = q;
        r.qtyPack = 0;
      } else if (q) {
        r.qtySew = Math.max(0, +r.qtySew || 0) + q;
      }
      delete r.quantity;
    }
    r.qtyRc = Math.max(0, +r.qtyRc || 0);
    r.qtyAc = Math.max(0, +r.qtyAc || 0);
    r.qtySew = Math.max(0, +r.qtySew || 0);
    r.qtyPack = Math.max(0, +r.qtyPack || 0);
  }
}

function migrateMacroplanVolumeType() {
  for (const r of S.macroplan || []) {
    if (!r.volumeType) r.volumeType = 'main';
  }
}

/** Миграция связей ЗК↔ПЗ: создаёт S.orderLinks из старого o.contractId (один-к-одному). */
function migrateOrderLinks() {
  if (Array.isArray(S.orderLinks)) return;
  S.orderLinks = [];
  for (const o of S.orders || []) {
    if (o.contractId) {
      S.orderLinks.push({ id: nid(), customerOrderId: +o.contractId, productionOrderId: o.id, qty: +o.quantity || 0 });
      // qty = o.quantity → по определению уже совпадает, синхронизировать не нужно
    }
  }
}

function qtyKitsFromMacroRows(rows, articleGp) {
  const subs = subItemsOfGp(articleGp);
  const gpSum = rows.filter(r => r.articleItem === articleGp)
    .reduce((s, r) => s + macroRowKitQuantity(r), 0);
  if (!subs.length) return gpSum;
  const perSub = subs.map(item =>
    rows.filter(r => r.articleItem === item).reduce((s, r) => s + macroRowKitQuantity(r), 0)
  );
  const minSub = perSub.length ? Math.min(...perSub) : 0;
  if (gpSum > 0) return gpSum + minSub;
  return minSub;
}

/** Id контракта из справочника: если в макроплане указан id ЗК — поднимаем до contractId заказа клиента. */
function macroContractCanonicalId(contractId) {
  const co = byId(S.customerOrders, +contractId);
  if (co && co.contractId != null) return +co.contractId;
  return +contractId;
}

function factByOrderGp(orderNum, articleGp) {
  const k = orderReleaseKey(orderNum);
  const rows = S.microplan.filter(m => orderReleaseKey(m.releaseOrder) === k);
  return qtyKitsMicroPerProdOrder(rows, articleGp, 'factRelease');
}

function factByOrderStage(orderNum, stage) {
  let total = 0;
  for (const r of S.microplan) {
    if (releaseOrderEq(r.releaseOrder, orderNum) && r.stage === stage) {
      total += (+r.factRelease || 0);
    }
    if (r.stage === stage) {
      for (const sub of (r.subOrders || [])) {
        if (releaseOrderEq(sub.releaseOrder, orderNum)) total += (+sub.factRelease || 0);
      }
    }
  }
  return total;
}

/**
 * Факт выпуска по заказу + стадии с учётом комплектов.
 * Если на переделе несколько изделий (куртка, брюки, рубашка) — берём min,
 * потому что комплект = столько, сколько самой дефицитной части.
 */
/** Суммарный факт выпуска из строк «Доп. объём» (__extra__) по артикулу ГП — только У (готовая продукция). */
function extraPoolFact(articleGp) {
  let total = 0;
  for (const r of S.microplan) {
    if (r.releaseOrder !== '__extra__') continue;
    if (r.stage !== 'У') continue;
    const ais = microRowArticleItems(r);
    const gp = ais.length ? (S.nomenclature.find(n => ais.some(ai => n.articleGp === ai || (n.route||[]).some(rt => rt.articleItem === ai)))?.articleGp || ais[0]) : r.articleItem;
    if (!articleGp || gp === articleGp || ais.includes(articleGp)) total += (+r.factRelease || 0);
  }
  return total;
}

/** Сколько из котла уже разобрано по производственным заказам. */
function extraPoolUsed(articleGp, excludeOrderId) {
  return S.orders
    .filter(o => o.articleGp === articleGp && o.id !== excludeOrderId)
    .reduce((s, o) => s + (+o.preShipped || 0), 0);
}

function factByOrderStageKits(orderNum, stage, articleGp) {
  const n = articleGp ? S.nomenclature.find(x => x.articleGp === articleGp) : null;
  if (!n || !n.route) return factByOrderStage(orderNum, stage);

  const stageItems = n.route.filter(item => item.stage === stage);
  if (stageItems.length <= 1) {
    // Одно изделие или нет маршрута — обычная сумма
    return factByOrderStage(orderNum, stage);
  }

  // Несколько изделий на переделе — считаем факт по каждому, берём min
  const perItem = stageItems.map(item =>
    factByOrderStageArticle(orderNum, stage, item.articleItem, null)
  );
  return Math.min(...perItem);
}

// ================================================================
// MODULE: Validation — межпередельные проверки (РЦ → АЦ → ШЦ → У)
// ================================================================
const STAGE_SEQ = { 'РЦ': 0, 'АЦ': 1, 'ШЦ': 2, 'У': 3, 'База': 4 };

/**
 * Факт выпуска по заказу + стадии + конкретному articleItem.
 * excludeRowId — строка, которую мы сейчас редактируем (чтобы не считать её дважды).
 */
function factByOrderStageArticle(orderNum, stage, articleItem, excludeRowId) {
  let total = 0;
  const k = orderReleaseKey(orderNum);
  for (const r of S.microplan) {
    if (r.stage !== stage) continue;
    if (excludeRowId != null && r.id === +excludeRowId) continue;
    if (releaseOrderEq(r.releaseOrder, orderNum)) {
      const ais = microRowArticleItems(r);
      if (!articleItem || ais.includes(articleItem)) {
        total += (+r.factRelease || 0);
      }
    }
    for (const sub of (r.subOrders || [])) {
      if (releaseOrderEq(sub.releaseOrder, orderNum)) {
        const subAis = sub.articleItems || [];
        if (!articleItem || subAis.includes(articleItem)) {
          total += (+sub.factRelease || 0);
        }
      }
    }
  }
  return total;
}

/**
 * Какие переделы реально присутствуют в маршруте ГП (из номенклатуры).
 * Возвращает Set: {'РЦ','АЦ','ШЦ','У'} — только те, что определены.
 */
function routeStagesForGp(articleGp) {
  const n = S.nomenclature.find(x => x.articleGp === articleGp);
  if (!n || !n.route) return new Set(['ШЦ']);
  return new Set(n.route.map(item => item.stage));
}

/**
 * Предыдущий передел в маршруте ГП (с учётом того, что не все переделы могут быть).
 * Например, если нет АЦ: для ШЦ предыдущий — РЦ.
 * Возвращает null если предыдущего нет (мы на первом переделе).
 */
function prevStageInRoute(articleGp, currentStage) {
  const stages = routeStagesForGp(articleGp);
  const ordered = ['РЦ', 'АЦ', 'ШЦ', 'У', 'База'].filter(s => stages.has(s));
  const idx = ordered.indexOf(currentStage);
  if (idx <= 0) return null;
  return ordered[idx - 1];
}

/**
 * Лимит факта выпуска на текущем переделе для конкретного articleItem,
 * исходя из факта предыдущего передела.
 *
 * Логика:
 * — РЦ: ограничение только количеством заказа (первый передел)
 * — АЦ: нельзя выпустить больше, чем раскроено (факт РЦ)
 * — ШЦ: нельзя выпустить больше, чем сделано на предыдущем переделе (АЦ или РЦ)
 *        при этом части (куртки, брюки) считаются раздельно!
 * — У:  нельзя упаковать больше, чем min по всем частям ШЦ (комплект!)
 *
 * Возвращает { limit, prevStage, detail } или null если ограничения нет.
 */
function stageFactLimit(orderNum, articleGp, currentStage, articleItem, excludeRowId) {
  if (!orderNum || !articleGp || !currentStage) return null;

  const prev = prevStageInRoute(articleGp, currentStage);
  if (!prev) return null; // Первый передел — без ограничений сверху

  if (currentStage === 'У') {
    // Упаковка: лимит = min(факт ШЦ по каждой части)
    const n = S.nomenclature.find(x => x.articleGp === articleGp);
    if (!n || !n.route) return null;

    const sewItems = n.route.filter(item => item.stage === prev);
    if (!sewItems.length) return null;

    if (sewItems.length === 1) {
      // Одно изделие — простая проверка
      const prevFact = factByOrderStageArticle(orderNum, prev, sewItems[0].articleItem, null);
      return { limit: prevFact, prevStage: prev, detail: `${prev}: выпущено ${prevFact} шт` };
    }

    // Несколько частей — комплект = min
    const parts = sewItems.map(item => {
      const fact = factByOrderStageArticle(orderNum, prev, item.articleItem, null);
      return { articleItem: item.articleItem, name: nameOf(item.articleItem) || item.articleItem, fact };
    });
    const minFact = Math.min(...parts.map(p => p.fact));
    const detail = parts.map(p => `${p.name}: ${p.fact} шт`).join(', ');
    return {
      limit: minFact,
      prevStage: prev,
      detail: `Комплект = min(${detail}) = ${minFact} шт`
    };
  }

  // АЦ, ШЦ: проверяем суммарный факт предыдущего передела по тому же articleItem
  // Для РЦ и АЦ articleItem может быть разным (11.xxx, 09.xxx), но они привязаны к одному ГП.
  // Факт предыдущего передела считаем по всем articleItem этого передела.
  const n = S.nomenclature.find(x => x.articleGp === articleGp);
  if (!n || !n.route) return null;

  const prevItems = n.route.filter(item => item.stage === prev);
  if (!prevItems.length) return null;

  // Суммарный факт предыдущего передела (все articleItem этого передела)
  let prevFact = 0;
  for (const pi of prevItems) {
    prevFact += factByOrderStageArticle(orderNum, prev, pi.articleItem, null);
  }

  return {
    limit: prevFact,
    prevStage: prev,
    detail: `${prev}: выпущено ${prevFact} шт`
  };
}

/**
 * Факт выпуска по заказу + стадии + articleItem, но только по строкам с датой <= maxDate.
 */
function factByOrderStageArticleUpToDate(orderNum, stage, articleItem, maxDate) {
  let total = 0;
  for (const r of S.microplan) {
    if (r.stage !== stage) continue;
    if (maxDate && r.date && r.date > maxDate) continue;
    if (releaseOrderEq(r.releaseOrder, orderNum)) {
      const ais = microRowArticleItems(r);
      if (!articleItem || ais.includes(articleItem)) {
        total += (+r.factRelease || 0);
      }
    }
    for (const sub of (r.subOrders || [])) {
      if (releaseOrderEq(sub.releaseOrder, orderNum)) {
        const subAis = sub.articleItems || [];
        if (!articleItem || subAis.includes(articleItem)) {
          total += (+sub.factRelease || 0);
        }
      }
    }
  }
  return total;
}

/**
 * Проверка: можно ли установить факт выпуска val на данном переделе.
 * Учитывает уже введённый факт на этом же переделе (по другим строкам).
 * Проверяет последовательность по датам: нельзя выпустить раньше, чем выпущено на предыдущем переделе.
 * Возвращает { ok, msg, limit, alreadyUsed } или { ok: true }.
 */
function validateStageFact(microRow, newFactValue, excludeRowId) {
  if (!microRow || !microRow.releaseOrder) return { ok: true };

  const ord = S.orders.find(o => releaseOrderEq(o.number, microRow.releaseOrder));
  if (!ord) return { ok: true };

  const stage = microRow.stage || 'ШЦ';
  const articleGp = ord.articleGp;
  const ais = microRowArticleItems(microRow);
  const primaryAi = ais[0] || microRow.articleItem || '';

  const info = stageFactLimit(microRow.releaseOrder, articleGp, stage, primaryAi, excludeRowId);
  if (!info) return { ok: true };

  // Сколько уже выпущено на этом переделе по этому заказу (без текущей строки)
  let alreadyUsed;
  if (stage === 'У') {
    alreadyUsed = factByOrderStageArticle(microRow.releaseOrder, stage, null, excludeRowId);
  } else {
    alreadyUsed = factByOrderStageArticle(microRow.releaseOrder, stage, primaryAi, excludeRowId);
  }

  const available = Math.max(0, info.limit - alreadyUsed);
  const val = +newFactValue || 0;

  if (val > available) {
    return {
      ok: false,
      msg: `Превышен лимит передела ${stage}!\n\n` +
           `${info.detail}\n` +
           `Уже выпущено на ${stage}: ${alreadyUsed} шт\n` +
           `Доступно к выпуску: ${available} шт\n` +
           `Вы пытаетесь ввести: ${val} шт`,
      limit: info.limit,
      available,
      alreadyUsed,
      prevStage: info.prevStage
    };
  }

  // Проверка последовательности по датам:
  // нельзя выпустить на текущем переделе раньше, чем выпущено на предыдущем
  if (val > 0 && microRow.date && info.prevStage) {
    const prevDate = microRow.date; // берём только факт предыдущего передела до даты текущей строки
    const n = S.nomenclature.find(x => x.articleGp === articleGp);
    if (n && n.route) {
      const prevItems = n.route.filter(item => item.stage === info.prevStage);
      let prevFactByDate;
      if (stage === 'У' && prevItems.length > 1) {
        // Упаковка: min по частям до этой даты
        const perItem = prevItems.map(item =>
          factByOrderStageArticleUpToDate(microRow.releaseOrder, info.prevStage, item.articleItem, prevDate)
        );
        prevFactByDate = Math.min(...perItem);
      } else {
        prevFactByDate = 0;
        for (const pi of prevItems) {
          prevFactByDate += factByOrderStageArticleUpToDate(microRow.releaseOrder, info.prevStage, pi.articleItem, prevDate);
        }
      }

      // Сколько уже выпущено на текущем переделе до этой даты включительно (без текущей строки)
      let usedByDate;
      if (stage === 'У') {
        usedByDate = factByOrderStageArticleUpToDate(microRow.releaseOrder, stage, null, prevDate)
                     - (+byId(S.microplan, excludeRowId)?.factRelease || 0);
      } else {
        usedByDate = factByOrderStageArticleUpToDate(microRow.releaseOrder, stage, primaryAi, prevDate)
                     - (+byId(S.microplan, excludeRowId)?.factRelease || 0);
      }
      const availByDate = Math.max(0, prevFactByDate - usedByDate);

      if (val > availByDate) {
        return {
          ok: false,
          msg: `Нарушена последовательность по датам!\n\n` +
               `На ${info.prevStage} до ${microRow.date} выпущено: ${prevFactByDate} шт\n` +
               `На ${stage} до ${microRow.date} уже выпущено: ${usedByDate} шт\n` +
               `Доступно к выпуску на ${microRow.date}: ${availByDate} шт\n` +
               `Вы пытаетесь ввести: ${val} шт\n\n` +
               `Нельзя выпустить на ${stage} больше, чем сделано на ${info.prevStage} к этой дате.`,
          limit: prevFactByDate,
          available: availByDate,
          prevStage: info.prevStage
        };
      }
    }
  }

  return { ok: true };
}

/**
 * Проверка запуска: нельзя запустить на текущем переделе больше, чем выпущено на предыдущем.
 * Теперь принимает отдельные параметры вместо microRow.launchOrder.
 */
function validateStageLaunch(orderNum, articleItem, stage, date, newQty, excludeEntryId) {
  if (!orderNum || !stage || stage === 'РЦ') return { ok: true };

  if (orderNum === '__extra__') {
    const info = launchEntryAvailQty('__extra__', articleItem, stage, excludeEntryId);
    if (!info) return { ok: true };
    const val = +newQty || 0;
    if (val > info.avail) {
      return {
        ok: false,
        msg: `Превышен лимит запуска на переделе ${stage} (Доп. объём)!\n\n` +
             `Факт выпуска на ${info.prevStage}: ${info.avail} шт\n` +
             `Доступно к запуску: ${info.avail} шт\n` +
             `Вы пытаетесь ввести: ${val} шт`,
        available: info.avail,
        prevStage: info.prevStage
      };
    }
    return { ok: true };
  }

  const ord = S.orders.find(o => releaseOrderEq(o.number, orderNum));
  if (!ord) return { ok: true };

  const articleGp = ord.articleGp;
  const info = stageFactLimit(orderNum, articleGp, stage, articleItem, null);
  if (!info) return { ok: true };

  // Сколько уже запущено на этом переделе по этому заказу (без редактируемой записи)
  let alreadyLaunched = 0;
  for (const r of S.microplan) {
    if ((r.stage || 'ШЦ') !== stage) continue;
    for (const le of (r.launches || [])) {
      if (excludeEntryId != null && +le.id === +excludeEntryId) continue;
      if (releaseOrderEq(le.order, orderNum)) {
        if (!articleItem || !le.articleItem || le.articleItem === articleItem) {
          alreadyLaunched += (+le.qty || 0);
        }
      }
    }
  }

  const available = Math.max(0, info.limit - alreadyLaunched);
  const val = +newQty || 0;

  if (val > available) {
    return {
      ok: false,
      msg: `Превышен лимит запуска на переделе ${stage}!\n\n` +
           `${info.detail}\n` +
           `Уже запущено на ${stage} (${nameOf(articleItem) || articleItem || 'все'}): ${alreadyLaunched} шт\n` +
           `Доступно к запуску: ${available} шт\n` +
           `Вы пытаетесь ввести: ${val} шт`,
      limit: info.limit,
      available,
      prevStage: info.prevStage
    };
  }

  // Проверка последовательности по датам
  if (val > 0 && date && info.prevStage) {
    const n = S.nomenclature.find(x => x.articleGp === articleGp);
    if (n && n.route) {
      const prevItems = n.route.filter(item => item.stage === info.prevStage);
      let prevFactByDate = 0;
      for (const pi of prevItems) {
        prevFactByDate += factByOrderStageArticleUpToDate(orderNum, info.prevStage, pi.articleItem, date);
      }
      let launchedByDate = 0;
      for (const r of S.microplan) {
        if ((r.stage || 'ШЦ') !== stage) continue;
        if (r.date && r.date > date) continue;
        for (const le of (r.launches || [])) {
          if (releaseOrderEq(le.order, orderNum)) {
            if (!articleItem || !le.articleItem || le.articleItem === articleItem) {
              launchedByDate += (+le.qty || 0);
            }
          }
        }
      }
      const availByDate = Math.max(0, prevFactByDate - launchedByDate);
      if (val > availByDate) {
        return {
          ok: false,
          msg: `Нарушена последовательность по датам!\n\n` +
               `На ${info.prevStage} до ${date} выпущено: ${prevFactByDate} шт\n` +
               `На ${stage} до ${date} уже запущено: ${launchedByDate} шт\n` +
               `Доступно к запуску на ${date}: ${availByDate} шт\n` +
               `Вы пытаетесь ввести: ${val} шт\n\n` +
               `Нельзя запустить на ${stage} раньше, чем выпущено на ${info.prevStage}.`,
          limit: prevFactByDate,
          available: availByDate,
          prevStage: info.prevStage
        };
      }
    }
  }

  return { ok: true };
}

/**
 * Лимит 6a: план ≤ остаток заказа (кол-во заказа − факт выпуска на этом же переделе c более ранними датами).
 * Возвращает { ok, available, used, total }.
 */
function validatePlanOrderLimit(microRow, newPlan) {
  if (!microRow || !microRow.releaseOrder || microRow.releaseOrder === '__extra__') return { ok: true };
  const ord = S.orders.find(o => releaseOrderEq(o.number, microRow.releaseOrder));
  if (!ord || !(+ord.quantity)) return { ok: true };
  const stage = microRow.stage || 'ШЦ';
  const ais = microRowArticleItems(microRow);
  const ai = ais[0] || microRow.articleItem || null;
  // Суммируем факт выпуска на том же переделе по более ранним датам (без текущей строки)
  const releasedBefore = S.microplan
    .filter(m => m.id !== microRow.id
             && releaseOrderEq(m.releaseOrder, microRow.releaseOrder)
             && (m.stage || 'ШЦ') === stage
             && m.date < microRow.date)
    .reduce((s, m) => s + Math.max(+m.factRelease || 0, +m.planRelease || 0), 0);
  // Также учитываем планы на ту же дату других строк этого заказа
  const plannedSameDay = S.microplan
    .filter(m => m.id !== microRow.id
             && releaseOrderEq(m.releaseOrder, microRow.releaseOrder)
             && (m.stage || 'ШЦ') === stage
             && m.date === microRow.date
             && !m.planReleaseIsManual)
    .reduce((s, m) => s + (+m.planRelease || 0), 0);
  const available = Math.max(0, +ord.quantity - releasedBefore - plannedSameDay);
  const val = +newPlan || 0;
  if (val > available) {
    return {
      ok: false,
      msg: `План превышает остаток заказа!\n` +
           `Кол-во по заказу: ${ord.quantity} шт\n` +
           `Выпущено ранее (${stage}): ${releasedBefore} шт\n` +
           `Запланировано в ту же дату: ${plannedSameDay} шт\n` +
           `Доступно к планированию: ${available} шт\n` +
           `Введено: ${val} шт`,
      available, releasedBefore, total: +ord.quantity
    };
  }
  return { ok: true, available };
}

/**
 * Лимит 6b: план на текущем переделе ≤ план на предыдущем переделе (с учётом дней доставки).
 * Возвращает { ok, available, prevStage, msg }.
 */
function validatePlanVsPrevStagePlan(microRow, newPlan) {
  if (!microRow || !microRow.releaseOrder || microRow.releaseOrder === '__extra__') return { ok: true };
  const stage = microRow.stage || 'ШЦ';
  const stageOrder = ['РЦ', 'АЦ', 'ШЦ', 'У'];
  const myIdx = stageOrder.indexOf(stage);
  if (myIdx <= 0) return { ok: true }; // РЦ — первый, без ограничений
  const prevStage = stageOrder[myIdx - 1];
  const ord = S.orders.find(o => releaseOrderEq(o.number, microRow.releaseOrder));
  if (!ord) return { ok: true };
  // Ищем ОП предыдущего передела по данному заказу в микроплане
  const prevRows = S.microplan.filter(m =>
    releaseOrderEq(m.releaseOrder, microRow.releaseOrder) &&
    (m.stage || 'ШЦ') === prevStage
  );
  const prevOp = prevRows.length ? prevRows[0].op : '';
  const delivDays = deliveryDaysFor(prevOp, microRow.op);
  const cutoffDate = delivDays ? addCalDays(microRow.date, -delivDays) : microRow.date;
  const prevPlan = prevRows
    .filter(m => !cutoffDate || m.date <= cutoffDate)
    .reduce((s, m) => s + (+m.planRelease || 0), 0);
  // Уже запланировано/выпущено на текущем переделе по этому заказу (без текущей строки)
  const usedOnCurrent = S.microplan
    .filter(m => m.id !== microRow.id
             && releaseOrderEq(m.releaseOrder, microRow.releaseOrder)
             && (m.stage || 'ШЦ') === stage)
    .reduce((s, m) => s + Math.max(+m.planRelease || 0, +m.factRelease || 0), 0);
  const available = Math.max(0, prevPlan - usedOnCurrent);
  const val = +newPlan || 0;
  if (prevPlan > 0 && val > available) {
    return {
      ok: false,
      msg: `План превышает план предыдущего передела!\n` +
           `${prevStage}: план ${prevPlan} шт (до ${cutoffDate}${delivDays ? `, учтено ${delivDays} дн. доставки` : ''})\n` +
           `На ${stage} уже запланировано: ${usedOnCurrent} шт\n` +
           `Доступно: ${available} шт · Введено: ${val} шт`,
      available, prevStage, prevPlan
    };
  }
  return { ok: true, available };
}

/**
 * Предупреждения в ячейке «Заказ выпуска»:
 * — предыдущий передел не запланирован
 * — предыдущий передел запланирован в меньшем кол-ве
 * — дата не подходит с учётом срока доставки
 * Возвращает HTML-строку ('' если всё OK).
 */
function releaseOrderWarnHtml(row) {
  if (!row.releaseOrder) return '';

  // Для Доп. объёма — только проверка даты доставки
  if (row.releaseOrder === '__extra__') {
    const dc = checkDeliveryDate(row);
    if (!dc.ok) {
      return `<div style="font-size:9px;color:#b45309;margin-top:2px;line-height:1.3">⚠ ${esc(`Доставка с ${dc.prevOp||'?'} (${dc.prevStage||'?'}): ${dc.days} дн. — не ранее ${fmtDate(dc.minDate)}`)}</div>`;
    }
    return '';
  }

  const stage = row.stage || 'ШЦ';
  const stageOrder = ['РЦ', 'АЦ', 'ШЦ', 'У'];
  const myIdx = stageOrder.indexOf(stage);
  if (myIdx <= 0) return '';
  const prevStage = stageOrder[myIdx - 1];
  if (!S.orders.find(o => releaseOrderEq(o.number, row.releaseOrder))) return '';

  const prevRows = S.microplan.filter(m =>
    releaseOrderEq(m.releaseOrder, row.releaseOrder) &&
    (m.stage || 'ШЦ') === prevStage
  );
  const prevPlan = prevRows.reduce((s, m) => s + (+m.planRelease || 0), 0);
  const curPlan  = +row.planRelease || 0;

  const warns = [];
  if (prevRows.length === 0) {
    warns.push(`Передел ${prevStage} не запланирован`);
  } else if (prevPlan === 0) {
    warns.push(`${prevStage}: план не задан`);
  } else if (curPlan > 0 && prevPlan < curPlan) {
    warns.push(`${prevStage}: план ${prevPlan} шт, нужно ${curPlan} шт`);
  }

  const dc = checkDeliveryDate(row);
  if (!dc.ok) {
    warns.push(`Доставка с ${dc.prevOp||'?'} (${dc.prevStage||'?'}): ${dc.days} дн. — не ранее ${fmtDate(dc.minDate)}`);
  }

  return warns.map(w =>
    `<div style="font-size:9px;color:#b45309;margin-top:2px;line-height:1.3">⚠ ${esc(w)}</div>`
  ).join('');
}

/**
 * Лимит 6d: выпуск ≤ сумма запусков по тому же (заказу, артикулу, переделу) на даты ≤ текущей.
 * Возвращает { ok, totalLaunched, msg }.
 */
function validateReleaseVsLaunches(microRow, newFact) {
  if (!microRow || !microRow.releaseOrder || microRow.releaseOrder === '__extra__') return { ok: true, available: null };
  const stage = microRow.stage || 'ШЦ';
  if (stage === 'РЦ') return { ok: true, available: null };
  const ais = microRowArticleItems(microRow);
  const totalLaunched = S.microplan
    .filter(m => releaseOrderEq(m.releaseOrder, microRow.releaseOrder)
             && (m.stage || 'ШЦ') === stage
             && (!microRow.date || !m.date || m.date <= microRow.date))
    .flatMap(m => m.launches || [])
    .filter(le => releaseOrderEq(le.order, microRow.releaseOrder)
                  && (!ais.length || !le.articleItem || ais.includes(le.articleItem)))
    .reduce((s, le) => s + (+le.qty || 0), 0);
  // Выпущено другими строками до этой включительно
  const releasedOther = S.microplan
    .filter(m => m.id !== microRow.id
             && releaseOrderEq(m.releaseOrder, microRow.releaseOrder)
             && (m.stage || 'ШЦ') === stage
             && (!microRow.date || !m.date || m.date <= microRow.date))
    .reduce((s, m) => s + (+m.factRelease || 0), 0);
  const available = Math.max(0, totalLaunched - releasedOther);
  const val = +newFact || 0;
  if (totalLaunched > 0 && val > available) {
    return {
      ok: false,
      msg: `Выпуск превышает сумму запусков!\n` +
           `Запущено на ${stage} по заказу (до ${microRow.date}): ${totalLaunched} шт\n` +
           `Уже выпущено другими строками: ${releasedOther} шт\n` +
           `Доступно к выпуску: ${available} шт · Введено: ${val} шт`,
      available, totalLaunched
    };
  }
  return { ok: true, available: totalLaunched > 0 ? available : null };
}

function qtyByOrderGpInRange(orderNum, articleGp, field, month) {
  const k = orderReleaseKey(orderNum);
  let rows = S.microplan.filter(m => orderReleaseKey(m.releaseOrder) === k);
  if (month) rows = rows.filter(m => m.date && m.date.startsWith(month));
  return qtyKitsMicroPerProdOrder(rows, articleGp, field);
}

function plannedByOrderGp(orderNum, articleGp) {
  const k = orderReleaseKey(orderNum);
  const o = S.orders.find(x => orderReleaseKey(x.number) === k);
  if (!o) return 0;
  return S.microplan.filter(m => orderReleaseKey(m.releaseOrder) === k)
    .reduce((s,m) => s + (+m.planRelease||0), 0);
}
function macroplanQtyForOrder(orderNum, articleGp) {
  const o = S.orders.find(x => releaseOrderEq(x.number, orderNum));
  if (!o) return 0;
  const links = linksForPO(o.id);
  if (links.length) {
    const contractIds = [...new Set(links.map(l => byId(S.customerOrders, l.customerOrderId)?.contractId).filter(Boolean))];
    return contractIds.reduce((s, cid) => s + plannedByContractRow(cid, articleGp), 0);
  }
  // Fallback: старая логика для не-мигрированных записей
  const co = byId(S.customerOrders, o.contractId);
  const contractId = co?.contractId || o.contractId;
  return contractId ? plannedByContractRow(contractId, articleGp) : 0;
}

// ── Хелперы для junction-таблицы S.orderLinks (ЗК ↔ ПЗ, many-to-many) ──

function linksForCO(coId) {
  return (S.orderLinks || []).filter(l => l.customerOrderId === +coId);
}
function linksForPO(poId) {
  return (S.orderLinks || []).filter(l => l.productionOrderId === +poId);
}
/** Синхронизировать o.quantity = сумма link.qty всех привязок этого ПЗ. */
function _syncPoQty(poId) {
  const po = byId(S.orders, +poId);
  if (!po) return;
  const total = linksForPO(po.id).reduce((s, l) => s + (+l.qty || 0), 0);
  po.quantity = total;
}
function addOrderLink(coId, poId, qty) {
  if (!S.orderLinks) S.orderLinks = [];
  const existing = S.orderLinks.find(l => l.customerOrderId === +coId && l.productionOrderId === +poId);
  if (existing) { existing.qty = Math.max(0, +qty || 0); }
  else S.orderLinks.push({ id: nid(), customerOrderId: +coId, productionOrderId: +poId, qty: Math.max(0, +qty || 0) });
  _syncPoQty(poId);
  save(); renderActive();
}
function deleteOrderLink(linkId) {
  const l = (S.orderLinks || []).find(x => x.id === +linkId);
  S.orderLinks = (S.orderLinks || []).filter(x => x.id !== +linkId);
  if (l) _syncPoQty(l.productionOrderId);
  save(); renderActive();
}
function updOrderLinkQty(linkId, qty) {
  const l = (S.orderLinks || []).find(x => x.id === +linkId);
  if (!l) return;
  l.qty = Math.max(0, +qty || 0);
  _syncPoQty(l.productionOrderId);
  save(); renderActive();
}
function addOrderLinkFromCO(coId) {
  const poSel = document.getElementById(`ol-po-${coId}`);
  const qtyEl = document.getElementById(`ol-qty-co-${coId}`);
  const poId  = +poSel?.value;
  const qty   = Math.max(0, parseFloat(qtyEl?.value) || 0);
  if (!poId || qty <= 0) { _alert('Выберите заказ на производство и укажите количество'); return; }
  addOrderLink(coId, poId, qty);
}
function addOrderLinkFromPO(poId) {
  const coSel = document.getElementById(`ol-co-${poId}`);
  const qtyEl = document.getElementById(`ol-qty-po-${poId}`);
  const coId  = +coSel?.value;
  const qty   = Math.max(0, parseFloat(qtyEl?.value) || 0);
  if (!coId || qty <= 0) { _alert('Выберите заказ клиента и укажите количество'); return; }
  addOrderLink(coId, poId, qty);
}

function factByContractRowForOp(customerOrderId, articleGp, opFilter) {
  const links = linksForCO(customerOrderId);
  let ords = links.map(l => byId(S.orders, l.productionOrderId)).filter(o => o && o.articleGp === articleGp);
  if (opFilter) ords = ords.filter(o => o.op === opFilter);
  return sumMicroKitsOverProdOrders(ords, articleGp, 'factRelease', null);
}

function factByContractRow(customerOrderId, articleGp) {
  return factByContractRowForOp(customerOrderId, articleGp, '');
}

/**
 * План готовой продукции из макроплана за месяц (агрегат по группам, не сумма 3×1000).
 * Группировка: канонический контракт + ГП + ОП; внутри — qtyKitsFromMacroRows.
 */
function macroplanQtyForMonth(ym, opFilter) {
  let rows = S.macroplan.filter(r => r.month === ym);
  if (opFilter) rows = rows.filter(r => r.op === opFilter);
  const groups = new Map();
  for (const r of rows) {
    const gp = articleGpForMacroArticleItem(r.articleItem);
    const cid = macroContractCanonicalId(r.contractId);
    const key = `${cid}|${gp}|${r.op || ''}`;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(r);
  }
  let sum = 0;
  for (const gRows of groups.values()) {
    const gp = articleGpForMacroArticleItem(gRows[0].articleItem);
    sum += qtyKitsFromMacroRows(gRows, gp);
  }
  return sum;
}

/** Факт по микроплану за месяц: по каждому пр. заказу (ГП+min частей), затем сумма по ЗК. */
function microFactKitsForMonth(ym, opFilter) {
  return S.customerOrders.reduce((s, co) => {
    const links = linksForCO(co.id);
    let ords = links.map(l => byId(S.orders, l.productionOrderId)).filter(o => o && o.articleGp === co.articleGp);
    if (opFilter) ords = ords.filter(o => o.op === opFilter);
    if (!ords.length) return s;
    return s + sumMicroKitsOverProdOrders(ords, co.articleGp, 'factRelease', m => m.date && m.date.startsWith(ym));
  }, 0);
}
function plannedByContractRow(contractId, articleGp) {
  const cidSet = contractIdSetForMacro(+contractId);
  const rows = S.macroplan.filter(r =>
    cidSet.has(+r.contractId) && articleGpForMacroArticleItem(r.articleItem) === articleGp
  );
  return qtyKitsFromMacroRows(rows, articleGp);
}

function factByContractRowLastDays(contractId, articleGp, days) {
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-days); cutoff.setHours(0,0,0,0);
  const links = linksForCO(contractId);
  const ords = links.map(l => byId(S.orders, l.productionOrderId)).filter(o => o && o.articleGp === articleGp);
  return sumMicroKitsOverProdOrders(ords, articleGp, 'factRelease', m => m.date && new Date(m.date) >= cutoff);
}

/** Id контракта из справочника + id всех заказов клиентов, привязанных к этому контракту (в микроплане часто contractId = id ЗК). */
function contractIdSetForMacro(contractRowId) {
  const ids = new Set([+contractRowId]);
  S.customerOrders.filter(c => c.contractId === +contractRowId).forEach(c => ids.add(c.id));
  return ids;
}

/**
 * Строка микроплана учитывается в «Факт выпуска» макроплана для данной строки макроплана.
 * Цех: если в макроплане или в микроплане цех не указан — не режем по цеху (иначе факт часто «теряется»).
 */
function microRowMatchesMacroFact(m, row, cidMacro) {
  const macroVt = row.volumeType || 'main';
  const microIsExtra = m.releaseOrder === '__extra__';

  if (macroVt === 'extra') {
    // Доп. строки макро ↔ только __extra__ строки микро (без фильтра по контракту)
    if (!microIsExtra) return false;
    if (!microRowArticleItems(m).includes(row.articleItem)) return false;
    if (m.op !== row.op) return false;
    const rw = (row.workshop || '').trim();
    const mw = (m.workshop || '').trim();
    if (!rw || !mw) return true;
    return mw === rw;
  }

  // Основные: исключаем __extra__ строки
  if (microIsExtra) return false;
  if (!cidMacro.has(+m.contractId)) return false;
  if (!microRowArticleItems(m).includes(row.articleItem)) return false;
  if (m.op !== row.op) return false;
  const rw = (row.workshop || '').trim();
  const mw = (m.workshop || '').trim();
  if (!rw || !mw) return true;
  return mw === rw;
}

function assortmentGroupForArticleItem(articleItem) {
  const n = S.nomenclature.find(x => x.articleItem === articleItem);
  return n && n.assortmentGroup != null ? String(n.assortmentGroup) : '';
}

function macroRowPassesFilters(r) {
  if (macroFilters.articleItem && r.articleItem !== macroFilters.articleItem) return false;
  if (macroFilters.contractNumber) {
    const c = byId(S.contracts, r.contractId);
    if (!c || c.number !== macroFilters.contractNumber) return false;
  }
  if (macroFilters.assortment) {
    if (assortmentGroupForArticleItem(r.articleItem) !== macroFilters.assortment) return false;
  }
  if (macroFilters.workshops?.length && !macroFilters.workshops.includes(r.workshop || '')) return false;
  if (macroFilters.months?.length && !macroFilters.months.includes(r.month || '')) return false;
  return true;
}

/** Сумма выделенных количеств (link.qty) пр. заказов по контракту и артикулу ГП. */
function orderedQtyContractGp(contractId, articleGp, excludeOrderId) {
  let s = 0;
  for (const co of S.customerOrders.filter(c => +c.contractId === +contractId && c.articleGp === articleGp)) {
    for (const link of linksForCO(co.id)) {
      if (excludeOrderId && link.productionOrderId === +excludeOrderId) continue;
      s += +link.qty || 0;
    }
  }
  return s;
}

/** Остаток лимита контракта по ГП для новых/изменяемых пр. заказов. */
function remainingContractCapacityForGp(contractId, articleGp, excludeOrderId) {
  const c = byId(S.contracts, contractId);
  const total = contractTotalQty(c);
  if (!c || total <= 0) return Infinity;
  const used = orderedQtyContractGp(contractId, articleGp, excludeOrderId);
  return Math.max(0, total - used);
}

/** Открыто в производстве: сумма количеств по производственным заказам (ГП строки), без вычета факта выпуска. */
function openInProductionForMacroRow(row) {
  const rowGp = articleGpForMacroArticleItem(row.articleItem);
  return orderedQtyContractGp(row.contractId, rowGp, null);
}

function frvNominalFromSchedOp(opName, ym) {
  const brigades = S.schedules.filter(s => s.op === opName && (!s.activeMonths || s.activeMonths.includes(ym)));
  const days = daysInMonth(ym);
  let total = 0;
  for (const s of brigades) {
    for (let d = 1; d <= days; d++) {
      const ds = `${ym}-${String(d).padStart(2, '0')}`;
      const { dayType, staffCount, shiftTime } = getCellState(s, ds);
      if (dayType !== 'rest' && dayType !== 'holiday' && dayType !== 'vacation') total += (+staffCount || 0) * (+shiftTime || 0);
    }
  }
  return total;
}

function frvEffectiveFromSchedOp(opName, ym) {
  const brigades = S.schedules.filter(s => s.op === opName && (!s.activeMonths || s.activeMonths.includes(ym)));
  const days = daysInMonth(ym);
  let nominal = 0;
  let effective = 0;
  for (const s of brigades) {
    for (let d = 1; d <= days; d++) {
      const ds = `${ym}-${String(d).padStart(2, '0')}`;
      const { dayType, staffCount, shiftTime } = getCellState(s, ds);
      if (dayType === 'rest' || dayType === 'holiday' || dayType === 'vacation') continue;
      const base = (+staffCount || 0) * (+shiftTime || 0);
      nominal += base;
      effective += base * 0.95;
    }
  }
  return { nominal, effective };
}

/** Номинал чел-мин по записи ручного ФРВ: сумма вариантов (люди×смена×дней) или старое поле frvMin. */
function manualFrvNominalForRecord(r) {
  if (!r) return 0;
  const segs = r.frvSegments;
  if (Array.isArray(segs) && segs.length > 0) {
    let t = 0;
    for (const seg of segs) {
      const p = Math.max(0, +seg.people || 0);
      const sh = Math.max(0, +seg.shiftMin || 0);
      const d = Math.max(0, +seg.workDays || 0);
      if (p > 0 && sh > 0 && d > 0) t += p * sh * d;
    }
    if (t > 0) return t;
  }
  return Math.max(0, +r.frvMin || 0);
}

/** Средневзвешенная эффективность по сегментам ФРВ. */
function manualFrvWeightedEff(r) {
  if (!r) return 100;
  const segs = r.frvSegments;
  if (Array.isArray(segs) && segs.length > 0) {
    let totalNom = 0, totalWeighted = 0;
    for (const seg of segs) {
      const p = Math.max(0, +seg.people || 0);
      const sh = Math.max(0, +seg.shiftMin || 0);
      const d = Math.max(0, +seg.workDays || 0);
      const nom = p * sh * d;
      if (nom <= 0) continue;
      const eff = Number.isFinite(+seg.effPct) ? Math.max(0, +seg.effPct) : (Number.isFinite(+r.effPct) ? +r.effPct : 100);
      totalNom += nom;
      totalWeighted += nom * eff;
    }
    if (totalNom > 0) return totalWeighted / totalNom;
  }
  return Number.isFinite(+r.effPct) ? Math.max(0, +r.effPct) : 100;
}

/** Ручной ФРВ по ОП+месяцу (сумма по цехам): чел-мин × 95% (без эффективности). */
function frvManualEffectiveSumOpMonth(opName, ym, workshop) {
  return (S.manualFrv || []).filter(x => x.op === opName && x.month === ym && (workshop == null || x.workshop === workshop)).reduce((s, x) => {
    const frv = manualFrvNominalForRecord(x);
    return frv > 0 ? s + frv * 0.95 : s;
  }, 0);
}

function frvEffectiveForMacroLoad(opName, ym, workshop) {
  const man = frvManualEffectiveSumOpMonth(opName, ym, workshop);
  if (man > 0) return man;
  if (workshop != null) return 0;
  return frvEffectiveFromSchedOp(opName, ym).effective;
}

/** Вручную введённая эффективность для (ОП, цех, месяц) в загрузке макроплана, %. */
function getMacroEff(op, workshop, month) {
  if (!S.macroEff) return 100;
  const rec = S.macroEff.find(x => x.op === op && x.workshop === (workshop||'') && x.month === month);
  return rec != null ? +rec.eff : 100;
}

function setMacroEff(op, workshop, month, eff) {
  if (!S.macroEff) S.macroEff = [];
  const v = Math.max(0, Math.min(999, +eff || 100));
  const rec = S.macroEff.find(x => x.op === op && x.workshop === (workshop||'') && x.month === month);
  if (rec) rec.eff = v;
  else S.macroEff.push({ id: nid(), op, workshop: workshop||'', month, eff: v });
  save();
  renderActive();
}

/** Средневзвешенная эффективность по строкам макроплана (вес = трудозатраты). */
function macroRowsEfficiency(rows) {
  let totalMin = 0, weightedEff = 0;
  for (const r of rows) {
    const min = macroRowLaborMinutes(r);
    const eff = r.eff != null ? Math.max(0.01, +r.eff) : 100;
    if (min > 0) { totalMin += min; weightedEff += eff * min; }
  }
  return totalMin > 0 ? weightedEff / totalMin : 100;
}

/** Номинальный ФРВ по ОП+месяц из ручных записей (без effPct и ×0.95). */
function frvNominalSumOpMonth(opName, ym, workshop) {
  return (S.manualFrv || [])
    .filter(x => x.op === opName && x.month === ym && (workshop == null || x.workshop === workshop))
    .reduce((s, x) => s + manualFrvNominalForRecord(x), 0);
}

/** Доступное время = ФРВ_номинал × 0.95. */
function frvAvailableTimeOpMonth(opName, ym, workshop) {
  return frvNominalSumOpMonth(opName, ym, workshop) * 0.95;
}

/** Средняя эффективность по ОП+месяц[+цех] (взвешенная по номиналу). */
function frvAvgEffPctOpMonth(opName, ym, workshop) {
  const recs = (S.manualFrv || []).filter(x => x.op === opName && x.month === ym && (workshop == null || x.workshop === workshop));
  if (!recs.length) return null;
  let wSum = 0, wTotal = 0;
  for (const x of recs) {
    const nom = manualFrvNominalForRecord(x);
    const eff = manualFrvWeightedEff(x);
    wSum += nom * eff;
    wTotal += nom;
  }
  return wTotal > 0 ? Math.round(wSum / wTotal) : 100;
}

/** Средневзвешенная эффективность из данных микроплана для ОП+месяц[+цех]. */
function microAvgEffPctForOpMonth(opName, ym, workshop) {
  const rows = S.microplan.filter(r =>
    r.op === opName &&
    (workshop == null || (r.workshop || '') === workshop) &&
    r.date && r.date.slice(0, 7) === ym
  );
  let wSum = 0, wTotal = 0;
  for (const r of rows) {
    for (const w of (r.workers || [])) {
      const att = +w.attendance || 0;
      const sh = +w.shiftTime || 0;
      const eff = w.effPct != null && Number.isFinite(+w.effPct) ? +w.effPct : 100;
      const weight = att * sh;
      if (weight > 0) { wSum += eff * weight; wTotal += weight; }
    }
  }
  return wTotal > 0 ? Math.round(wSum / wTotal) : null;
}

function brigadesForOpWorkshopMonth(opName, workshop, ym) {
  return S.schedules.filter(s =>
    s.op === opName && s.workshop === workshop && (!s.activeMonths || s.activeMonths.includes(ym))
  );
}

/** Номинальный и эффективный ФРВ по графику для набора бригад (один месяц). */
function frvSchedStatsForBrigades(brigades, ym) {
  const days = daysInMonth(ym);
  let nominal = 0;
  let effective = 0;
  for (const s of brigades) {
    for (let d = 1; d <= days; d++) {
      const ds = `${ym}-${String(d).padStart(2, '0')}`;
      const { dayType, staffCount, shiftTime } = getCellState(s, ds);
      if (dayType === 'rest' || dayType === 'holiday' || dayType === 'vacation') continue;
      const base = (+staffCount || 0) * (+shiftTime || 0);
      nominal += base;
      effective += base * 0.95;
    }
  }
  return { nominal, effective };
}

function applyScheduleMonthSnapshot(scheduleId, targetMonth, viewSnap) {
  const sched = byId(S.schedules, scheduleId);
  if (!sched) return;
  S.scheduleMonthOverrides = S.scheduleMonthOverrides.filter(o => !(o.scheduleId === scheduleId && o.month === targetMonth));
  const o = { scheduleId, month: targetMonth };
  if (viewSnap.name != null && String(viewSnap.name) !== String(sched.name)) o.name = viewSnap.name;
  if (viewSnap.shiftTime != null && +viewSnap.shiftTime !== +sched.shiftTime) o.shiftTime = +viewSnap.shiftTime;
  if (viewSnap.effPct != null && +viewSnap.effPct !== +sched.effPct) o.effPct = +viewSnap.effPct;
  if (o.name != null || o.shiftTime != null || o.effPct != null) S.scheduleMonthOverrides.push(o);
}

function copyScheduleShiftsToNextMonth() {
  try {
    const cur = schedMonth;
    const next = nextMonth(cur);
    const opF = scheduleOp || '';
    const brigades = S.schedules.filter(s => (!s.activeMonths || s.activeMonths.includes(cur)) && (!opF || s.op === opF));
    if (!brigades.length) {
      _alert('Нет активных бригад за текущий месяц (с учётом фильтра ОП).');
      return;
    }
    const daysCur = daysInMonth(cur);
    const daysNext = daysInMonth(next);
    const nCopy = Math.min(daysCur, daysNext);

    for (const s of brigades) {
      if (!s.activeMonths) s.activeMonths = [cur];
      if (!s.activeMonths.includes(next)) s.activeMonths.push(next);

      const viewCur = getScheduleView(s.id, cur) || s;
      applyScheduleMonthSnapshot(s.id, next, { name: viewCur.name, shiftTime: viewCur.shiftTime, effPct: viewCur.effPct });

      S.calOverrides = S.calOverrides.filter(o => !(o.scheduleId === s.id && monthOfDate(o.date) === next));
      for (let d = 1; d <= nCopy; d++) {
        const dsCur = `${cur}-${String(d).padStart(2, '0')}`;
        const dsNext = `${next}-${String(d).padStart(2, '0')}`;
        const st = getCellState(s, dsCur);
        S.calOverrides.push({ scheduleId: s.id, date: dsNext, dayType: st.dayType, staffCount: st.staffCount });
      }
    }

    save();
    schedResult = `Смены скопированы на ${mlabel(next)} (${brigades.length} бриг.).`;
    _alert(`Смены успешно скопированы на ${mlabel(next)}.`);
    renderSchedules();
  } catch (e) {
    console.error(e);
    _alert('Ошибка копирования смен: ' + (e && e.message ? e.message : String(e)));
  }
}

function precomputeWip() {
  const wip = {};
  const wipSubs = {};
  const rows = [...S.microplan].sort((a, b) => {
    const da = a.date ? new Date(a.date) : new Date(0);
    const db = b.date ? new Date(b.date) : new Date(0);
    if (da - db !== 0) return da - db;
    return (a.id || 0) - (b.id || 0);
  });

  const launchByKey = {};
  const releaseByKey = {};
  const releaseSubByKey = {};
  // НЗП считается отдельно для (заказ, артикул, этап, ОП, цех)
  const keyOf = (orderNum, articleItem, stage, op, workshop) =>
    `${orderReleaseKey(orderNum)}|${articleItem||''}|${stage||''}|${op||''}|${workshop||''}`;

  for (const r of rows) {
    const _stage = r.stage || 'ШЦ';
    const _op = r.op || '';
    const _ws = r.workshop || '';
    const primaryAi = (microRowArticleItems(r)[0]) || r.articleItem || '';
    const kRelease = keyOf(r.releaseOrder, primaryAi, _stage, _op, _ws);
    const subs = r.subOrders || [];

    // РЦ — первый передел, НЗП не нужен
    if (_stage === 'РЦ') {
      wip[r.id] = 0;
      wipSubs[r.id] = subs.map(() => 0);
      // Факт выпуска РЦ учитываем в releaseByKey ключом РЦ (не смешивается с АЦ/ШЦ/У)
      releaseByKey[kRelease] = (releaseByKey[kRelease] || 0) + (+r.factRelease || 0);
      for (const sub of subs) {
        const aiSub = (sub.articleItems || [])[0] || primaryAi;
        const kSub = keyOf(sub.releaseOrder, aiSub, _stage, _op, _ws);
        releaseByKey[kSub] = (releaseByKey[kSub] || 0) + (+sub.factRelease || 0);
      }
      continue;
    }

    // Запуски из нового массива launches — привязаны к переделу/ОП/цеху текущей строки
    for (const le of (r.launches || [])) {
      if (le.order && (+le.qty || 0) > 0) {
        const kLe = keyOf(le.order, le.articleItem || primaryAi, _stage, _op, _ws);
        launchByKey[kLe] = (launchByKey[kLe] || 0) + (+le.qty || 0);
      }
    }
    releaseByKey[kRelease] = (releaseByKey[kRelease] || 0) + (+r.factRelease || 0);

    for (const sub of subs) {
      const aiSub = (sub.articleItems || [])[0] || primaryAi;
      const kSub = keyOf(sub.releaseOrder, aiSub, _stage, _op, _ws);
      if (kSub === kRelease) {
        releaseByKey[kRelease] = (releaseByKey[kRelease] || 0) + (+sub.factRelease || 0);
      } else {
        releaseSubByKey[kSub] = (releaseSubByKey[kSub] || 0) + (+sub.factRelease || 0);
      }
    }

    wip[r.id] = (launchByKey[kRelease] || 0) - (releaseByKey[kRelease] || 0);

    wipSubs[r.id] = subs.map(sub => {
      const aiSub = (sub.articleItems || [])[0] || primaryAi;
      const kSub = keyOf(sub.releaseOrder, aiSub, _stage, _op, _ws);
      if (kSub === kRelease) return wip[r.id];
      return (launchByKey[kSub] || 0) - (releaseSubByKey[kSub] || 0);
    });
  }
  return { wip, wipSubs };
}

function pctBar(pct) {
  const v = Math.min(100, Math.max(0, +pct||0));
  const color = v>=100 ? '#16a34a' : v>=60 ? '#2563eb' : '#f59e0b';
  return `<span class="prog-wrap"><span class="prog-bar"><span class="prog-fill" style="width:${v}%;background:${color}"></span></span><span>${(+pct||0).toFixed(1)}%</span></span>`;
}

const MPS = {};
const MN_S = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
const MN_F = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
function mlabel(v) { if (!v) return ''; const [y,m]=v.split('-'); return `${MN_F[+m-1]} ${y}`; }
function mpVal(id) { const h=document.getElementById(id+'-value'); return h?h.value:(MPS[id]?.value||''); }
function mpWidget(id, val) {
  const yr = val ? +val.split('-')[0] : new Date().getFullYear();
  if (!MPS[id]) MPS[id] = { year:yr, value:val||'' };
  return `<div class="mp-wrap" id="${id}">
    <input class="mp-input" id="${id}-input" placeholder="Выберите месяц" readonly value="${esc(mlabel(val))}" onclick="mpToggle('${id}')">
    <input type="hidden" id="${id}-value" value="${esc(val||'')}">
    <div class="mp-popup" id="${id}-popup">
      <div class="mp-nav">
        <button onclick="mpNav('${id}',-1)">‹</button>
        <span id="${id}-yr">${yr}</span>
        <button onclick="mpNav('${id}',1)">›</button>
      </div>
      <div class="mp-grid" id="${id}-grid"></div>
    </div>
  </div>`;
}
function mpToggle(id) {
  document.querySelectorAll('.mp-popup').forEach(p => { if(p.id!==id+'-popup') p.classList.remove('open'); });
  const p=document.getElementById(id+'-popup'); if(!p) return;
  if (p.classList.contains('open')) { p.classList.remove('open'); return; }
  if (!MPS[id]) MPS[id]={year:new Date().getFullYear(),value:''};
  p.classList.add('open'); mpGrid(id);
}
function mpNav(id,d) { if(!MPS[id]) MPS[id]={year:new Date().getFullYear(),value:''}; MPS[id].year+=d; mpGrid(id); }
function mpGrid(id) {
  const s=MPS[id]; if(!s) return;
  const yl=document.getElementById(id+'-yr'); if(yl) yl.textContent=s.year;
  const g=document.getElementById(id+'-grid'); if(!g) return;
  g.innerHTML=MN_S.map((m,i)=>{
    const v=`${s.year}-${String(i+1).padStart(2,'0')}`;
    return `<button class="mp-btn ${s.value===v?'mp-sel':''}" onclick="mpSel('${id}',${i+1})">${m}</button>`;
  }).join('');
}
function mpSel(id,month) {
  const s=MPS[id]; if(!s) return;
  const v=`${s.year}-${String(month).padStart(2,'0')}`;
  s.value=v;
  const i=document.getElementById(id+'-input'); if(i) i.value=mlabel(v);
  const h=document.getElementById(id+'-value'); if(h) h.value=v;
  document.getElementById(id+'-popup').classList.remove('open');
  if (id === 'mpf-month' && document.getElementById('op-load-panel')) renderOpLoadPanel();
}
document.addEventListener('click', e => {
  if (!e.target.closest('.mp-wrap')) document.querySelectorAll('.mp-popup').forEach(p=>p.classList.remove('open'));
});
