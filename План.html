async function deleteCustomerOrder(id) {
  const linked = linksForCO(id);
  const msg = linked.length
    ? `Удалить заказ клиента? Привязки к ${linked.length} заказам на производство будут удалены (сами заказы на производство останутся).`
    : 'Удалить заказ клиента?';
  if (!await _confirm(msg)) return;
  S.orderLinks = (S.orderLinks || []).filter(l => l.customerOrderId !== +id);
  S.microplan = S.microplan.filter(m => m.contractId !== id);
  S.customerOrders = S.customerOrders.filter(c => c.id !== id);
  save();
  renderActive();
}

async function deleteContract(id) {
  if (!await _confirm('Удалить контракт? Все связанные заказы клиентов, производственные заказы и макроплан будут удалены.')) return;
  const coIds = S.customerOrders.filter(c => c.contractId === id).map(c => c.id);
  for (const coId of coIds) {
    const linkedPoIds = linksForCO(coId).map(l => l.productionOrderId);
    const ordersToDel = S.orders.filter(o => linkedPoIds.includes(o.id));
    for (const o of ordersToDel) {
      S.orderLinks = (S.orderLinks || []).filter(l => l.productionOrderId !== o.id);
      S.microplan = S.microplan.filter(m => !releaseOrderEq(m.releaseOrder, o.number) && !(m.launches||[]).some(le=>releaseOrderEq(le.order,o.number)));
      S.orders = S.orders.filter(x => x.id !== o.id);
    }
    S.orderLinks = (S.orderLinks || []).filter(l => l.customerOrderId !== coId);
    S.microplan = S.microplan.filter(m => m.contractId !== coId);
  }
  S.customerOrders = S.customerOrders.filter(c => c.contractId !== id);
  S.macroplan = S.macroplan.filter(r => r.contractId !== id);
  S.contracts = S.contracts.filter(c => c.id !== id);
  save();
  renderActive();
}

async function deleteProductionOrder(id) {
  const order = byId(S.orders, id);
  if (!order) return;
  if (!await _confirm(`Удалить производственный заказ "${order.number}"? Все строки макроплана, микроплана и привязки к заказам клиентов будут удалены.`)) return;
  S.orderLinks = (S.orderLinks || []).filter(l => l.productionOrderId !== +id);
  S.macroplan = S.macroplan.filter(r => r.orderNumber !== order.number);
  S.microplan = S.microplan.filter(m => !releaseOrderEq(m.releaseOrder, order.number) && !(m.launches||[]).some(le=>releaseOrderEq(le.order,order.number)));
  S.orders = S.orders.filter(o => o.id !== id);
  save();
  renderActive();
}

function moveProdOrder(id, dir) {
  const idx = S.orders.findIndex(o => o.id === id);
  if (idx < 0) return;
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= S.orders.length) return;
  [S.orders[idx], S.orders[newIdx]] = [S.orders[newIdx], S.orders[idx]];
  save();
  renderProductionOrders();
}

async function deleteMacro(id) {
  if (!await _confirm('Удалить строку макроплана?')) return;
  S.macroplan = S.macroplan.filter(r => r.id !== id);
  save();

}

async function deleteMicro(id) {

async function deleteMicroMonth(ym) {
  const count = S.microplan.filter(m => (m.date || '').startsWith(ym)).length;
  if (!count) return;
  if (!await _confirm(`Удалить все ${count} строк(и) микроплана за ${mlabel(ym)}?`)) return;
  S.microplan = S.microplan.filter(m => !(m.date || '').startsWith(ym));
  save();
  renderActive();
}

function copyMicroRow(id) {
  const r = byId(S.microplan, id);
  if (!r) return;
  flushMicroWorkerInputsFromDom(id);
  migrateMicroplanWorkers();
  const copy = { ...r, id: nid(), articleItems: [...microRowArticleItems(r)] };
  copy.workers = microRowWorkers(r).map(w => ({ ...w, id: nid() }));
  delete copy.staffCount;
  delete copy.attendance;
  delete copy.shiftTime;
  delete copy.effPct;
  S.microplan.push(copy);
  save();
  renderActive();
}

function _hasData() {
  return (S.bases && S.bases.length > 0) ||
         (S.nomenclature && S.nomenclature.length > 0) ||
         (S.macroplan && S.macroplan.length > 0) ||
         (S.microplan && S.microplan.length > 0);
}

function _downloadJson(data, filename) {
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function _loadJsonFile(file, onParsed) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try { onParsed(JSON.parse(e.target.result)); }
    catch(err) { _alert('Ошибка чтения файла: ' + err.message); }
  };
  reader.readAsText(file);
}

function _applyFullImport(imported) {
  S.bases = imported.bases || [];
  S.nomenclature = imported.nomenclature || [];
  S.ops = (imported.ops || []).map(function(op) {
    if (op.shiftDuration === undefined) op.shiftDuration = 480;
    if (op.type === undefined) op.type = 'БТК';
    return op;
  });
  if (!imported.customerOrders && imported.contracts && imported.contracts.length) {
    const old = imported.contracts;
    S.customerOrders = old.map(c => ({ ...c, contractId: c.id }));
    S.contracts = old.map(c => ({ id: c.id, number: c.number, articleGp: c.articleGp, name: c.name, quantity: c.quantity, deliveryDate: c.deliveryDate }));
  } else {
    S.contracts = imported.contracts || [];
    S.customerOrders = imported.customerOrders || [];
  }
  S.orders = imported.orders || [];
  S.macroplan = imported.macroplan || [];
  S.microplan = imported.microplan || [];
  migrateMicroplanArticleItems(); migrateMicroplanWorkers(); migrateNomenclatureBundleRows(); migrateMacroplanProcessQty();
  S.schedules = imported.schedules || [];
  S.scheduleMonthOverrides = imported.scheduleMonthOverrides || [];
  S.calOverrides = imported.calOverrides || [];
  migrateSchedulesGraphPreset();
  S.holidays = imported.holidays || [];
  S.manualFrv = Array.isArray(imported.manualFrv) ? imported.manualFrv : [];
  for (const mr of S.manualFrv) { if (!Array.isArray(mr.frvSegments)) mr.frvSegments = []; }
  S.manualFrvExtraMonths = Array.isArray(imported.manualFrvExtraMonths) ? imported.manualFrvExtraMonths : [];
  S.manualFrvPivotExtraRows = Array.isArray(imported.manualFrvPivotExtraRows) ? imported.manualFrvPivotExtraRows : [];
  S.deliveryMatrix = Array.isArray(imported.deliveryMatrix) ? imported.deliveryMatrix : [];
  S.tcRcOverrides = (imported.tcRcOverrides && typeof imported.tcRcOverrides === 'object' && !Array.isArray(imported.tcRcOverrides)) ? imported.tcRcOverrides : {};
  migrateNomenclatureAssortment(); migrateContractsQty(); migrateNomenclatureBPBTK();
  migrateMicroplanOrder2(); migrateMicroplanStage(); migrateOpsProcesses();
  migrateNomenclatureToRoute(); migrateOrderLinks(); migrateMacroplanVolumeType();
  recalcNextId();
  save();
  renderActive();
  _alert('Данные успешно загружены.');
}

function importAllData(file, silent) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const imported = JSON.parse(e.target.result);
      _applyFileData(imported);
    } catch (err) {
      _alert('Ошибка загрузки: ' + err.message);
    }
  };
  reader.readAsText(file);
}

function updContractFieldTab(id, field, val) {
  const c = byId(S.contracts, id);
  if (!c) return;
  if (field === 'quantity') c.quantity = Math.max(0, +val || 0);
  else if (field === 'deliveryDate') c.deliveryDate = val;
  else if (field === 'number') c.number = String(val || '').trim();
  else if (field === 'articleGp') c.articleGp = String(val || '').trim();
  else if (field === 'name') c.name = String(val || '').trim();
  save();
  renderActive();
}

function updContractSchedEntry(id, idx, field, val) {
  const c = byId(S.contracts, id);
  if (!c || !Array.isArray(c.deliverySchedule) || !c.deliverySchedule[idx]) return;
  if (field === 'month') c.deliverySchedule[idx].month = String(val || '');
  else if (field === 'quantity') c.deliverySchedule[idx].quantity = Math.max(0, +val || 0);
  save();
  renderActive();
}

function addContractSchedEntry(id) {
  const c = byId(S.contracts, id);
  if (!c) return;
  if (!Array.isArray(c.deliverySchedule)) c.deliverySchedule = [];
  c.deliverySchedule.push({ month: '', quantity: 0 });
  save();
  renderActive();
}

function removeContractSchedEntry(id, idx) {
  const c = byId(S.contracts, id);
  if (!c || !Array.isArray(c.deliverySchedule)) return;
  c.deliverySchedule.splice(idx, 1);
  save();
  renderActive();
}

function addContractNextMonth(id) {
  const c = byId(S.contracts, id);
  if (!c) return;
  if (!Array.isArray(c.deliverySchedule)) c.deliverySchedule = [];
  const months = c.deliverySchedule.map(s => s.month).filter(Boolean).sort();
  let next;
  if (months.length) {
    const last = months[months.length - 1];
    const [y, m] = last.split('-').map(Number);
    next = `${m === 12 ? y + 1 : y}-${String(m === 12 ? 1 : m + 1).padStart(2, '0')}`;
  } else {
    next = new Date().toISOString().slice(0, 7);
  }
  if (c.deliverySchedule.find(s => s.month === next)) {
    _alert(`Месяц ${mlabel(next)} уже добавлен.`);
    return;
  }
  c.deliverySchedule.push({ month: next, quantity: null });
  save();
  renderActive();
  setTimeout(() => {
    const inp = document.querySelector(`#tab-contracts input[data-cid="${id}"][data-month="${next}"]`);
    if (inp) { inp.focus(); inp.select(); }
  }, 0);
}

function addContractSpecificMonth(id, month) {
  const c = byId(S.contracts, id);
  if (!c || !month) return;
  if (!Array.isArray(c.deliverySchedule)) c.deliverySchedule = [];
  if (c.deliverySchedule.find(s => s.month === month)) return;
  c.deliverySchedule.push({ month, quantity: null });
  save();
  renderActive();
  setTimeout(() => {
    const inp = document.querySelector(`#tab-contracts input[data-cid="${id}"][data-month="${month}"]`);
    if (inp) { inp.focus(); inp.select(); }
  }, 0);
}

function allNomArticleItemsFiltered(op, contractNum, workshop) {
  let contractArticleGps = null;
  if (contractNum) {
    const cs = S.contracts.filter(c => c.number === contractNum);
    if (cs.length) contractArticleGps = new Set(cs.map(c => c.articleGp).filter(Boolean));
  }
  // Determine which stage to show based on op+workshop (via S.ops processType)
  let stageFilter = null;
  if (op && workshop) {
    const opRec = S.ops.find(o => o.name === op && o.workshop === workshop);
    if (opRec && opRec.processType) stageFilter = opRec.processType;
  }
  const items = new Set();
  for (const n of S.nomenclature) {
    if (op && nomRowOps(n).length && !nomRowOps(n).includes(op)) continue;
    if (workshop) {
      const wss = nomRowWorkshops(n);
      if (wss.length && !wss.includes(workshop)) continue;
    }
    if (contractArticleGps && !contractArticleGps.has(n.articleGp)) continue;
    for (const item of (n.route || [])) {
      if (!item.articleItem) continue;
      if (stageFilter && item.stage !== stageFilter) continue;
      items.add(item.articleItem);
    }
  }
  return [...items];
}

function macroFormUpdateWorkshops() {
  const opEl = document.getElementById('mpf-op');
  const wsEl = document.getElementById('mpf-ws');
  if (!wsEl || !opEl) return;
  const op = opEl.value;
  const prevWs = wsEl.value;
  const workshops = [...new Set(S.ops.filter(o => o.name === op).map(o => o.workshop))];
  wsEl.innerHTML = '<option value="">— выбрать —</option>' +
    workshops.map(ws => `<option value="${esc(ws)}"${ws === prevWs ? ' selected' : ''}>${esc(ws)}</option>`).join('');
  macroCtx.formWorkshop = wsEl.value;
  macroFormUpdateArticles();
}

function macroFormUpdateArticles() {
  const opEl = document.getElementById('mpf-op');
  const contEl = document.getElementById('mpf-c');
  const wsEl = document.getElementById('mpf-ws');
  const itemEl = document.getElementById('mpf-item');
  if (!itemEl) return;
  const op = opEl ? opEl.value : '';
  const contractNum = contEl ? contEl.value.trim() : '';
  const workshop = wsEl ? wsEl.value : '';
  macroCtx.formContract = contractNum;
  macroCtx.formWorkshop = workshop;
  const items = allNomArticleItemsFiltered(op, contractNum, workshop);
  const prev = itemEl.value;
  itemEl.innerHTML = '<option value="">— выбрать —</option>' +
    items.map(ai => `<option value="${esc(ai)}"${ai === prev ? ' selected' : ''}>${esc(ai)}</option>`).join('');
  macroFormUpdateNorm();
}

function macroFormUpdateNorm() {
  const opEl = document.getElementById('mpf-op');
  const itemEl = document.getElementById('mpf-item');
  const normEl = document.getElementById('mpf-norm');
  if (!opEl || !itemEl || !normEl) return;
  const op = opEl.value;
  const ai = itemEl.value;
  if (op && ai) {
    const tc = timeCostOf(ai, op);
    if (!normEl._userEdited) normEl.value = tc > 0 ? tc : '';
    normEl.placeholder = tc > 0 ? String(tc) : '—';
  } else {
    if (!normEl._userEdited) normEl.value = '';
    normEl.placeholder = '—';
  }
}

function ctGpSuggestName() {

  const nmEl = document.getElementById('ct-name');
  if (!gpEl || !nmEl) return;
  const gp = gpEl.value.trim();
  if (!gp || nmEl.value.trim()) return;
  const n = S.nomenclature.find(x => x.articleGp === gp);
  if (n) nmEl.value = n.name;

function addContractFromTab() {
  const number = (document.getElementById('ct-num')?.value.trim()) || '';
  const articleGp = (document.getElementById('ct-gp')?.value.trim()) || '';
  let name = (document.getElementById('ct-name')?.value.trim()) || '';
  const firstMonth = mpVal('ct-first-month');
  const firstQty = Math.max(0, +(document.getElementById('ct-first-qty')?.value) || 0);
  if (!number) { _alert('Укажите номер контракта.'); return; }
  if (!articleGp) { _alert('Укажите артикул готовой продукции (ГП).'); return; }
  if (!name) name = nameOf(articleGp) || '';
  const deliverySchedule = firstMonth ? [{ month: firstMonth, quantity: firstQty }] : [];
  const quantity = deliverySchedule.reduce((s, x) => s + x.quantity, 0);
  S.contracts.push({ id: nid(), number, articleGp, name, deliverySchedule, quantity, deliveryDate: '' });
  save();
  renderActive();
}

function renderContracts() {
  const el = document.getElementById('tab-contracts');
  if (!el) return;
  const rows = S.contracts || [];
  const gpDatalist = uniqueGps().map(g => `<option value="${esc(g)}">`).join('');

  const allMonths = [...new Set(
    rows.flatMap(c => (Array.isArray(c.deliverySchedule) ? c.deliverySchedule : []).map(s => s.month).filter(Boolean))
  )].sort();

  const monthHeaders = allMonths.map(m =>
    `<th style="text-align:center;min-width:100px;white-space:nowrap">${esc(mlabel(m))}</th>`
  ).join('');

  const COLSPAN = 5 + allMonths.length + 2;

  let body = '';
  if (!rows.length) {
    body = `<tr><td colspan="${COLSPAN}" class="empty">Пока нет записей — добавьте контракт формой выше.</td></tr>`;
  } else {
    body = rows.map(c => {
      const sched = Array.isArray(c.deliverySchedule) ? c.deliverySchedule : [];
      const totalQty = contractTotalQty(c);
      const stageBreakdown = contractFulfillmentByStage(c.id, totalQty);

      const monthCells = allMonths.map(m => {
        const entry = sched.find(s => s.month === m);
        if (entry) {
          const idx = sched.indexOf(entry);
          return `<td style="text-align:center;padding:4px">
            <div style="display:flex;align-items:center;gap:2px;justify-content:center">
              <input type="number" min="0" step="1" value="${entry.quantity != null && entry.quantity !== 0 ? entry.quantity : ''}" placeholder="0" data-cid="${c.id}" data-month="${m}" style="width:74px;text-align:center;padding:3px 4px;border:1px solid #bfdbfe;border-radius:4px;font-size:12px;background:#eff6ff" onkeydown="if(event.key==='Enter')this.blur()" onblur="updContractSchedEntry(${c.id},${idx},'quantity',+this.value)">
              <button type="button" onclick="removeContractSchedEntry(${c.id},${idx})" style="background:none;border:none;color:#94a3b8;cursor:pointer;font-size:13px;line-height:1;padding:0 2px" title="Убрать месяц">×</button>
            </div>
          </td>`;
        }
        return `<td style="text-align:center;color:#cbd5e1;font-size:13px">
          <button type="button" onclick="addContractSpecificMonth(${c.id},'${esc(m)}')" style="background:none;border:none;color:#cbd5e1;cursor:pointer;font-size:16px;line-height:1;padding:2px 6px" title="Добавить ${mlabel(m)}">+</button>
        </td>`;
      }).join('');

      return `<tr>
        <td><input type="text" value="${esc(c.number)}" style="width:120px" onblur="updContractFieldTab(${c.id},'number',this.value)"></td>
        <td><input type="text" value="${esc(c.articleGp)}" style="width:100px" onblur="updContractFieldTab(${c.id},'articleGp',this.value)"></td>
        <td><input type="text" value="${esc(c.name)}" style="width:180px" onblur="updContractFieldTab(${c.id},'name',this.value)"></td>
        <td class="ro" style="text-align:right;font-weight:600;white-space:nowrap">${totalQty > 0 ? totalQty.toLocaleString('ru') : '—'}</td>
        <td class="ro" style="text-align:left;white-space:nowrap;font-size:12px;padding:4px 6px" title="Осталось запланировать по переделам">${(() => {
          if (!stageBreakdown.length) return totalQty > 0
            ? `<span style="color:#b45309;font-weight:600">не запланировано</span>`
            : '<span style="color:#94a3b8">—</span>';
          const remColor = rem => rem === 0 ? 'color:#16a34a;font-weight:600' : rem < 0 ? 'color:#dc2626;font-weight:600' : 'color:#b45309;font-weight:600';
          const remLabel = rem => rem === 0 ? '<b>✓</b>' : `<b>${rem.toLocaleString('ru')}</b>`;
          return stageBreakdown.map(s => {
            if (s.stage === 'ШЦ') {
              if (s.articles.length === 1) {
                const rem = totalQty - s.articles[0].qty;
                return `<div><span style="${remColor(rem)}">ШЦ ${remLabel(rem)}</span></div>`;
              }
              const rems = s.articles.map(a => totalQty - a.qty);
              const labelRem = rems.some(r => r > 0) ? 1 : rems.some(r => r < 0) ? -1 : 0;
              const parts = s.articles.map((a, i) =>
                `<span style="${remColor(rems[i])}">${remLabel(rems[i])}</span>`
              ).join(' / ');
              return `<div><span style="${remColor(labelRem)}">ШЦ</span> ${parts}</div>`;
            }
            const rem = totalQty - s.qty;
            return `<div><span style="${remColor(rem)}">${s.stage} ${remLabel(rem)}</span></div>`;
          }).join('');
        })()}</td>
        ${monthCells}
        <td style="text-align:center"><button type="button" class="btn btn-outline btn-sm" onclick="addContractNextMonth(${c.id})" title="Добавить следующий месяц">+</button></td>
        <td style="text-align:center"><button type="button" class="btn btn-danger btn-sm" onclick="deleteContract(${c.id})">✕</button></td>
      </tr>`;
    }).join('');
  }

  el.innerHTML = `
    <div class="sec-title">Контракты</div>
    <datalist id="ct-gp-dl">${gpDatalist}</datalist>
    <div class="add-form" style="flex-wrap:wrap;align-items:flex-end;gap:8px">
      <label>Номер контракта<input class="w160" id="ct-num" placeholder="К-2026/01"></label>
      <label>Артикул ГП<input class="w140" id="ct-gp" list="ct-gp-dl" placeholder="из номенклатуры" onblur="ctGpSuggestName()"></label>
      <label>Наименование<input class="w200" id="ct-name" placeholder="подставится из номенклатуры"></label>
      <label>Первый месяц${mpWidget('ct-first-month', '')}</label>
      <label>Кол-во<input class="w80" id="ct-first-qty" type="number" min="0" step="1" placeholder="0"></label>
      <button type="button" class="btn btn-primary" onclick="addContractFromTab()">+ Добавить</button>
    </div>
    <div class="table-wrap" style="margin-top:12px"><table><thead>
      <tr>
        <th>Номер контракта</th><th>Артикул ГП</th><th>Наименование</th>
        <th style="text-align:right">Итого</th>
        <th style="text-align:left;min-width:130px" title="Остаток к планированию по переделам">Остаток по переделам</th>
        ${monthHeaders}
        <th title="Добавить следующий месяц"></th><th></th>
      </tr>
    </thead><tbody>${body}</tbody></table></div>`;
}

function mfrvWorkshopsForOp(opName) {
  return [...new Set(S.ops.filter(o => o.name === opName).map(o => o.workshop))].sort((a, b) => String(a).localeCompare(String(b), 'ru'));
}

function mfrvOpChange() {
  const op = document.getElementById('mfrv-op') ? document.getElementById('mfrv-op').value : '';
  const ws = document.getElementById('mfrv-ws');
  if (!ws) return;
  const list = op ? mfrvWorkshopsForOp(op) : [];
  ws.innerHTML = '<option value="">— выбрать —</option>' + list.map(w => `<option value="${esc(w)}">${esc(w)}</option>`).join('');
}

/** Месяцы для сводной ФРВ: из записей + дополнительные пустые столбцы. */
function mfrvPivotMonthsMerged() {
  const fromData = [...new Set((S.manualFrv || []).map(x => x.month).filter(Boolean))];
  const extra = Array.isArray(S.manualFrvExtraMonths) ? S.manualFrvExtraMonths : [];
  return [...new Set([...fromData, ...extra])].sort();
}

/** Строки сводной: все пары из справочника ops, плюс из manualFrv, плюс из «+ Строка». */
function mfrvPivotRowPairs() {
  const pairs = new Map();
  for (const o of S.ops || []) {
    if (!o || !o.name) continue;
    const k = `${o.name}\u0000${o.workshop || ''}`;
    pairs.set(k, { op: o.name, workshop: o.workshop || '' });
  }
  for (const r of S.manualFrv || []) {
    if (!r || !r.op) continue;
    const k = `${r.op}\u0000${r.workshop || ''}`;
    if (!pairs.has(k)) pairs.set(k, { op: r.op, workshop: r.workshop || '' });
  }
  for (const ex of S.manualFrvPivotExtraRows || []) {
    if (!ex || !ex.op) continue;
    const k = `${ex.op}\u0000${ex.workshop || ''}`;
    if (!pairs.has(k)) pairs.set(k, { op: ex.op, workshop: ex.workshop || '' });
  }
  return [...pairs.values()].sort((a, b) =>
    a.op.localeCompare(b.op, 'ru') || String(a.workshop).localeCompare(String(b.workshop), 'ru'));
}

/** Прокрутка сводной по горизонтали к последним месяцам (вправо). */
function mfrvPivotScrollToEnd() {
  const sc = document.getElementById('mfrv-pivot-scroll');
  if (!sc) return;
  const go = () => {
    sc.scrollLeft = Math.max(0, sc.scrollWidth - sc.clientWidth);
  };
  go();
  setTimeout(go, 50);
}

/** Прокрутка таблиц макроплана (основная и «Загрузка по ОП») к последним месяцам. */
function macroPlanScrollToEnd() {
  const go = (id) => {
    const sc = document.getElementById(id);
    if (!sc) return;
    sc.scrollLeft = Math.max(0, sc.scrollWidth - sc.clientWidth);
  };
  go('macro-plan-scroll');
  go('macro-load-scroll');
  setTimeout(() => {
    go('macro-plan-scroll');
    go('macro-load-scroll');
  }, 50);
}

  const op = document.getElementById('mfrv-pivot-add-op') ? document.getElementById('mfrv-pivot-add-op').value : '';
  const ws = document.getElementById('mfrv-pivot-add-ws');
  if (!ws) return;

function mfrvPivotAddRowPair() {
  const opEl = document.getElementById('mfrv-pivot-add-op');
  const wsEl = document.getElementById('mfrv-pivot-add-ws');
  const op = opEl ? opEl.value : '';
  const workshop = wsEl ? wsEl.value : '';
  if (!op || workshop === '') {
    _alert('Выберите ОП и цех.');
    return;
  }
  if (!S.ops.some(o => o.name === op && String(o.workshop || '') === String(workshop))) {
    _alert('Такой пары ОП и цех нет в справочнике. Добавьте её во вкладке «Справочники».');
    return;
  }
  const k = `${op}\u0000${workshop}`;
  const existing = mfrvPivotRowPairs();
  if (existing.some(p => `${p.op}\u0000${p.workshop || ''}` === k)) {
    _alert('Эта строка уже есть в таблице.');
    return;
  }
  if (!Array.isArray(S.manualFrvPivotExtraRows)) S.manualFrvPivotExtraRows = [];
  S.manualFrvPivotExtraRows.push({ op, workshop });
  save();
  renderManualFrv();
}

/** Следующий календарный месяц после последнего столбца (кнопка + в шапке). */
function mfrvPivotAddNextMonth() {
  if (!Array.isArray(S.manualFrvExtraMonths)) S.manualFrvExtraMonths = [];
  const merged = mfrvPivotMonthsMerged();
  let nextYm;
  if (!merged.length) {
    const d = new Date();
    nextYm = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  } else {
    const last = merged[merged.length - 1];
    const [y, mo] = last.split('-').map(Number);
    const d = new Date(y, mo - 1, 1);
    d.setMonth(d.getMonth() + 1);
    nextYm = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  }
  if (merged.includes(nextYm)) {
    _alert('Этот месяц уже в таблице.');
    return;
  }
  S.manualFrvExtraMonths.push(nextYm);
  save();
  renderManualFrv();
}

/**
 * Сохранение ячейки сводной (ОП+цех+месяц): создание записи из пустой ячейки или правка.
 * el — элемент с data-op, data-ws, data-month (обёртка .mfrv-pivot-cell).
 */
/** Только эффективность в сводной (не трогаем варианты, если блок свёрнут). */
function mfrvPivotCellEffBlur(el) {
  const wrap = el && el.closest ? el.closest('.mfrv-pivot-cell') : null;
  if (!wrap || !wrap.dataset) return;
  const op = wrap.dataset.op || '';
  const workshop = wrap.dataset.ws != null ? wrap.dataset.ws : '';
  const month = wrap.dataset.month || '';
  if (!op || !month) return;
  const ev = el ? parseFloat(el.value) : NaN;
  const effUse = Number.isFinite(ev) ? Math.max(0, Math.min(300, ev)) : 100;
  const r = (S.manualFrv || []).find(
    x => x.op === op && String(x.workshop || '') === String(workshop) && x.month === month
  );
  if (!r) return;
  r.effPct = effUse;
  save();
  renderActive();
}

/** Читает варианты из развёрнутой ячейки сводной. */
function mfrvPivotReadSegmentsFromWrap(wrap) {
  const out = [];
  if (!wrap) return out;
  wrap.querySelectorAll('tr[data-mfrv-p-seg]').forEach(tr => {
    const sid = +tr.dataset.mfrvPSeg || 0;
    const ins = tr.querySelectorAll('input');
    const name = ins[0] ? String(ins[0].value ?? '').trim() : '';
    const people = ins[1] ? +ins[1].value : 0;
    const shiftMin = ins[2] ? +ins[2].value : 0;
    const workDays = ins[3] ? +ins[3].value : 0;
    if (people > 0 && shiftMin > 0 && workDays > 0) {
      out.push({ id: sid || nid(), name, people, shiftMin, workDays });
    }
  });
  return out;
}

/** Сохранение вариантов из сводной (кнопка «Применить» в раскрытии). */
function mfrvPivotSegmentsApply(btn) {
  const wrap = btn && btn.closest ? btn.closest('.mfrv-pivot-cell') : null;
  if (!wrap || !wrap.dataset) return;
  const op = wrap.dataset.op || '';
  const workshop = wrap.dataset.ws != null ? wrap.dataset.ws : '';
  const month = wrap.dataset.month || '';
  if (!op || !month) return;
  const effInp = wrap.querySelector('.mfrv-pivot-eff');
  const ev = effInp ? parseFloat(effInp.value) : NaN;
  const effUse = Number.isFinite(ev) ? Math.max(0, Math.min(300, ev)) : 100;
  const segs = mfrvPivotReadSegmentsFromWrap(wrap);
  const nom = segs.reduce((s, g) => s + Math.max(0, +g.people || 0) * Math.max(0, +g.shiftMin || 0) * Math.max(0, +g.workDays || 0), 0);
  if (nom <= 0) {
    _alert('Укажите хотя бы один вариант: люди > 0, смена (мин) > 0, рабочих дней > 0.');
    return;
  }
  if (!S.ops.some(o => o.name === op && String(o.workshop || '') === String(workshop))) {
    _alert('Пара ОП и цех должны быть в справочнике (вкладка «Справочники»).');
    return;
  }
  const r = (S.manualFrv || []).find(
    x => x.op === op && String(x.workshop || '') === String(workshop) && x.month === month
  );
  if (r) {
    r.frvSegments = segs;
    r.frvMin = 0;
    r.effPct = effUse;
  } else {
    S.manualFrv.push({ id: nid(), op, workshop, month, frvMin: 0, effPct: effUse, frvSegments: segs });
  }
  save();
  renderActive();
}

/** Стабильный id оболочки панели вариантов в ячейке сводной (пустая ячейка — до «Применить»). */
function mfrvPivotWrapDomId(op, workshop, ym, r) {
  if (r && r.id != null) return 'mfrv-s-wrap-' + r.id;
  const s = String(op || '') + '\x1e' + String(workshop != null ? workshop : '') + '\x1e' + String(ym || '');
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
  return 'mfrv-pc-' + (h >>> 0).toString(36);
}

/** Одна ячейка сводной: сумма чел-мин по вариантам, эфф.%, панель вариантов (как в таблице ФРВ). */
function manualFrvPivotCellHtml(op, workshop, ym) {
  const r = (S.manualFrv || []).find(
    x => x.op === op && String(x.workshop || '') === String(workshop) && x.month === ym
  );
  const opA = esc(op);
  const wsA = esc(workshop);
  const ymA = esc(ym);
  const wrapId = mfrvPivotWrapDomId(op, workshop, ym, r);
  const sum = r ? manualFrvNominalForRecord(r) : 0;
  const ev = r && r.effPct != null ? esc(String(r.effPct)) : '100';
  const segs = (r && Array.isArray(r.frvSegments) && r.frvSegments.length)
    ? r.frvSegments
    : [{ id: 0, name: '', people: '', shiftMin: '', workDays: '' }];
  const segRows = segs.map(seg => {
    const sid = seg.id && +seg.id > 0 ? +seg.id : 0;
    const n = seg.name != null && seg.name !== '' ? esc(String(seg.name)) : '';
    const p = seg.people != null && seg.people !== '' ? esc(String(seg.people)) : '';
    const sh = seg.shiftMin != null && seg.shiftMin !== '' ? esc(String(seg.shiftMin)) : '';
    const d = seg.workDays != null && seg.workDays !== '' ? esc(String(seg.workDays)) : '';
    return `<tr data-mfrv-p-seg="${sid}">
      <td style="padding:1px"><input type="text" style="width:72px;font-size:10px" value="${n}" placeholder="назв."></td>
      <td style="padding:1px"><input type="number" min="0" step="1" style="width:44px;font-size:10px" value="${p}" placeholder="чел."></td>
      <td style="padding:1px"><input type="number" min="0" step="1" style="width:44px;font-size:10px" value="${sh}" placeholder="мин"></td>
      <td style="padding:1px"><input type="number" min="0" step="1" style="width:40px;font-size:10px" value="${d}" placeholder="дн."></td>
    </tr>`;
  }).join('');
  const del = r
    ? `<button type="button" class="btn btn-danger btn-sm" style="padding:2px 6px;font-size:10px;line-height:1.2" onclick="delManualFrv(${r.id})" title="Удалить">✕</button>`
    : '';
  return `<div class="mfrv-pivot-cell" data-op="${opA}" data-ws="${wsA}" data-month="${ymA}">
    <div class="mfrv-pivot-inp" style="flex-direction:column;align-items:flex-start;gap:2px">
      <div style="font-size:10px;color:#64748b;white-space:nowrap">Σ <b>${sum}</b> чел-мин</div>
      <div style="display:flex;flex-wrap:wrap;gap:4px;align-items:center">
        ${del}
      </div>
      <div class="mfrv-s-wrap" id="${wrapId}" style="margin-top:2px">
        <button type="button" class="mfrv-s-trigger mfrv-s-trigger--sm" onclick="toggleMfrvSegPanelById(event,'${wrapId}')" title="Название, люди, смена (мин), рабочих дней">▼ Варианты</button>
        <div class="mfrv-s-panel" onclick="event.stopPropagation()">
          <table style="width:100%;margin-top:2px;border-collapse:collapse;font-size:10px">
            <thead><tr><th style="font-weight:600;padding:2px">Назв.</th><th style="font-weight:600;padding:2px">Чел.</th><th style="font-weight:600;padding:2px">Смена</th><th style="font-weight:600;padding:2px">Дней</th></tr></thead>
            <tbody>${segRows}</tbody>
          </table>
          <button type="button" class="btn btn-outline btn-sm" style="margin-top:4px;width:100%;font-size:10px;padding:2px" onclick="event.stopPropagation();mfrvPivotAddBlankSegRow(this)">+ строка варианта</button>
          <button type="button" class="btn btn-primary btn-sm" style="margin-top:4px;width:100%;font-size:10px;padding:3px" onclick="event.stopPropagation();mfrvPivotSegmentsApply(this)">Применить варианты</button>
        </div>
      </div>
    </div>
  </div>`;
}

function addManualFrv() {
  const op = (document.getElementById('mfrv-op') && document.getElementById('mfrv-op').value) || '';
  const workshop = (document.getElementById('mfrv-ws') && document.getElementById('mfrv-ws').value) || '';
  const month = mpVal('mfrv-month');
  const effRaw = document.getElementById('mfrv-eff') && document.getElementById('mfrv-eff').value;
  const effPct = parseFloat(effRaw);
  const segs = mfrvCollectAddFormSegments();
  const nom = segs.reduce((s, g) => s + (+g.people || 0) * (+g.shiftMin || 0) * (+g.workDays || 0), 0);
  if (!op || !workshop || !month) {
    _alert('Заполните: ОП, цех, месяц.');
    return;
  }
  if (!S.ops.some(o => o.name === op && o.workshop === workshop)) {
    _alert('Выберите пару ОП / цех из справочника.');
    return;
  }
  if (nom <= 0) {
    _alert('Добавьте хотя бы один вариант: люди, смена (минуты), рабочих дней в месяце — все значения > 0. Несколько строк — разные режимы (например разная длина смены).');
    return;
  }
  const effUse = Number.isFinite(effPct) ? Math.max(0, Math.min(300, effPct)) : 100;
  if (S.manualFrv.some(x => x.op === op && (x.workshop || '') === workshop && x.month === month)) {
    _alert('Для этой пары ОП+цех+месяц запись уже есть. Измените строку в таблице.');
    return;
  }
  const newRec = { id: nid(), op, workshop, month, frvMin: 0, effPct: effUse, frvSegments: segs };
  S.manualFrv.push(newRec);
  save();
  renderActive();
}

function addManualFrvSegmentRow(recordId) {
  const r = byId(S.manualFrv, recordId);
  if (!r) return;
  if (!Array.isArray(r.frvSegments)) r.frvSegments = [];
  manualFrvSegOpenRowId = recordId;
  r.frvSegments.push({ id: nid(), name: '', people: 0, shiftMin: 480, workDays: 0, effPct: 100 });
  save();
  renderActive();
}

function delManualFrvSegment(recordId, segId) {
  const r = byId(S.manualFrv, recordId);
  if (!r || !Array.isArray(r.frvSegments)) return;
  manualFrvSegOpenRowId = recordId;
  r.frvSegments = r.frvSegments.filter(s => +s.id !== +segId);
  save();
  renderActive();
}

function updManualFrvSeg(recordId, segId, field, rawVal) {
  const r = byId(S.manualFrv, recordId);
  if (!r || !Array.isArray(r.frvSegments)) return;
  const seg = r.frvSegments.find(s => +s.id === +segId);
  if (!seg) return;
  manualFrvSegOpenRowId = recordId;
  if (field === 'name') seg.name = String(rawVal ?? '').trim();
  else if (field === 'people') seg.people = Math.max(0, parseFloat(rawVal) || 0);
  else if (field === 'shiftMin') {
    const v = +rawVal;
    seg.shiftMin = Number.isFinite(v) && v > 0 ? v : 0;
  } else if (field === 'workDays') seg.workDays = Math.max(0, parseFloat(rawVal) || 0);
  else if (field === 'effPct') seg.effPct = Math.max(0, parseFloat(rawVal) || 0);
  save();
  renderActive();
}

function updManualFrv(id, field, val) {
  const r = byId(S.manualFrv, id);
  if (!r) return;
  if (field === 'effPct') {
    const v = +val;
    if (!Number.isFinite(v) || v < 0 || v > 300) return;
    r.effPct = v;
  } else if (field === 'frvMin') {
    const v = +val;
    if (!Number.isFinite(v) || v < 0) return;
    r.frvMin = v;
    if (v > 0) r.frvSegments = [];
  }
  save();
  renderActive();
}

/** Краткая строка в таблице ФРВ: номинал и число вариантов. */
function manualFrvSegSummaryText(r) {
  if (!r) return '';
  const sum = manualFrvNominalForRecord(r);
  const segs = Array.isArray(r.frvSegments) ? r.frvSegments : [];
  let valid = 0;
  for (const seg of segs) {
    const p = Math.max(0, +seg.people || 0);
    const sh = Math.max(0, +seg.shiftMin || 0);
    const d = Math.max(0, +seg.workDays || 0);
    if (p > 0 && sh > 0 && d > 0) valid++;
  }
  const leg = (!valid && (+r.frvMin || 0) > 0) ? ' · устар. сумма' : '';
  const varLabel = valid ? `${valid} вар.` : (segs.length ? `${segs.length} чернов.` : '— вар.');
  return `Σ ${Math.round(sum).toLocaleString('ru')} чел-мин · ${varLabel}${leg}`;
}

    : '';
  let segBody = '';
  if (segs.length) {

        <td><input type="number" min="0" step="1" style="width:64px;font-size:11px" value="${seg.shiftMin != null ? esc(seg.shiftMin) : ''}" onkeydown="if(event.key==='Enter'){event.preventDefault();event.stopPropagation();this.blur()}" onblur="updManualFrvSeg(${r.id},${seg.id},'shiftMin',this.value)"></td>
        <td><input type="number" min="0" step="1" style="width:56px;font-size:11px" value="${seg.workDays != null ? esc(seg.workDays) : ''}" onkeydown="if(event.key==='Enter'){event.preventDefault();event.stopPropagation();this.blur()}" onblur="updManualFrvSeg(${r.id},${seg.id},'workDays',this.value)"></td>

  }
  const weightedEff = manualFrvWeightedEff(r);
  return `${legacy}
  <table class="mfrv-s-table"><thead><tr>
    <th>Название</th><th>Люди</th><th>Смена, мин</th><th>Раб. дней</th><th>Доступное время</th><th></th>
  </tr></thead><tbody>${segBody}</tbody></table>

function manualFrvSegMainCellHtml(r) {
  const inner = manualFrvSegPanelTableHtml(r);
  return `<div class="mfrv-s-wrap" id="mfrv-s-wrap-${r.id}">
    <div style="font-size:12px;line-height:1.4;font-weight:600;color:#0f172a;white-space:nowrap">${manualFrvSegSummaryText(r)}</div>
    <button type="button" class="mfrv-s-trigger" onclick="toggleMfrvSegPanelById(event,'mfrv-s-wrap-${r.id}')" title="Варианты ФРВ: название, люди, смена, дни">▼ Варианты</button>
    <div class="mfrv-s-panel" onclick="event.stopPropagation()">${inner}</div>
  </div>`;
}

function bindMfrvSegPanelOutsideOnce() {
  if (manualFrvSegPanelOutsideBound) return;
  manualFrvSegPanelOutsideBound = true;
  document.addEventListener('mousedown', (e) => {
    const t = e.target;
    if (!t || !t.closest) return;
    document.querySelectorAll('#tab-manualFrv .mfrv-s-wrap.mfrv-s-open').forEach(wrap => {
      if (!wrap.contains(t)) wrap.classList.remove('mfrv-s-open');
    });
  }, true);
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    document.querySelectorAll('#tab-manualFrv .mfrv-s-wrap.mfrv-s-open').forEach(w => w.classList.remove('mfrv-s-open'));
  });
}

function toggleMfrvSegPanelById(ev, wrapId) {
  if (ev) {
    ev.preventDefault();
    ev.stopPropagation();
  }
  const wrap = document.getElementById(wrapId);
  if (!wrap) return;
  const opening = !wrap.classList.contains('mfrv-s-open');
  document.querySelectorAll('#tab-manualFrv .mfrv-s-wrap.mfrv-s-open').forEach(w => {
    if (w !== wrap) w.classList.remove('mfrv-s-open');
  });
  wrap.classList.toggle('mfrv-s-open', opening);
}

function toggleMfrvSegPanel(ev, recordId) {
  toggleMfrvSegPanelById(ev, 'mfrv-s-wrap-' + recordId);
}

function addCustomerOrder() {
  const number       = document.getElementById('cf-num').value.trim();
  const contractId   = +document.getElementById('cf-contract').value;
  const rawDate      = document.getElementById('cf-date').value;
  const base         = document.getElementById('cf-base').value;
  const articleGp    = document.getElementById('cf-gp').value;
  const name         = document.getElementById('cf-name').value.trim();
  const quantity     = parseFloat(document.getElementById('cf-qty').value);
  if (!number || !articleGp || isNaN(quantity) || quantity <= 0) {
    _alert('Заполните: номер заказа, артикул ГП, кол-во (положительное число)');
    return;
  }
  const deliveryDate = rawDate;
  S.customerOrders.push({ id: nid(), number, contractId, deliveryDate, base, articleGp, name, quantity });
  save(); renderActive();
}

function addProductionOrder() {
  const number    = document.getElementById('of-num').value.trim();
  const articleGp = document.getElementById('of-gp').value;
  const quantity  = Math.max(0, +(document.getElementById('of-qty')?.value) || 0);
  if (!number || !articleGp) {
    _alert('Заполните: номер заказа и артикул ГП');
    return;
  }
  if (S.orders.some(o => o.number === number)) {
    _alert('Заказ на производство с таким номером уже существует.');
    return;
  }
  S.orders.push({ id: nid(), number, articleGp, name: nameOf(articleGp)||'', quantity });
  if (!S.orderLinks) S.orderLinks = [];
  save(); renderActive();
}
function updProdOrder(id, f, v) {
  const o = byId(S.orders, id);
  if (!o) return;
  o[f] = v;
  save();
  renderActive();
}

async function deleteMacroGroup(contractId, articleItem, op, workshop, volumeType) {
  const vt = volumeType || 'main';
  if (!await _confirm('Удалить все строки макроплана для этой группы?')) return;
  S.macroplan = S.macroplan.filter(
    r => !(r.contractId === contractId && r.articleItem === articleItem && r.op === op && (r.workshop || '') === (workshop || '') && (r.volumeType||'main') === vt)
  );
  save();
  renderMacroplan();
}
